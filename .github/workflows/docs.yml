name: docs

# Builds docs/ with Zensical and publishes it to GitHub Pages at shadewright.io (ADR-0010).
# Pages must be set to "GitHub Actions" as the source, with the custom domain in the repository settings.
on:
  push:
    branches: [main]
    paths: ["docs/**", "overrides/**", "includes/**", "zensical.toml", "requirements-docs.in", "requirements-docs.txt", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "overrides/**", "includes/**", "zensical.toml", "requirements-docs.in", "requirements-docs.txt", ".github/workflows/docs.yml"]
  # A published release refreshes the version shown in the top bar (the step "Fetch release facts" below).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A release event runs on the tag: build the docs of main, which is what the site shows.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: pip install --require-hashes -r requirements-docs.txt
      # The top bar shows the latest release and the star count, fetched here at build time so that no reader's
      # browser calls api.github.com (#365). The partial is git-ignored; a failure only leaves it out.
      - name: Fetch release facts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name) || version=
          stars=$(gh api "repos/${REPO}" --jq .stargazers_count) || stars=
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$stars" =~ ^[0-9]+$ ]]; then
            {
              echo '<ul class="md-source__facts">'
              echo "  <li class=\"md-source__fact md-source__fact--version\">${version}</li>"
              echo "  <li class=\"md-source__fact md-source__fact--stars\">${stars}</li>"
              echo '</ul>'
            } > overrides/partials/source-facts.html
          else
            echo "::warning::Could not read the release facts; the top bar shows none."
          fi
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
