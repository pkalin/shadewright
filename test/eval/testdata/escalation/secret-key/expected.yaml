# Synthetic, not from the fleet repository: the expectation of the escalation scenario secret-key (#504), in the
# fleet's scenario schema. No lab run has observed it.
apiVersion: scenarios.shadewright.io/v1alpha1
kind: Scenario
name: secret-key
summary: The web Deployment's env reads key api-token of the Secret web-credentials, which exists but no longer has that key, so the container stays in CreateContainerConfigError.
incident:
  reason: Failed
  status: synthetic
  source: The kubelet's Warning event Failed on the pod, with the note couldn't find key api-token in Secret demo/web-credentials, attributed to Deployment demo/web through ReplicaSet.
  object:
    apiVersion: apps/v1
    kind: Deployment
    namespace: demo
    name: web
diagnosis:
  status: synthetic
  evidence:
    - fact: the container state reason CreateContainerConfigError
      source: the pod's container status in the context
    - fact: the environment variable API_TOKEN of the web container reads the key api-token
      source: the Deployment's env valueFrom.secretKeyRef, read with get_resource
    - fact: the Secret is there and only its key is missing, learned through the yes/no check, never by reading Secrets
      source: check_missing_reference, from the kubelet's own report in the pod status
outcome:
  type: refusal
  status: synthetic
  reason: Secrets are excluded (design 10.10) and no catalog action changes an env reference; a person is notified.
  phase: NeedsIntervention
