apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "verifier-rolebinding" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadewright.labels" (dict "component" "verifier" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shadewright.resourceName" (dict "suffix" "verifier-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "verifier" "context" $) }}
  namespace: {{ .Release.Namespace }}
