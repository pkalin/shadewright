<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Shadewright executor</title>
  <desc id="d">Zoom into the executor identity. A RemediationRequest passes the limits (concurrency, a lock per target, a circuit breaker with one probe when half-open; held back requests wait as Queued), then the policy engine (policy, settings, live target), the source mapping from Flux objects to the one file in Git, and the freshness check. The patcher edits the file in place and the semantic diff checks the result. The kill switch gate reads spec.paused right before every Git write. The Key Vault signer signs for the GitHub App, which creates the branch, commit and pull request outside the cluster; the request waits in AwaitingApproval. Refusals end in Denied or NeedsIntervention. Planned, drawn dashed: merge, delivery check against the Flux lastAppliedRevision, and the verifier.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7d7999"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c24fc" stop-opacity=".35"/><stop offset="1" stop-color="#7c24fc" stop-opacity=".08"/></linearGradient>
    <style>
      .lane{fill:#13121c;stroke:#2a2740}
      .lanet{fill:#7d7999;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#1d1b2b;stroke:#3a3556;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#7c24fc;stroke-width:1.6}
      .ext{fill:#16222a;stroke:#2f5d63;stroke-width:1.2}
      .pl{fill:#1d1b2b;stroke:#5a5478;stroke-width:1.2;stroke-dasharray:5 4}
      .plk{fill:url(#glow);stroke:#7c24fc;stroke-width:1.6;stroke-dasharray:6 4}
      .ple{fill:#16222a;stroke:#2f5d63;stroke-width:1.2;stroke-dasharray:5 4}
      .pn{fill:#8a85a8;font-size:10px;font-weight:600;letter-spacing:.06em}
      .h{fill:#f1edff;font-size:15px;font-weight:650}
      .s{fill:#a9a4c4;font-size:12.5px}
      .id{fill:none;stroke:#7c24fc;stroke-opacity:.55;stroke-dasharray:5 5;stroke-width:1.2}
      .idt{fill:#a879ff;font-size:11.5px;font-weight:600;letter-spacing:.06em}
      .f{stroke:#a879ff;stroke-width:1.8;fill:none}
      .fp{stroke:#a879ff;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
      .r{stroke:#7d7999;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .lbl{fill:#c6a8ff;font-size:11.5px}
      .no{fill:#ff8fa3;font-size:11.5px;font-weight:600}
    </style>
  </defs>

  <rect width="1120" height="800" rx="18" fill="#0e0e16"/>

  <!-- lanes -->
  <rect class="lane" x="24" y="24" width="250" height="752" rx="14"/>
  <text class="lanet" x="44" y="54">CLUSTER</text>
  <rect class="lane" x="292" y="24" width="536" height="752" rx="14"/>
  <text class="lanet" x="312" y="54">SHADEWRIGHT</text>
  <rect class="lane" x="846" y="24" width="250" height="752" rx="14"/>
  <text class="lanet" x="866" y="54">OUTSIDE THE CLUSTER</text>

  <!-- identity -->
  <rect class="id" x="312" y="74" width="496" height="678" rx="12"/>
  <text class="idt" x="794" y="94" text-anchor="end">EXECUTOR IDENTITY · CR status + Git App</text>

  <!-- cluster lane -->
  <rect class="box" x="44" y="200" width="210" height="72" rx="10"/>
  <text class="h" x="60" y="226">Policy &amp; settings</text>
  <text class="s" x="60" y="247">owned by the cluster admin</text>
  <text class="s" x="60" y="263">spec.paused · limits</text>

  <rect class="box" x="44" y="330" width="210" height="72" rx="10"/>
  <text class="h" x="60" y="356">Flux objects</text>
  <text class="s" x="60" y="377">Kustomization, GitRepository</text>
  <text class="s" x="60" y="393">inventory · revision</text>

  <!-- executor -->
  <rect class="key" x="420" y="110" width="280" height="56" rx="12"/>
  <text class="h" x="440" y="135">RemediationRequest</text>
  <text class="s" x="440" y="154">from the analyzer, never authority</text>

  <rect class="box" x="578" y="200" width="210" height="72" rx="10"/>
  <text class="h" x="594" y="226">Limits</text>
  <text class="s" x="594" y="247">concurrency · lock per target</text>
  <text class="s" x="594" y="263">breaker · half-open probe</text>
  <text class="lbl" x="578" y="292">held back as Queued, not failed:</text>
  <text class="lbl" x="578" y="308">checked again every 30 s</text>

  <rect class="box" x="332" y="200" width="210" height="72" rx="10"/>
  <text class="h" x="348" y="226">Policy engine</text>
  <text class="s" x="348" y="247">policy · settings</text>
  <text class="s" x="348" y="263">live target state</text>
  <text class="no" x="332" y="296">not allowed → Denied</text>

  <rect class="box" x="332" y="330" width="210" height="72" rx="10"/>
  <text class="h" x="348" y="356">Source mapping</text>
  <text class="s" x="348" y="377">Flux objects → the one file</text>
  <text class="s" x="348" y="393">in Git · input budget</text>
  <text class="no" x="332" y="424">unmappable → NeedsIntervention</text>

  <rect class="box" x="578" y="330" width="210" height="72" rx="10"/>
  <text class="h" x="594" y="356">Freshness check</text>
  <text class="s" x="594" y="377">plan inputs still current</text>
  <text class="s" x="594" y="393">rechecked every 5 minutes</text>
  <text class="no" x="578" y="424">stale plan → Superseded</text>

  <rect class="box" x="332" y="460" width="210" height="72" rx="10"/>
  <text class="h" x="348" y="486">Patcher + semantic diff</text>
  <text class="s" x="348" y="507">in-place patch · kustomize</text>
  <text class="s" x="348" y="523">only the one field changes</text>
  <text class="no" x="332" y="554">any other change → refused</text>

  <rect class="box" x="578" y="460" width="210" height="72" rx="10"/>
  <text class="h" x="594" y="486">Kill switch gate</text>
  <text class="s" x="594" y="507">spec.paused · right before</text>
  <text class="s" x="594" y="523">every Git write</text>
  <text class="no" x="578" y="554">paused or unreadable → no write</text>

  <rect class="box" x="578" y="590" width="210" height="72" rx="10"/>
  <text class="h" x="594" y="616">AwaitingApproval</text>
  <text class="s" x="594" y="637">phase · waits for a human</text>
  <text class="s" x="594" y="653">approval of the head commit</text>

  <rect class="pl" x="332" y="590" width="210" height="72" rx="10"/>
  <text class="h" x="348" y="616">After the merge</text>
  <text class="s" x="348" y="637">merge · delivery check</text>
  <text class="s" x="348" y="653">applied · verifier</text>
  <text class="pn" x="526" y="653" text-anchor="end">planned</text>

  <!-- outside -->
  <rect class="ext" x="866" y="460" width="210" height="72" rx="10"/>
  <text class="h" x="882" y="486">Key Vault signer</text>
  <text class="s" x="882" y="507">signs the App JWT, RS256</text>
  <text class="s" x="882" y="523">key stays in the vault</text>

  <rect class="ext" x="866" y="590" width="210" height="72" rx="10"/>
  <text class="h" x="882" y="616">GitHub App</text>
  <text class="s" x="882" y="637">branch · commit · pull request</text>
  <text class="s" x="882" y="653">one repository, shadewright/*</text>

  <!-- legend -->
  <rect class="box" x="866" y="690" width="30" height="16" rx="4"/>
  <text class="lbl" x="906" y="703">built</text>
  <rect class="pl" x="866" y="716" width="30" height="16" rx="4"/>
  <text class="lbl" x="906" y="729">designed, not built</text>

  <!-- flow -->
  <path class="f" d="M640 166V194" marker-end="url(#a)"/>
  <path class="f" d="M572 236H548" marker-end="url(#a)"/>
  <path class="r" d="M254 236H326" marker-end="url(#m)"/>
  <text class="lbl" x="262" y="228">reads</text>
  <path class="f" d="M520 272V324" marker-end="url(#a)"/>
  <path class="r" d="M254 366H326" marker-end="url(#m)"/>
  <text class="lbl" x="262" y="358">reads</text>
  <path class="f" d="M542 366H572" marker-end="url(#a)"/>
  <path class="f" d="M760 402V440H437V454" marker-end="url(#a)"/>
  <path class="f" d="M542 496H572" marker-end="url(#a)"/>
  <path class="f" d="M788 496H860" marker-end="url(#a)"/>
  <text class="lbl" x="806" y="488">sign</text>
  <path class="f" d="M971 532V584" marker-end="url(#a)"/>
  <text class="lbl" x="981" y="562">token</text>
  <path class="f" d="M860 626H794" marker-end="url(#a)"/>
  <text class="lbl" x="800" y="618">opens PR</text>
  <path class="fp" d="M572 626H548" marker-end="url(#a)"/>
  <path class="r" d="M149 402V626H326" marker-end="url(#m)"/>
  <text class="lbl" x="160" y="618">observes revision</text>
</svg>
