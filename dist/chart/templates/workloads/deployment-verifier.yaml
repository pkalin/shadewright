{{- $_ := include "shadewright.validate" (dict "component" "verifier" "context" $) }}
{{- $c := .Values.verifier }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "verifier" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadewright.labels" (dict "component" "verifier" "context" $) | nindent 4 }}
    control-plane: verifier
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels:
      {{- include "shadewright.selectorLabels" (dict "component" "verifier" "context" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: verifier
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "shadewright.labels" (dict "component" "verifier" "context" $) | nindent 8 }}
        control-plane: verifier
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "shadewright.resourceName" (dict "suffix" "verifier" "context" $) }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with $c.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with include "shadewright.imagePullSecrets" (dict "component" "verifier" "context" $) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
      - name: verifier
        image: {{ include "shadewright.image" (dict "component" "verifier" "context" $) | quote }}
        imagePullPolicy: {{ $c.image.pullPolicy }}
        command:
        - /verifier
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- with $c.metricsTLS.secretName }}
        - --metrics-cert-path=/etc/shadewright/metrics-tls
        {{- end }}
        {{- end }}
        {{- /* Always rendered: an empty list watches no namespace (never all of them), and says so in the Pod spec. */}}
        - --watch-namespaces={{ join "," (include "shadewright.verifierWatchNamespaces" $ | fromJsonArray) }}
        {{- with $c.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GOMEMLIMIT
          value: {{ include "shadewright.goMemLimit" (dict "component" "verifier" "context" $) | quote }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml $c.resources | nindent 10 }}
        {{- with $c.metricsTLS.secretName }}
        volumeMounts:
        - name: metrics-tls
          mountPath: /etc/shadewright/metrics-tls
          readOnly: true
        {{- end }}
      {{- with $c.metricsTLS.secretName }}
      volumes:
      - name: metrics-tls
        secret:
          secretName: {{ . | quote }}
          defaultMode: 0444
      {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "shadewright.affinity" (dict "component" "verifier" "context" $) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with $c.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
