<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Working with models</title>
  <desc id="d">The model sits in the middle of a harness of code. Code tells it the rules: the prompt, the output schema and the bounds of the policy. Code shows it a redacted, bounded context. On escalation it may call read-only tools. Code checks its answer: a quote found in the evidence, the closed action catalog and the policy. Its only output is a proposal, a RemediationRequest. Below, records and traces describe what ran, without the text. Dashed boxes are planned: a step log with replay by step, and one bounded extra round when the answer names missing data a tool can fetch.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7d7999"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c24fc" stop-opacity=".35"/><stop offset="1" stop-color="#7c24fc" stop-opacity=".08"/></linearGradient>
    <style>
      .lane{fill:#13121c;stroke:#2a2740}
      .lanet{fill:#7d7999;font-size:13px;font-weight:600;letter-spacing:.14em}
      .box{fill:#1d1b2b;stroke:#3a3556;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#7c24fc;stroke-width:1.6}
      .ext{fill:#16222a;stroke:#2f5d63;stroke-width:1.2}
      .pn{fill:#8a85a8;font-size:10px;font-weight:600;letter-spacing:.06em}
      .h{fill:#f1edff;font-size:15px;font-weight:650}
      .s{fill:#a9a4c4;font-size:12.5px}
      .id{fill:none;stroke:#7c24fc;stroke-opacity:.55;stroke-dasharray:5 5;stroke-width:1.2}
      .idt{fill:#a879ff;font-size:11.5px;font-weight:600;letter-spacing:.06em}
      .f{stroke:#a879ff;stroke-width:1.8;fill:none}
      .r{stroke:#7d7999;stroke-width:1.4;fill:none;stroke-dasharray:4 4}
      .lbl{fill:#c6a8ff;font-size:11.5px}
      .no{fill:#ff8fa3;font-size:11.5px;font-weight:600}
          .pl{fill:none;stroke:#7d7999;stroke-width:1.2;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#0e0e16"/>

  <rect class="lane" x="24" y="24" width="952" height="400" rx="14"/>
  <text class="lanet" x="44" y="54">THE HARNESS: CODE AROUND THE MODEL</text>

  <rect class="box" x="390" y="76" width="220" height="68" rx="10"/>
  <text class="h" x="406" y="102">Told</text>
  <text class="s" x="406" y="123">prompt · schema · policy bounds</text>

  <rect class="box" x="50" y="196" width="250" height="68" rx="10"/>
  <text class="h" x="66" y="222">Sees</text>
  <text class="s" x="66" y="243">redacted, bounded blocks</text>

  <rect class="key" x="390" y="190" width="220" height="80" rx="12"/>
  <text class="h" x="406" y="224">The model</text>
  <text class="s" x="406" y="246">advises, never decides</text>

  <rect class="box" x="700" y="196" width="250" height="68" rx="10"/>
  <text class="pn" x="934" y="212" text-anchor="end">ESCALATION ONLY</text>
  <text class="h" x="716" y="226">May call</text>
  <text class="s" x="716" y="247">read-only tools</text>

  <rect class="pl" x="700" y="310" width="250" height="56" rx="10"/>
  <text class="h" x="716" y="334">One extra round</text>
  <text class="s" x="716" y="353">planned</text>

  <rect class="box" x="390" y="316" width="220" height="68" rx="10"/>
  <text class="h" x="406" y="342">Checked by</text>
  <text class="s" x="406" y="363">quotes · catalog · policy</text>

  <rect class="key" x="390" y="456" width="220" height="68" rx="12"/>
  <text class="h" x="406" y="482">RemediationRequest</text>
  <text class="s" x="406" y="503">a proposal, never authority</text>

  <rect class="box" x="50" y="456" width="250" height="68" rx="10"/>
  <text class="h" x="66" y="482">Records and traces</text>
  <text class="s" x="66" y="503">what ran, never the text</text>

  <rect class="pl" x="700" y="456" width="250" height="68" rx="10"/>
  <text class="h" x="716" y="482">Step log and replay</text>
  <text class="s" x="716" y="503">planned</text>

  <path class="f" d="M500 144V184" marker-end="url(#a)"/>
  <path class="f" d="M300 230H384" marker-end="url(#a)"/>
  <path class="f" d="M610 230H694" marker-end="url(#a)" marker-start="url(#a)"/>
  <path class="f" d="M500 270V310" marker-end="url(#a)"/>
  <path class="f" d="M500 384V450" marker-end="url(#a)"/>
  <path class="r" d="M825 310V270" marker-end="url(#m)"/>
  <path class="r" d="M175 424V450" marker-end="url(#m)"/>
  <path class="r" d="M825 424V450" marker-end="url(#m)"/>
</svg>
