name: Chart test

# Lints and renders the Helm chart and installs it on Kind: with explicit values, and with chart-testing (ct lint,
# then the default values plus image.allowTag with images built from the checkout, ct install and helm test), and
# scans the rendered chart and config/ for misconfigurations with Trivy (HIGH and CRITICAL fail the run unless
# .trivyignore.yaml ignores them with a reason).
# Called by ci.yml on pull requests and by chart.yml before a release tag publishes the chart.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the jobs run; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true
      executor_digest:
        description: Digest of the executor image to install by (a release tag run, verified by chart.yml); empty uses the v0.1.0 image.
        type: string
        default: ""
      analyzer_digest:
        description: Digest of the analyzer image to install by (as executor_digest); both or neither.
        type: string
        default: ""

permissions: {}

env:
  HELM_VERSION: v4.3.1
  CT_VERSION: 3.15.0
  YAMLLINT_VERSION: 1.33.0
  YAMALE_VERSION: 6.0.0
  UV_VERSION: 0.13.7

jobs:
  chart:
    name: Lint and render
    if: ${{ inputs.run != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # this workflow publishes on tags: no cache a pull request could poison

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint and compare the chart with config/default
        run: make chart-lint test-chart

  # Part of this workflow, so it runs under the same `run` input as the other jobs (the `chart` group of
  # hack/ci-changed.sh) and is a job of ci.yml's `chart` call, already covered by ci-ok. The chart is rendered with
  # helm template (which fails loudly) and the output is scanned: trivy config on the chart directory skips a
  # chart that does not render with only a warning, which would be a silent pass. Trivy comes from the official
  # release, checked against a pinned sha256 (hack/install-trivy.sh).
  trivy-config:
    name: Trivy config scan
    if: ${{ inputs.run != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Trivy
        run: hack/install-trivy.sh "${RUNNER_TEMP}/trivy-bin"

      # The default values of the chart test (image.allowTag only, the rest default), so the rendered objects are
      # what a default install creates.
      - name: Render the chart
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rendered"
          helm template shadewright dist/chart --namespace shadewright-system \
            --values dist/chart/ci/default-values.yaml --set clusterId=trivy-scan > "${RUNNER_TEMP}/rendered/chart.yaml"
          grep -q '^kind: Deployment$' "${RUNNER_TEMP}/rendered/chart.yaml"

      # Findings of any severity are listed; HIGH and CRITICAL fail the run (exit code 1) unless
      # .trivyignore.yaml names them with a reason. A scanner error also fails the run.
      - name: Scan the rendered chart
        run: |
          "${RUNNER_TEMP}/trivy-bin/trivy" config --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml --skip-version-check "${RUNNER_TEMP}/rendered"

      - name: Scan config/
        run: |
          "${RUNNER_TEMP}/trivy-bin/trivy" config --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml --skip-version-check config

  install:
    name: Install on Kind
    if: ${{ inputs.run != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # this workflow publishes on tags: no cache a pull request could poison

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Pull requests and main use the v0.1.0 image digests; a release tag installs by the digests chart.yml
      # resolved and verified, the same pair its publish job writes into the chart.
      - name: Install the chart on Kind and check the permissions
        env:
          EXECUTOR_DIGEST: ${{ inputs.executor_digest }}
          ANALYZER_DIGEST: ${{ inputs.analyzer_digest }}
        run: make test-chart-install

      # The cluster is deleted even when a step failed.
      - name: Delete the Kind cluster
        if: ${{ always() }}
        run: make chart-kind-delete

  chart-testing:
    name: chart-testing (default values on Kind)
    if: ${{ inputs.run != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # this workflow publishes on tags: no cache a pull request could poison

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Installs ct, yamllint and yamale at the versions above (ct's download is verified with cosign).
      - name: Setup chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CT_VERSION }}
          yamllint_version: ${{ env.YAMLLINT_VERSION }}
          yamale_version: ${{ env.YAMALE_VERSION }}
          uv_version: ${{ env.UV_VERSION }}

      # yamllint, the Chart.yaml schema, maintainers (a GitHub handle, no email) and helm lint (ct.yaml).
      - name: ct lint
        run: ct lint --config ct.yaml

      # The default values run repository:appVersion, so the images are built from this checkout under that
      # tag and loaded into Kind (pinned KIND_VERSION): the install tests this code with the default values and
      # image.allowTag (dist/chart/ci/default-values.yaml).
      - name: Create the Kind cluster and load the images
        run: make chart-ct-cluster

      - name: Install with the default values and check what it may read and write
        run: make test-chart-defaults

      # Installs with ci/default-values.yaml (image.allowTag only, the rest default), runs helm test and uninstalls.
      - name: ct install
        run: ct install --config ct.yaml

      - name: Delete the Kind cluster
        if: ${{ always() }}
        run: make chart-ct-kind-delete
