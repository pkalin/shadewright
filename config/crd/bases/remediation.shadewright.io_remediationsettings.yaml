---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: remediationsettings.remediation.shadewright.io
spec:
  group: remediation.shadewright.io
  names:
    categories:
    - shadewright
    kind: RemediationSettings
    listKind: RemediationSettingsList
    plural: remediationsettings
    singular: remediationsettings
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.paused
      name: Paused
      type: boolean
    - jsonPath: .spec.maxConcurrentRemediations
      name: Max concurrent
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RemediationSettings is the single cluster-wide configuration
          object, named default.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the settings.
            properties:
              maxAnalysesPerDay:
                default: 100
                description: maxAnalysesPerDay limits model-backed analyses per UTC
                  day; 0 disables the model.
                format: int32
                maximum: 10000
                minimum: 0
                type: integer
              maxConcurrentRemediations:
                default: 1
                description: maxConcurrentRemediations limits requests between PolicyChecked
                  and a terminal phase.
                format: int32
                maximum: 20
                minimum: 1
                type: integer
              paused:
                default: false
                description: |-
                  paused stops every write: pull requests, auto-merge and issues. Analysis continues. Checked right
                  before each write.
                type: boolean
              repositories:
                description: |-
                  repositories Shadewright may open pull requests in. URLs are unique, so a Flux source matches at most one
                  entry.
                items:
                  description: |-
                    GitRepository is a repository Shadewright may open pull requests in. Requests and policies refer to it by
                    name, so the model never chooses a URL or credentials.
                  properties:
                    github:
                      description: github holds GitHub App settings.
                      properties:
                        appClientID:
                          description: appClientID is the GitHub App's client ID.
                          maxLength: 64
                          minLength: 1
                          type: string
                        installationID:
                          description: installationID is the App's installation that
                            covers this repository.
                          format: int64
                          minimum: 1
                          type: integer
                        signer:
                          description: signer says where the App's private key is.
                          properties:
                            azureKeyVault:
                              description: azureKeyVault signs with a non-exportable
                                Key Vault key through workload identity.
                              properties:
                                keyID:
                                  description: |-
                                    keyID is the key identifier, with or without a version, for example
                                    https://<vault>.vault.azure.net/keys/github-app.
                                  maxLength: 2048
                                  pattern: ^https://[a-z0-9-]+\.vault\.azure\.net/keys/[A-Za-z0-9-]+(/[0-9a-f]{32})?$
                                  type: string
                              required:
                              - keyID
                              type: object
                          type: object
                          x-kubernetes-validations:
                          - message: a signer must be configured
                            rule: has(self.azureKeyVault)
                      required:
                      - appClientID
                      - installationID
                      - signer
                      type: object
                    name:
                      description: name is how policies and requests refer to the
                        repository.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    provider:
                      description: provider selects the Git hosting adapter.
                      enum:
                      - GitHub
                      type: string
                    targetBranch:
                      default: main
                      description: targetBranch is the only branch pull requests may
                        target. The branch Flux tracks must equal it.
                      maxLength: 255
                      minLength: 1
                      pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$
                      type: string
                      x-kubernetes-validations:
                      - message: must be a plain branch name, not HEAD, refs/...,
                          shadewright/... or one containing '..' or '.lock'
                        rule: '!self.contains(''..'') && !self.endsWith(''.lock'')
                          && !self.contains(''.lock/'') && self != ''HEAD'' && !self.startsWith(''refs/'')
                          && !self.startsWith(''shadewright/'')'
                    url:
                      description: |-
                        url is the HTTPS clone URL, without credentials, query or fragment. It must match the URL of the Flux
                        source that delivers a target, or no change is made.
                      maxLength: 512
                      pattern: ^https://[a-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9_~-][A-Za-z0-9_.~-]*)+$
                      type: string
                  required:
                  - name
                  - provider
                  - url
                  type: object
                  x-kubernetes-validations:
                  - message: github must be set if and only if provider is GitHub
                    rule: 'self.provider == ''GitHub'' ? has(self.github) : !has(self.github)'
                  - message: a GitHub repository URL must be https://github.com/<owner>/<repo>
                      in lower case, without .git
                    rule: self.provider != 'GitHub' || (self.url.matches('^https://github[.]com/[a-z0-9-]+/[a-z0-9_.-]+$')
                      && !self.url.endsWith('.git') && !self.url.endsWith('/.') &&
                      !self.url.endsWith('/..'))
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: repository URLs must be unique
                  rule: self.all(r, self.exists_one(s, s.url == r.url))
            type: object
          status:
            description: status reports whether the settings are usable.
            properties:
              conditions:
                description: conditions report problems such as an unreachable signer.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation the status describes.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: there is one RemediationSettings and it is named default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
