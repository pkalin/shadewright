apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/component: analyzer
    app.kubernetes.io/managed-by: kustomize
  name: analyzer-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: analyzer-role
subjects:
- kind: ServiceAccount
  name: analyzer
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/component: analyzer
    app.kubernetes.io/managed-by: kustomize
  name: analyzer-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analyzer-role
subjects:
- kind: ServiceAccount
  name: analyzer
  namespace: system
