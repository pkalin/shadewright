{{- if include "shadewright.verifierEnabled" . }}
{{- /*
The verifier's reads in the namespaces it watches (ADR-0030 section 7). Bound only by the RoleBindings of
verifier-watch-rolebindings.yaml, one per namespace, never by a ClusterRoleBinding.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "verifier-watch-role" "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "verifier" "context" $) | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
{{- end }}
