# This rule is not used by the project shadewright itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to remediation.shadewright.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
  name: remediationsettings-viewer-role
rules:
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationsettings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationsettings/status
  verbs:
  - get
