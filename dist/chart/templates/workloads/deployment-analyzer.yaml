{{- $c := .Values.analyzer }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 4 }}
    control-plane: analyzer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shadewright.selectorLabels" (dict "component" "analyzer" "context" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: analyzer
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 8 }}
        control-plane: analyzer
        {{- if $c.identity.azure.clientId }}
        # Asks the AKS workload identity webhook to inject the federated token (design section 9).
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "shadewright.resourceName" (dict "suffix" "analyzer" "context" $) }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: analyzer
        image: {{ include "shadewright.image" (dict "component" "analyzer" "context" $) | quote }}
        imagePullPolicy: {{ $c.image.pullPolicy }}
        command:
        - /analyzer
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        {{- end }}
        - --watch-namespaces={{ join "," (required "analyzer.watchNamespaces needs at least one namespace" .Values.analyzer.watchNamespaces) }}
        - --cluster-id={{ required "clusterId is required" .Values.clusterId }}
        {{- with .Values.analyzer.maxIncidents }}
        - --max-incidents={{ . }}
        {{- end }}
        {{- with $c.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
        {{- end }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml $c.resources | nindent 10 }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
