{{- if and .Values.metrics.enabled .Values.metrics.secure }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "metrics-reader" "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
{{- end }}
