name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      - name: Check the API reference is up to date
        run: |
          make api-docs
          git diff --exit-code -- docs/reference/api.md || {
            echo "::error::docs/reference/api.md is stale: run 'make api-docs' and commit the result"
            exit 1
          }
          test -z "$(git status --porcelain -- docs/reference/)" || {
            echo "::error::make api-docs wrote files that are not committed"
            git status --porcelain -- docs/reference/
            exit 1
          }
