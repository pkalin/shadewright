apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "executor-leader-election-rolebinding" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadewright.labels" (dict "component" "executor" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shadewright.resourceName" (dict "suffix" "executor-leader-election-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "executor" "context" $) }}
  namespace: {{ .Release.Namespace }}
