apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer-rolebinding" "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer" "context" $) }}
  namespace: {{ .Release.Namespace }}
