name: Fuzz

# Runs every Go fuzz target (FUZZ_TARGETS in the Makefile) for a few minutes each, one matrix job per target, weekly
# and by hand. A target in a package with a file built only with the tag redactwork (internal/redact, its kept
# reading of the release before and internal/incidentcontext) runs with that tag, which `make fuzz` passes itself
# (hack/fuzz-targets.sh --tags). Pull
# requests run only the seed corpora, inside `make test`. Not part of the pull request graph of ci.yml, so a
# finding here never blocks a pull request: it fails this run and leaves the failing input as an artifact.
# Reproduce one with `go test -run '<FuzzName>/<file>' ./<package>` after copying the file to the package's
# testdata/fuzz/<FuzzName>/ (add `-tags redactwork` where make fuzz does, or a failure of the work bound does not
# show), and commit it there with the fix as a regression seed.
on:
  schedule:
    - cron: "29 4 * * 2" # Tuesdays 04:29 UTC
  workflow_dispatch:

permissions: {}

env:
  FUZZTIME: 4m
  GOFLAGS: -mod=readonly
  GOWORK: off

jobs:
  targets:
    name: list targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the fuzz targets
        id: list
        run: echo "list=$(make --no-print-directory fuzz-list)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    permissions:
      contents: read
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # FUZZTIME (4m) plus the module download and the instrumented build, with room for a slow runner.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go test keeps the inputs that found new coverage in $GOCACHE/fuzz. Saving them under a new key on every run
      # (restored from the newest) lets the corpus grow from week to week instead of starting from the seeds.
      # Caches are per branch, and this workflow runs only on schedule and by hand.
      - name: Find the fuzz cache
        id: fuzzcache
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      - name: Restore and save the fuzz corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzzcache.outputs.dir }}
          key: fuzz-corpus-${{ matrix.target }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-${{ runner.os }}-

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: make fuzz-one TARGET="${TARGET}" FUZZTIME="${FUZZTIME}"

      # go test writes a failing input to testdata/fuzz/<FuzzName>/ in the package; collect only the new files.
      # Also when the job timed out (cancelled), so an input written before that is not lost.
      - name: Collect failing inputs
        if: failure() || cancelled()
        run: |
          mkdir -p fuzz-failures
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while read -r f; do
            mkdir -p "fuzz-failures/$(dirname "$f")"
            cp "$f" "fuzz-failures/$f"
          done

      - name: Upload failing inputs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: fuzz-failures/
          if-no-files-found: ignore
          retention-days: 30
