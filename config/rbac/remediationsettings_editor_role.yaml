# This rule is not used by the project shadewright itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the remediation.shadewright.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
  name: remediationsettings-editor-role
rules:
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationsettings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationsettings/status
  verbs:
  - get
