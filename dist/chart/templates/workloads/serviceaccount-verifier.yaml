{{- /* No annotations: the verifier has no cloud identity, no model access and no Git App credentials (ADR-0030 section 7). */}}
{{- $_ := include "shadewright.validate" (dict "component" "verifier" "context" $) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "verifier" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadewright.labels" (dict "component" "verifier" "context" $) | nindent 4 }}
