---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: verifier-role
  namespace: system
rules:
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationrequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - remediation.shadewright.io
  resources:
  - verificationreports
  verbs:
  - create
  - get
- apiGroups:
  - remediation.shadewright.io
  resources:
  - verificationreports/status
  verbs:
  - update
