<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Scoring analysis records outside the cluster</title>
  <desc id="d">Overview of ADR-0047, left to right. The analyzer of the www cluster, which we do not run, creates a record in the records container. A blob created event goes through Event Grid to a storage queue. A Container Apps job takes one message at a time, makes one call to the judge model (Anthropic or OpenAI, the other family than the analysis) and creates a score in the scores container. Beside the flow, the job reads its model keys from Key Vault and puts a record it refuses in a quarantine container. The size and schema checks, the redactor, the spend reservations and monthly caps, the virtual network, the identity and its grants, and the retention periods are in the ADR text, not in the picture.</desc>
    <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c24fc" stop-opacity=".35"/><stop offset="1" stop-color="#7c24fc" stop-opacity=".08"/></linearGradient>
    <style>
      .box{fill:#1d1b2b;stroke:#3a3556;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#7c24fc;stroke-width:1.6}
      .ext{fill:#16222a;stroke:#2f5d63;stroke-width:1.2}
      .h{fill:#f1edff;font-size:15px;font-weight:650}
      .s{fill:#a9a4c4;font-size:12.5px}
      .f{stroke:#a879ff;stroke-width:1.8;fill:none}
      .l{fill:#c6a8ff;font-size:12.5px;font-weight:600}
    </style>
  </defs>
  <rect width="1130" height="380" rx="18" fill="#0e0e16"/>

  <rect class="ext" x="30" y="150" width="120" height="70" rx="12"/>
  <text class="h" x="90.0" y="182.0" text-anchor="middle">Analyzer</text>
  <text class="s" x="90.0" y="201.0" text-anchor="middle">www cluster</text>
  <rect class="ext" x="220" y="150" width="120" height="70" rx="12"/>
  <text class="h" x="280.0" y="182.0" text-anchor="middle">Records</text>
  <text class="s" x="280.0" y="201.0" text-anchor="middle">container</text>
  <rect class="ext" x="410" y="150" width="120" height="70" rx="12"/>
  <text class="h" x="470.0" y="190.0" text-anchor="middle">Event Grid</text>
  <rect class="box" x="600" y="150" width="120" height="70" rx="12"/>
  <text class="h" x="660.0" y="190.0" text-anchor="middle">Queue</text>
  <rect class="key" x="790" y="150" width="120" height="70" rx="12"/>
  <text class="h" x="850.0" y="182.0" text-anchor="middle">Intake job</text>
  <text class="s" x="850.0" y="201.0" text-anchor="middle">Container Apps</text>
  <rect class="box" x="980" y="150" width="120" height="70" rx="12"/>
  <text class="h" x="1040.0" y="182.0" text-anchor="middle">Scores</text>
  <text class="s" x="1040.0" y="201.0" text-anchor="middle">container</text>
  <rect class="ext" x="775" y="20" width="150" height="60" rx="12"/>
  <text class="h" x="850.0" y="47.0" text-anchor="middle">Judge model</text>
  <text class="s" x="850.0" y="66.0" text-anchor="middle">Anthropic or OpenAI</text>
  <rect class="ext" x="585" y="20" width="150" height="60" rx="12"/>
  <text class="h" x="660.0" y="55.0" text-anchor="middle">Key Vault</text>
  <rect class="box" x="790" y="290" width="120" height="60" rx="12"/>
  <text class="h" x="850.0" y="325.0" text-anchor="middle">Quarantine</text>
  <path class="f" d="M150 185H220" marker-end="url(#a)"/>
  <text class="l" x="185.0" y="177" text-anchor="middle">create</text>
  <path class="f" d="M340 185H410" marker-end="url(#a)"/>
  <text class="l" x="375.0" y="177" text-anchor="middle">created</text>
  <path class="f" d="M530 185H600" marker-end="url(#a)"/>
  <text class="l" x="565.0" y="177" text-anchor="middle">event</text>
  <path class="f" d="M720 185H790" marker-end="url(#a)"/>
  <text class="l" x="755.0" y="177" text-anchor="middle">message</text>
  <path class="f" d="M910 185H980" marker-end="url(#a)"/>
  <text class="l" x="945" y="177" text-anchor="middle">score</text>
  <path class="f" d="M850 150V80" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="862" y="120">1 call</text>
  <path class="f" d="M660 80V115H815V150" marker-end="url(#a)"/>
  <text class="l" x="680" y="107">keys</text>
  <path class="f" d="M850 220V290" marker-end="url(#a)"/>
  <text class="l" x="862" y="260">on a hit</text>
</svg>
