name: Chart

# Publishes the Helm chart in dist/chart (generated with Kubebuilder's helm/v2-alpha plugin, then adjusted by
# hand). Pull requests and pushes to main lint, render, compare and install it through ci.yml, which calls
# chart-test.yml; a release tag runs the same tests here first. Only a v* tag
# publishes it to ghcr.io/<owner>/charts/shadewright, and only the publish job has packages: write and
# id-token: write. Before packaging it writes the digests of the tag's signed images into values.yaml, so the
# published chart runs them by digest. After the push it signs the chart by digest with cosign keyless (GitHub
# OIDC, no key to store) and verifies the signature against the identity of this workflow, so a mismatch fails
# the run.
#
# A tag must point at a commit on main (hack/require-on-main.sh, before anything is pushed). Two kinds of tag
# publish. vX.Y.Z (cut by release-please) must equal version and appVersion of Chart.yaml. A
# semver pre-release tag (vX.Y.Z-rc.1, created by hand with `gh release create --prerelease`) has no bump
# commit: the chart is packaged with --version and --app-version taken from the tag
# (hack/chart-release-version.sh). Helm pushes only the version tag, so a pre-release moves no floating tag.
# When the chart is pushed, the release-notes job (contents: write, nothing else) waits for the GitHub release
# of the tag and appends the image and chart digests and the cosign and gh verify commands to its body
# (hack/release-verify-notes.sh), between markers, so a rerun replaces the section instead of adding a second.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  HELM_VERSION: v4.3.1

jobs:
  test:
    name: Test the chart
    permissions:
      contents: read
    uses: ./.github/workflows/chart-test.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form

  publish:
    name: Publish the chart
    # Release tags only. For vX.Y.Z the chart version must equal the tag (release-please bumps both in the
    # release pull request), so a tag never publishes the chart of another version; a pre-release tag takes
    # its version from the tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    # Digests only, not secrets: the release-notes job writes them into the release.
    outputs:
      executor_digest: ${{ steps.digests.outputs.executor }}
      analyzer_digest: ${{ steps.digests.outputs.analyzer }}
      chart_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing, this job only
    steps:
      # A release tag must point at a commit on main: the signature identity only says "this workflow on a v*
      # tag", so the history of main is fetched for the check below.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}

      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: hack/require-on-main.sh HEAD origin/main

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Work out the chart version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: hack/chart-release-version.sh "${TAG}" dist/chart/Chart.yaml >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Docker (for the image inspection and cosign, which read its credentials) and Helm (for the push) log in
      # with the job token before anything reads ghcr.io, so private packages work too.
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          printf '%s' "${TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin

      # The images of this tag, by digest, each verified (signature and SPDX SBOM attestation) against the identity of the Images
      # workflow on this very tag before its digest goes into the chart. The Images workflow of the same tag runs in parallel, so
      # this waits for each image and a signature that verifies: every 30 s, at most 30 minutes, then the run
      # fails with the image it waited for. Re-run the failed jobs of this run once the Images workflow of the
      # tag has finished. The signature check is on the digest, so a tag moved after the check changes nothing.
      - name: Write the signed image digests into values.yaml
        id: digests
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          identity="https://github.com/${REPOSITORY}/.github/workflows/images.yml@refs/tags/${TAG}"
          deadline=$(( $(date +%s) + 1800 ))
          for image in executor analyzer; do
            ref="ghcr.io/${owner}/shadewright-${image}"
            d=""
            until [ -n "${d}" ]; do
              got="$(docker buildx imagetools inspect "${ref}:${TAG#v}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
              if printf '%s' "${got}" | grep -Eq '^sha256:[a-f0-9]{64}$' && cosign verify \
                  --certificate-identity "${identity}" \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  "${ref}@${got}" > /dev/null 2>&1 && cosign verify-attestation --type spdxjson \
                  --certificate-identity "${identity}" \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  "${ref}@${got}" > /dev/null 2>&1; then
                d="${got}"
              elif [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "no image ${ref}:${TAG#v} signed and attested by ${identity} after 30 minutes; re-run this job once the Images workflow of ${TAG} has finished" >&2
                exit 1
              else
                echo "waiting for ${ref}:${TAG#v} and its signature"
                sleep 30
              fi
            done
            printf -v "digest_${image}" '%s' "${d}"
            echo "${ref}@${d}" >> "${GITHUB_STEP_SUMMARY}"
          done
          echo "executor=${digest_executor}" >> "${GITHUB_OUTPUT}"
          echo "analyzer=${digest_analyzer}" >> "${GITHUB_OUTPUT}"
          hack/chart-set-digests.sh dist/chart/values.yaml "${digest_executor}" "${digest_analyzer}"
          rendered="$(helm template publish-check dist/chart --set clusterId=publish-check)"
          for d in "${digest_executor}" "${digest_analyzer}"; do
            grep -qF "@${d}\"" <<<"${rendered}" || { echo "the chart does not run ${d}" >&2; exit 1; }
          done

      # A pre-release has no commit that bumps Chart.yaml, so its version and appVersion come from the tag.
      - name: Package the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${PRERELEASE}" = true ]; then
            helm package dist/chart --destination "${RUNNER_TEMP}/chart" --version "${VERSION}" --app-version "${VERSION}"
          else
            helm package dist/chart --destination "${RUNNER_TEMP}/chart"
          fi

      - name: Push the chart
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm push "${RUNNER_TEMP}/chart/shadewright-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts" 2>&1 | tee "${RUNNER_TEMP}/push.log"
          digest="$(sed -n 's/^Digest: //p' "${RUNNER_TEMP}/push.log")"
          if ! printf '%s' "${digest}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "no chart digest in the helm push output" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "CHART_REF=ghcr.io/${owner}/charts/shadewright@${digest}" >> "${GITHUB_ENV}"
          echo "oci://ghcr.io/${owner}/charts/shadewright:${VERSION} (${digest})" >> "${GITHUB_STEP_SUMMARY}"

      # Always by digest: a tag can move, the digest names the pushed chart.
      - name: Sign the chart (keyless)
        run: cosign sign --yes "${CHART_REF}"

      # The identity is this workflow file on a release tag (also a pre-release tag, v[0-9].*) of this repository,
      # issued by GitHub's OIDC provider. Anything else (another workflow, another repository, a branch) fails the run.
      - name: Verify the signature
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity="^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/chart\.yml@refs/tags/v[0-9].*$"
          cosign verify \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CHART_REF}" > /dev/null

      # Artifact Hub reads its repository metadata (dist/artifacthub-repo.yml, the Verified Publisher label) from
      # the tag `artifacthub.io` next to the chart, once per repository. Pushed on every release tag so that a
      # deleted tag comes back with the next release; an unchanged file gives the same manifest. Uses the registry
      # login of the step above (docker credentials).
      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6

      - name: Push the Artifact Hub repository metadata
        env:
          OWNER: ${{ github.repository_owner }}
        working-directory: dist
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          oras push "ghcr.io/${owner}/charts/shadewright:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # Runs only when everything above succeeded, so the release never lists digests that are not published. It
  # is the only job with contents: write: it needs no registry access (the digests come from the publish job)
  # and no secret beyond the job token. The release is made by release-please (App token) or by hand
  # (`gh release create vX.Y.Z-rc.1 --prerelease --target main`), at the same moment as the tag, so it exists
  # long before the images are done; if it does not, the job retries for five minutes and then fails.
  release-notes:
    name: Add digests and verify steps to the release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # edit the release body of this tag, this job only
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Append the digests and the verify commands to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          EXECUTOR: ${{ needs.publish.outputs.executor_digest }}
          ANALYZER: ${{ needs.publish.outputs.analyzer_digest }}
          CHART: ${{ needs.publish.outputs.chart_digest }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/body.md"
          notes="${RUNNER_TEMP}/notes.md"
          found=false
          for _ in $(seq 1 20); do
            if gh release view "${TAG}" --json body --jq .body > "${body}" 2> "${RUNNER_TEMP}/view.err"; then
              found=true
              break
            fi
            echo "no GitHub release for ${TAG} yet, retrying in 15 s"
            sleep 15
          done
          if [ "${found}" != true ]; then
            echo "no GitHub release for ${TAG} after 5 minutes (last error: $(cat "${RUNNER_TEMP}/view.err")); create it, then re-run this job" >&2
            exit 1
          fi
          hack/release-verify-notes.sh "${GH_REPO}" "${TAG}" "${EXECUTOR}" "${ANALYZER}" "${CHART}" < "${body}" > "${notes}"
          gh release edit "${TAG}" --notes-file "${notes}"
          echo "release ${TAG}: digests and verify commands added" >> "${GITHUB_STEP_SUMMARY}"
