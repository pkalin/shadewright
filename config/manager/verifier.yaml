apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: system
  labels:
    control-plane: verifier
    app.kubernetes.io/component: verifier
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: verifier
      app.kubernetes.io/component: verifier
      app.kubernetes.io/name: shadewright
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: verifier
      labels:
        control-plane: verifier
        app.kubernetes.io/component: verifier
        app.kubernetes.io/name: shadewright
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /verifier
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          # One RoleBinding per namespace here, in config/watch (test/rbac checks they match).
          - --watch-namespaces=demo
          # Hashed into every fingerprint: give each cluster its own. The Helm chart (#83) sets it from a value.
        image: controller:latest
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The Warning event at the Incident cap is about this Pod. Without it neither that event nor the
        # Normal AnalysisSkipped event about an Incident (a first analysis skipped, NotRecent) is written.
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        name: verifier
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: verifier
      terminationGracePeriodSeconds: 10
