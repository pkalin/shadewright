# The verifier's own identity (ADR-0030 section 7). It has no cloud identity: no model access and no Git App
# credentials, so no workload identity annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/component: verifier
    app.kubernetes.io/managed-by: kustomize
  name: verifier
  namespace: system
