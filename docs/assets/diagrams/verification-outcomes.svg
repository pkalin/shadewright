.lanet{fill:#7d7999;font-size:13px;font-weight:600;letter-spacing:.12em}
.h{fill:#f1edff;font-size:15px;font-weight:650}
.s{fill:#a9a4c4;font-size:12.5px}
.lbl{fill:#c6a8ff;font-size:12.5px}
.no{fill:#ff8fa3;font-size:12.5px;font-weight:600}
.f{stroke:#a879ff;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
</style></defs>
<rect width="1380" height="710" rx="18" fill="#0e0e16"/>
<text class="lanet" x="20" y="62">1  MERGE RECEIPT</text>
<text class="lanet" x="280" y="62">2  DELIVERY</text>
<text class="lanet" x="540" y="62">3  THREE OUTCOMES</text>
<text class="lanet" x="910" y="62">4  STABLE WINDOW</text>
<text class="lanet" x="1120" y="62">5  TERMINAL PHASES</text>
<rect class="bt" x="20" y="80" width="230" height="420" rx="10"/>
<text class="h" x="34" y="106">Merge receipt</text>
<text class="s" x="34" y="128">status.mergeReceipt</text>
<text class="s" x="34" y="147">written once, in the same</text>
<text class="s" x="34" y="166">status write that sets Merged;</text>
<text class="s" x="34" y="185">never changed (CEL rule)</text>
<text class="s" x="34" y="204"></text>
<text class="lbl" x="34" y="223">repository.url</text>
<text class="lbl" x="34" y="242">repository.installationID</text>
<text class="lbl" x="34" y="261">targetBranch</text>
<text class="lbl" x="34" y="280">pullRequest</text>
<text class="lbl" x="34" y="299">headSHA</text>
<text class="lbl" x="34" y="318">mergeCommitSHA</text>
<text class="lbl" x="34" y="337">mergedAt</text>
<text class="s" x="34" y="356"></text>
<text class="s" x="34" y="375">No merge commit from the host:</text>
<text class="s" x="34" y="394">phase Merged, no receipt,</text>
<text class="s" x="34" y="413">then Inconclusive</text>
<text class="s" x="34" y="432">(NoMergeReceipt)</text>
<rect class="pl" x="280" y="80" width="230" height="420" rx="10"/>
<text class="h" x="294" y="106">Delivery against the receipt</text>
<text class="s" x="294" y="128">Merged to WaitingForDelivery</text>
<text class="s" x="294" y="147">status.deadline: mergedAt</text>
<text class="s" x="294" y="166">plus one hour</text>
<text class="s" x="294" y="185"></text>
<text class="s" x="294" y="204">The check asks about</text>
<text class="s" x="294" y="223">mergeCommitSHA on</text>
<text class="s" x="294" y="242">targetBranch, through the</text>
<text class="s" x="294" y="261">repository in the receipt</text>
<text class="s" x="294" y="280"></text>
<text class="s" x="294" y="299">Flux applied the merge commit</text>
<text class="s" x="294" y="318">or a descendant, Ready:</text>
<text class="s" x="294" y="337">Delivered True, phase</text>
<text class="s" x="294" y="356">Verifying</text>
<text class="s" x="294" y="375"></text>
<text class="s" x="294" y="394">Flux failed on the merge</text>
<text class="s" x="294" y="413">commit: Failed (DeliveryFailed)</text>
<rect class="pl" x="540" y="80" width="330" height="150" rx="10"/>
<text class="h" x="554" y="106">Rolled out</text>
<text class="s" x="554" y="128">Conditions: Delivered, RolledOut</text>
<text class="s" x="554" y="147">Evidence: Flux applied the merge commit</text>
<text class="s" x="554" y="166">or a descendant; every pod runs the</text>
<text class="s" x="554" y="185">applied template, checked again each sample</text>
<text class="s" x="554" y="204">Read with: get on the Kustomization and</text>
<text class="s" x="554" y="223">the target, the host's ancestry answer</text>
<rect class="pl" x="540" y="245" width="330" height="120" rx="10"/>
<text class="h" x="554" y="271">Configured</text>
<text class="s" x="554" y="293">Condition: Configured (new type)</text>
<text class="s" x="554" y="312">Evidence: the live field equals the</text>
<text class="s" x="554" y="331">desired value (sourcemap.FieldFor)</text>
<text class="s" x="554" y="350">Read with: get on the target</text>
<rect class="pl" x="540" y="380" width="330" height="172" rx="10"/>
<text class="h" x="554" y="406">Cleared</text>
<text class="s" x="554" y="428">Condition: Cleared (new type)</text>
<text class="s" x="554" y="447">Evidence: a fresh VerificationReport:</text>
<text class="s" x="554" y="466">every desired replica on the applied</text>
<text class="s" x="554" y="485">revision, no OOM kill, restarts flat</text>
<text class="s" x="554" y="504">Read with: get on the report, written</text>
<text class="s" x="554" y="523">by shadewright-verifier, which lists</text>
<text class="s" x="554" y="542">the pods</text>
<text class="lbl" x="540" y="580">Verified sums the three up and decides the phase.</text>
<text class="lbl" x="540" y="600">The executor writes them; kubectl shadewright</text>
<text class="lbl" x="540" y="620">explain shows three lines.</text>
<rect class="pl" x="910" y="80" width="190" height="420" rx="10"/>
<text class="h" x="924" y="106">Stable window</text>
<text class="s" x="924" y="128">Phase Verifying</text>
<text class="s" x="924" y="147"></text>
<text class="s" x="924" y="166">The verifier samples</text>
<text class="s" x="924" y="185">the pods every 30 s and</text>
<text class="s" x="924" y="204">keeps baselines and</text>
<text class="s" x="924" y="223">the window in its report</text>
<text class="s" x="924" y="242"></text>
<text class="s" x="924" y="261">Good sample: every</text>
<text class="s" x="924" y="280">desired replica on the</text>
<text class="s" x="924" y="299">applied revision, Ready,</text>
<text class="s" x="924" y="318">no restart over baseline</text>
<text class="s" x="924" y="337"></text>
<text class="s" x="924" y="356">The executor rechecks</text>
<text class="s" x="924" y="375">the template and the</text>
<text class="s" x="924" y="394">report each reconcile</text>
<text class="s" x="924" y="413"></text>
<text class="s" x="924" y="432">Success after stableFor</text>
<text class="s" x="924" y="451">plus nodeGrace</text>
<rect class="pl" x="1120" y="80" width="240" height="100" rx="10"/>
<text class="h" x="1134" y="106">Succeeded</text>
<text class="s" x="1134" y="128">Cleared True (NoRecurrence)</text>
<text class="s" x="1134" y="147">Verified True</text>
<text class="s" x="1134" y="166">after stableFor, good sample</text>
<rect class="pl" x="1120" y="205" width="240" height="170" rx="10"/>
<text class="h" x="1134" y="231">Inconclusive</text>
<text class="s" x="1134" y="253">Verified Unknown, with a reason:</text>
<text class="s" x="1134" y="272">TargetGone, TargetReplaced,</text>
<text class="s" x="1134" y="291">ValueChanged, PartialRollout,</text>
<text class="s" x="1134" y="310">RolloutSuperseded,</text>
<text class="s" x="1134" y="329">DeliveryBlocked, StaleReport,</text>
<text class="s" x="1134" y="348">RevertApplied, and more</text>
<rect class="pl" x="1120" y="400" width="240" height="130" rx="10"/>
<text class="h" x="1134" y="426">Failed</text>
<text class="s" x="1134" y="448">Verified False, with a reason:</text>
<text class="s" x="1134" y="467">OOMKilled, Restarted,</text>
<text class="s" x="1134" y="486">RolloutStuck, DeliveryFailed,</text>
<text class="s" x="1134" y="505">KedaNotReady</text>
<rect class="pl" x="1120" y="565" width="240" height="115" rx="10"/>
<text class="h" x="1134" y="591">Revert request</text>
<text class="s" x="1134" y="613">analyzer, no model call (#96)</text>
<text class="s" x="1134" y="632">spec.reverts, approvalRequired</text>
<text class="s" x="1134" y="651">true; goes through policy</text>
<text class="no" x="1134" y="670">Inconclusive never leads to one</text>
