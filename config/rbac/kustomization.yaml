resources:
# Two identities (design 2.2, ADR-0005): the executor reconciles requests and writes their status; the
# analyzer writes incidents and creates requests. Each directory holds a ServiceAccount, the role generated
# from kubebuilder RBAC markers (make manifests) and its bindings.
- executor
- analyzer
# The following RBAC configurations are used to protect
# the metrics endpoint with authn/authz. These configurations
# ensure that only authorized users and service accounts
# can access the metrics endpoint. Comment the following
# permissions if you want to disable this protection.
# More info: https://book.kubebuilder.io/reference/metrics.html
- metrics_auth_role.yaml
- metrics_auth_role_binding.yaml
- metrics_reader_role.yaml
# For each CRD, "Admin", "Editor" and "Viewer" roles are scaffolded by
# default, aiding admins in cluster management. Those roles are
# not used by the shadewright itself. You can comment the following lines
# if you do not want those helpers be installed with your Project.
- remediationsettings_admin_role.yaml
- remediationsettings_editor_role.yaml
- remediationsettings_viewer_role.yaml
- remediationpolicy_admin_role.yaml
- remediationpolicy_editor_role.yaml
- remediationpolicy_viewer_role.yaml
- incident_admin_role.yaml
- incident_editor_role.yaml
- incident_viewer_role.yaml
- remediationrequest_admin_role.yaml
- remediationrequest_editor_role.yaml
- remediationrequest_viewer_role.yaml

