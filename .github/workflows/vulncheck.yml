name: Vulncheck

on:
  push:
    branches: [main]
  pull_request:
  # New advisories can affect an unchanged main, so scan weekly too (Monday 06:17 UTC).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests: decided from the files the pull request changes (hack/ci-changed.sh). Pushes to main,
      # tags, scheduled and manual runs always run. The jobs below are skipped with a job-level `if`, which
      # counts as passing for the required checks (a workflow-level `paths` filter would leave them pending).
      - name: Decide from the changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: hack/ci-changed.sh go .github/workflows/vulncheck.yml >> "$GITHUB_OUTPUT"

  vulncheck:
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scan with the Go release the manager image is built with (the builder stage of the Dockerfile),
      # so standard library findings match what ships. Dependabot keeps that tag current.
      - name: Read the builder Go version from the Dockerfile
        id: go
        run: |
          version="$(sed -n -E 's/^FROM[[:space:]]+(--platform=[^[:space:]]+[[:space:]]+)?golang:([0-9]+\.[0-9]+\.[0-9]+)(@sha256:[0-9a-f]{64})?[[:space:]]+AS[[:space:]]+builder[[:space:]]*$/\2/p' Dockerfile | head -n1)"
          printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::could not read the Go version of the builder stage from the Dockerfile (got '$version')"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: local
        run: make vulncheck
