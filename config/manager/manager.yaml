apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: system
  labels:
    control-plane: executor
    app.kubernetes.io/component: executor
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: executor
      app.kubernetes.io/component: executor
      app.kubernetes.io/name: shadewright
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: executor
      labels:
        control-plane: executor
        app.kubernetes.io/component: executor
        app.kubernetes.io/name: shadewright
        # Asks the AKS workload identity webhook to inject the federated token (design section 9).
        azure.workload.identity/use: "true"
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          # The node grace of a verification verdict (ADR-0030 section 4): at least the cluster's node monitor
          # grace period. The chart sets it from executor.verification.nodeGrace.
          - --node-grace=1m
          # Outcome verification after the merge (--verify-outcomes, ADR-0030) is off by default until a lab run
          # with a release candidate decides it. The chart sets it from executor.verification.enabled.
        image: controller:latest
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        name: executor
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            # 512Mi: the executor and one render process of the render check (ADR-0035). The executor's Go soft
            # limit (about 230 MiB) plus the render process's resident limit (192 MiB, where the executor kills it)
            # plus a 64 MiB margin is 486 MiB, so a render the samplers stop does not set off a container OOM,
            # which on cgroup v2 ends the executor too. These manifests set no GOMEMLIMIT; the chart does (45
            # percent of this limit, 230 MiB).
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: executor
      terminationGracePeriodSeconds: 10
