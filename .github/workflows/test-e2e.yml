name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # kind is pinned by version and by the sha256 published with its GitHub release; the job fails when the
      # download does not match. The default node image is pinned by digest inside the kind binary.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256_AMD64: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          KIND_SHA256_ARM64: 20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
        run: |
          set -euo pipefail
          arch="$(go env GOARCH)"
          case "${arch}" in
            amd64) sha256="${KIND_SHA256_AMD64}" ;;
            arm64) sha256="${KIND_SHA256_ARM64}" ;;
            *) echo "::error::no pinned kind checksum for ${arch}"; exit 1 ;;
          esac
          curl -fsSLo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${arch}"
          echo "${sha256}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
