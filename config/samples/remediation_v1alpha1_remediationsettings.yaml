# The one cluster-wide settings object. Set paused: true to stop every write at once (the kill switch).
apiVersion: remediation.shadewright.io/v1alpha1
kind: RemediationSettings
metadata:
  name: default
spec:
  paused: false
  # Cap on active requests (before the merge): more wait in Pending with the condition Queued.
  maxConcurrentRemediations: 1
  repositories:
    - name: fleet
      url: https://github.com/example/fleet
      targetBranch: main
      provider: GitHub
      github:
        appClientID: Iv23exampleclientid
        installationID: 12345678
        signer:
          azureKeyVault:
            keyID: https://kv-example.vault.azure.net/keys/github-app
  # Modules contribute only when enabled here and detected in the cluster. Once the analyzer writes status
  # (planned, #61), status.platform shows the detected platform and the one in use (generic when the detected
  # one is not enabled here) and status.integrations each integration. Status is a report, never an input.
  # The generic platform is always on and is not listed.
  modules:
    platforms: [aks]
    integrations: [keda, flux]
  # Bounds of every model-backed analysis and the model deployments it may call. Read today: maxAnalysesPerDay,
  # by the analysis trigger (0 marks every Incident not due; the daily count is enforced once the analysis
  # reserves units, #16, #76). Planned: the rest is not enforced yet (the analysis loop, #76;
  # the daily token caps need the spend counter, #208). No key goes here: the analyzer authenticates with its
  # workload identity. The endpoint decides where that token and the redacted context go, so guard write
  # access to this object. maxTokensPerDay is required on each model.
  analysis:
    maxAnalysesPerDay: 100
    maxContextBytes: 32768
    maxToolSteps: 4
    maxOutputTokens: 2048
    maxConcurrentAnalyses: 1
    models:
      triage:
        endpoint: https://example.services.ai.azure.com/
        deployment: small-model
        apiVersion: "2024-10-21"
        maxTokensPerDay: 1000000
      escalation:
        endpoint: https://example.services.ai.azure.com/
        deployment: strong-model
        apiVersion: "2024-10-21"
        maxTokensPerDay: 200000
