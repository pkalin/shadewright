        - message: status.handoff.to must name a hint in status.hints that is Reserved
            while it is Intent, Consumed once Done and Declined once Aborted
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.to)
            || (has(self.status.hints) && self.status.hints.exists(h, h.source ==
            self.status.handoff.to.hint.source && h.commentID == self.status.handoff.to.hint.commentID
            && h.digest == self.status.handoff.to.hint.digest && h.state == (self.status.handoff.to.phase
            == ''Intent'' ? ''Reserved'' : self.status.handoff.to.phase == ''Done''
            ? ''Consumed'' : ''Declined'')))'
        - message: status.commentCursor is kept once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.commentCursor) || (has(self.status)
            && has(self.status.commentCursor))'
        - message: status.commentCursor.since never decreases
          rule: '!has(oldSelf.status) || !has(oldSelf.status.commentCursor) || !has(oldSelf.status.commentCursor.since)
            || (has(self.status) && has(self.status.commentCursor) && has(self.status.commentCursor.since)
            && self.status.commentCursor.since >= oldSelf.status.commentCursor.since)'
        - message: status.rollout is kept once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || (has(self.status)
            && has(self.status.rollout))'
        - message: status.rollout.waitStartedAt is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.waitStartedAt)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.waitStartedAt)
            && self.status.rollout.waitStartedAt == oldSelf.status.rollout.waitStartedAt)'
        - message: status.rollout.appliedRevision is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.appliedRevision)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.appliedRevision)
            && self.status.rollout.appliedRevision == oldSelf.status.rollout.appliedRevision)'
        - message: status.rollout.targetGeneration is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.targetGeneration)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.targetGeneration)
            && self.status.rollout.targetGeneration == oldSelf.status.rollout.targetGeneration)'
        - message: status.rollout.templateHash is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.templateHash)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.templateHash)
            && self.status.rollout.templateHash == oldSelf.status.rollout.templateHash)'
        - message: status.rollout.templateRevision is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.templateRevision)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.templateRevision)
            && self.status.rollout.templateRevision == oldSelf.status.rollout.templateRevision)'
        - message: status.rollout.pausedSince is never moved while set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.pausedSince)
            || !has(self.status) || !has(self.status.rollout) || !has(self.status.rollout.pausedSince)
            || self.status.rollout.pausedSince == oldSelf.status.rollout.pausedSince'
        - message: status.rollout.pausedSeconds never decreases
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.pausedSeconds)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.pausedSeconds)
            && self.status.rollout.pausedSeconds >= oldSelf.status.rollout.pausedSeconds)'
        - message: status.rollout.ended never goes back to false
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.ended)
            || !oldSelf.status.rollout.ended || (has(self.status) && has(self.status.rollout)
            && has(self.status.rollout.ended) && self.status.rollout.ended)'
        - message: status.verification is kept once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.verification) || (has(self.status)
            && has(self.status.verification))'
        - message: status.verification.windowStart only moves forward
          rule: '!has(oldSelf.status) || !has(oldSelf.status.verification) || !has(oldSelf.status.verification.windowStart)
            || (has(self.status) && has(self.status.verification) && has(self.status.verification.windowStart)
            && timestamp(self.status.verification.windowStart) >= timestamp(oldSelf.status.verification.windowStart))'
        - message: status.verification.lastReset is kept once set and its time never
            moves back
          rule: '!has(oldSelf.status) || !has(oldSelf.status.verification) || !has(oldSelf.status.verification.lastReset)
            || (has(self.status) && has(self.status.verification) && has(self.status.verification.lastReset)
            && timestamp(self.status.verification.lastReset.time) >= timestamp(oldSelf.status.verification.lastReset.time))'
        - message: status.verification.resets never decreases
          rule: '!has(oldSelf.status) || !has(oldSelf.status.verification) || !has(oldSelf.status.verification.resets)
            || (has(self.status) && has(self.status.verification) && has(self.status.verification.resets)
            && self.status.verification.resets >= oldSelf.status.verification.resets)'
        - message: status.queuedBehind is kept once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.queuedBehind) || size(oldSelf.status.queuedBehind)
            == 0 || (has(self.status) && has(self.status.queuedBehind) && size(self.status.queuedBehind)
            > 0)'
    selectableFields:
    - jsonPath: .status.phase
    - jsonPath: .status.breakerProbe
    - jsonPath: .status.holdsTarget
    - jsonPath: .status.breakerCounts
    - jsonPath: .status.breakerClearedBy
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
