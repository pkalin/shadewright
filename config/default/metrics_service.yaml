apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: executor
    app.kubernetes.io/component: executor
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
  name: executor-metrics-service
  namespace: system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    control-plane: executor
    app.kubernetes.io/name: shadewright
