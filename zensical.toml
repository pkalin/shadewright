# Docs site for shadewright.io, built with Zensical (ADR-0010).
# Local preview: pip install --require-hashes -r requirements-docs.txt && zensical serve

[project]
site_name = "Shadewright"
site_description = "A safe-remediation controller for Kubernetes clusters run with GitOps: it turns untrusted proposals, from rules or an LLM, into typed, bounded changes tied to policy and to the object's real source in Git, delivers them only as reviewed pull requests, and verifies the effect"
site_url = "https://shadewright.io/"
repo_url = "https://github.com/pkalin/shadewright"
