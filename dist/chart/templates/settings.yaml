{{- if .Values.settings.create }}
# The one cluster-wide settings object (design section 4). It is created only when asked for. It is a
# post-install and post-upgrade hook, not a normal template: on a fresh install the CRD is created by the same
# release, and Helm cannot map the kind until the CRD exists. A hook runs after the release objects are applied.
# Helm does not track hook objects, so the object stays when the release is uninstalled, and each install or
# upgrade replaces it with the values below (before-hook-creation), overwriting any edit made by hand. Leave this
# off if you manage the object another way (for example in your GitOps repository).
apiVersion: remediation.shadewright.io/v1alpha1
kind: RemediationSettings
metadata:
  name: default
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
spec:
  {{- toYaml (required "settings.spec is required when settings.create is true" .Values.settings.spec) | nindent 2 }}
{{- end }}
