# The analyzer's read of the RemediationPolicies its requests name (#493): the ClusterRole analyzer-policy-reader,
# restricted to those names, and its ClusterRoleBinding. It goes with an analyzer that runs the analysis with
# --action-policies. resourceNames below MUST list every policy name of that flag, one each: demo-memory is the
# lab's (shadewright-fleet). Kustomize cannot read the flag, so keep the two in step by hand; an analyzer whose
# flag names a policy this list leaves out refuses to start ("may not get RemediationPolicy"). The chart
# renders the same role from analyzer.analysis.actionPolicies, the values the flag comes from, only with
# analyzer.analysis.triageModel and at least one name. Names get the prefix of config/default.
namePrefix: shadewright-
resources:
- ../rbac/analyzer/policies
- cluster_role_binding.yaml
patches:
- target:
    kind: ClusterRole
    name: analyzer-policy-reader
  patch: |-
    - op: add
      path: /rules/0/resourceNames
      value:
      - demo-memory
