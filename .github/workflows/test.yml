name: Tests

# Called by ci.yml (the only trigger), which decides from the changed files whether it runs.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the job runs; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        description: Upload token of the Codecov project; without it the coverage job uploads nothing and passes.
        required: false

permissions: {}

jobs:
  test:
    if: ${{ inputs.run != false }}
    permissions:
      contents: read
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The envtest binaries (kube-apiserver, etcd) that setup-envtest downloads; the Kubernetes release comes
      # from k8s.io/api in go.mod, so go.mod is the key.
      - name: Cache envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('go.mod') }}

      # EVAL_REPORT_DIR makes the evaluation inside make test (test/eval, on the fake model) write its report,
      # so the run is not repeated for the summary.
      # The runs with the tag redactwork (make test-redactwork-*) go in the redactwork jobs below, one runner each:
      # side by side on this runner's four cores they took about 1,300 s each, two past their limit (#873).
      - name: Running Tests
        env:
          EVAL_REPORT_DIR: ${{ runner.temp }}/eval
        run: |
          go mod tidy
          make test REDACTWORK_IN_TEST=no

      # The evaluation on the fake model ran inside make test; its report goes into the job summary (format:
      # docs/evaluation.md), also when the tests failed. The real model is the manual Evaluation workflow.
      - name: Evaluation report (fake model)
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/eval/report.md" ]; then
            cat "${RUNNER_TEMP}/eval/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      # The slowest tests of each test line of make test, from the JSON logs it wrote (bin/gotestsum is the pinned
      # copy it installed). A log is missing when the run stopped before that line started.
      - name: Slowest tests
        if: always()
        run: |
          {
            echo "### Slowest tests (over 3s, top 30)"
            for name in unit-race wide-mapping; do
              [ -f "test-reports/${name}.json" ] || continue
              echo
              echo "#### ${name}"
              echo '```'
              bin/gotestsum tool slowest --jsonfile "test-reports/${name}.json" --threshold 3s --num 30
              echo '```'
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      # cover.out is written by the unit-race line of make test; the coverage job uploads it.
      - name: Upload coverage profile
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

      # The junit files and JSON logs of every test line of make test, also when a test failed.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: test-reports/
          if-no-files-found: ignore

  redactwork-targets:
    if: ${{ inputs.run != false }}
    permissions:
      contents: read
    name: list redactwork runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the runs with the tag redactwork
        id: list
        run: echo "list=$(make --no-print-directory redactwork-list)" >> "$GITHUB_OUTPUT"

  # Every run with the tag redactwork that make test starts side by side (REDACTWORK_TARGETS), each on a runner of
  # its own: the corpora that check a sample under -race check every input here, and the linearity tests count
  # redaction work (#873, decision of 2026-11-21).
  redactwork:
    needs: redactwork-targets
    permissions:
      contents: read
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.redactwork-targets.outputs.list) }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Run
        env:
          TARGET: ${{ matrix.target }}
        run: make --no-print-directory "${TARGET}"

  # The upload has its own job because the Codecov action downloads the uploader at run time. Here it runs away
  # from the test job's caches and gets nothing but the coverage file and the upload token.
  coverage:
    needs: test
    if: ${{ inputs.run != false && needs.test.result == 'success' }}
    permissions:
      contents: read
    name: coverage upload
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: No token
        if: env.CODECOV_TOKEN == ''
        run: echo "no token, nothing uploaded"

      - name: Clone the code
        if: env.CODECOV_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the coverage profile
        if: env.CODECOV_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # version pins the uploader the action downloads, so a run does not take whatever is latest.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover.out
          disable_search: true
          fail_ci_if_error: false
          version: v11.3.2
          disable_telem: true
