name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      - name: Check the generated manifests and code are up to date
        run: |
          # Keep the year of the committed boilerplate header, so the check does not start failing on 1 January.
          year="$(sed -n -E 's/^Copyright ([0-9]{4}) The Shadewright Authors\.$/\1/p' api/v1alpha1/zz_generated.deepcopy.go)"
          test -n "$year" || {
            echo "::error::could not read the copyright year from api/v1alpha1/zz_generated.deepcopy.go"
            exit 1
          }
          make manifests generate YEAR="$year"
          git diff --exit-code -- config/ api/ || {
            echo "::error::config/ or api/ is stale: run 'make manifests generate' and commit the result"
            exit 1
          }
          test -z "$(git status --porcelain -- config/ api/)" || {
            echo "::error::make manifests generate wrote files that are not committed"
            git status --porcelain -- config/ api/
            exit 1
          }

      - name: Check the API reference is up to date
        run: |
          make api-docs
          git diff --exit-code -- docs/reference/api.md || {
            echo "::error::docs/reference/api.md is stale: run 'make api-docs' and commit the result"
            exit 1
          }
          test -z "$(git status --porcelain -- docs/reference/)" || {
            echo "::error::make api-docs wrote files that are not committed"
            git status --porcelain -- docs/reference/
            exit 1
          }

  vulncheck:
    permissions:
      contents: read
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scan with the Go release the manager image is built with (the builder stage of the Dockerfile),
      # so standard library findings match what ships. Dependabot keeps that tag current.
      - name: Read the builder Go version from the Dockerfile
        id: go
        run: |
          version="$(sed -n -E 's/^FROM golang:([0-9]+\.[0-9]+\.[0-9]+)@sha256:[0-9a-f]{64} AS builder$/\1/p' Dockerfile)"
          test -n "$version" || {
            echo "::error::could not read the Go version of the builder stage from the Dockerfile"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: local
        run: make vulncheck
