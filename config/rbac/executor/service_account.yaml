apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Workload identity (design section 9): the client ID of the executor's managed identity, which may only
    # sign with the GitHub App key in Key Vault. This is a placeholder; the deployer sets it, for example with
    # a kustomize patch or the "client_id" output of shadewright-azure foundation (executor_identity). It is
    # not a secret. Pods also need the label azure.workload.identity/use (see config/manager/manager.yaml).
    azure.workload.identity/client-id: "<executor-managed-identity-client-id>"
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/component: executor
    app.kubernetes.io/managed-by: kustomize
  name: executor
  namespace: system
