# How the diagnosis of broken-keda-trigger is scored: each fact of expected.yaml, verbatim, with the terms the
# result's summary, hypotheses or evidence quotes must contain (case ignored), or why it is not scored.
facts:
  - fact: the ScaledObject condition Ready is False
    # The context shows the ScaledObject's conditions since ADR-0036 (the object status section).
    any: ["TriggerError", "Ready=False", "Ready condition is False", "Ready is False", "Ready: False"]
  - fact: the trigger error (the serverAddress prometheus-server.monitoring.svc.cluster.local cannot be resolved)
    all: ["prometheus-server.monitoring.svc.cluster.local"]
  - fact: maxReplicaCount is not the problem
    unscored: scored by the outcome, a refusal; a proposal to raise maxReplicaCount fails it
