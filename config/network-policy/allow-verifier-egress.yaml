# Egress of the verifier: DNS and the Kubernetes API only. It talks to nothing outside the cluster (no model,
# no Git host, no Key Vault). A NetworkPolicy cannot select the API server by label, so its ports are open to
# any address: 443 for the Kubernetes API on managed clusters, 6443 on kubeadm and kind (design section 10.6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: verifier
  name: allow-verifier-egress
  namespace: system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shadewright
      app.kubernetes.io/component: verifier
  policyTypes:
    - Egress
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API and HTTPS endpoints outside the cluster.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
