name: Chart

# Lints and tests the Helm chart in dist/chart (generated with Kubebuilder's helm/v2-alpha plugin, then adjusted
# by hand, so the comparison test is the guard). Pull requests and pushes to main lint, render and compare
# the chart with config/default, a Kind job installs it with explicit values, and the chart-testing job runs
# ct lint and installs it with the default values plus image.allowTag (images built from the checkout), with
# helm test. Only a v* tag
# publishes it to ghcr.io/<owner>/charts/shadewright, and only the publish job has packages: write and
# id-token: write. Before packaging it writes the digests of the tag's signed images into values.yaml, so the
# published chart runs them by digest. After the push it signs the chart by digest with cosign keyless (GitHub
# OIDC, no key to store) and verifies the signature against the identity of this workflow, so a mismatch fails
# the run.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

env:
  HELM_VERSION: v4.3.1
  CT_VERSION: 3.15.0
  YAMLLINT_VERSION: 1.33.0
  YAMALE_VERSION: 6.0.0
  UV_VERSION: 0.13.7

jobs:
  chart:
    name: Lint and render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # this workflow publishes on tags: no cache a pull request could poison

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint and compare the chart with config/default
        run: make chart-lint test-chart

  install:
    name: Install on Kind
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # this workflow publishes on tags: no cache a pull request could poison

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Pull requests and main use the v0.1.0 image digests; a release tag uses the digests of the images
      # of that tag (the script waits for the Images workflow of the tag to push them).
      - name: Install the chart on Kind and check the permissions
        env:
          CHART_TEST_IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: make test-chart-install

      # The cluster is deleted even when a step failed.
      - name: Delete the Kind cluster
        if: ${{ always() }}
        run: make chart-kind-delete

  chart-testing:
    name: chart-testing (default values on Kind)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # this workflow publishes on tags: no cache a pull request could poison

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Installs ct, yamllint and yamale at the versions above (ct's download is verified with cosign).
      - name: Setup chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CT_VERSION }}
          yamllint_version: ${{ env.YAMLLINT_VERSION }}
          yamale_version: ${{ env.YAMALE_VERSION }}
          uv_version: ${{ env.UV_VERSION }}

      # yamllint, the Chart.yaml schema, maintainers (a GitHub handle, no email) and helm lint (ct.yaml).
      - name: ct lint
        run: ct lint --config ct.yaml

      # The default values run repository:appVersion, so the images are built from this checkout under that
      # tag and loaded into Kind (pinned KIND_VERSION): the install tests this code with the default values and
      # image.allowTag (dist/chart/ci/default-values.yaml).
      - name: Create the Kind cluster and load the images
        run: make chart-ct-cluster

      - name: Install with the default values and check what it may read and write
        run: make test-chart-defaults

      # Installs with ci/default-values.yaml (image.allowTag only, the rest default), runs helm test and uninstalls.
      - name: ct install
        run: ct install --config ct.yaml

      - name: Delete the Kind cluster
        if: ${{ always() }}
        run: make chart-ct-kind-delete

  publish:
    name: Publish the chart
    # Release tags only. The chart version must equal the tag (release-please bumps both in the release pull
    # request), so a tag never publishes the chart of another version.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [chart, install, chart-testing]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing, this job only
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Check that the chart version is the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(helm show chart dist/chart | sed -n 's/^version: //p')"
          app_version="$(helm show chart dist/chart | sed -n 's/^appVersion: //p' | tr -d '"')"
          if [ "v${version}" != "${TAG}" ] || [ "v${app_version}" != "${TAG}" ]; then
            echo "chart version ${version} / appVersion ${app_version} do not match the tag ${TAG}" >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Docker (for the image inspection and cosign, which read its credentials) and Helm (for the push) log in
      # with the job token before anything reads ghcr.io, so private packages work too.
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          printf '%s' "${TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin

      # The images of this tag, by digest, each verified against the identity of the Images workflow on this
      # very tag before its digest goes into the chart. The Images workflow of the same tag runs in parallel, so
      # this waits for each image and a signature that verifies: every 30 s, at most 30 minutes, then the run
      # fails with the image it waited for. Re-run the failed jobs of this run once the Images workflow of the
      # tag has finished. The signature check is on the digest, so a tag moved after the check changes nothing.
      - name: Write the signed image digests into values.yaml
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          identity="https://github.com/${REPOSITORY}/.github/workflows/images.yml@refs/tags/${TAG}"
          deadline=$(( $(date +%s) + 1800 ))
          for image in executor analyzer; do
            ref="ghcr.io/${owner}/shadewright-${image}"
            d=""
            until [ -n "${d}" ]; do
              got="$(docker buildx imagetools inspect "${ref}:${TAG#v}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)"
              if printf '%s' "${got}" | grep -Eq '^sha256:[a-f0-9]{64}$' && cosign verify \
                  --certificate-identity "${identity}" \
                  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                  "${ref}@${got}" > /dev/null 2>&1; then
                d="${got}"
              elif [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "no image ${ref}:${TAG#v} signed by ${identity} after 30 minutes; re-run this job once the Images workflow of ${TAG} has finished" >&2
                exit 1
              else
                echo "waiting for ${ref}:${TAG#v} and its signature"
                sleep 30
              fi
            done
            printf -v "digest_${image}" '%s' "${d}"
            echo "${ref}@${d}" >> "${GITHUB_STEP_SUMMARY}"
          done
          hack/chart-set-digests.sh dist/chart/values.yaml "${digest_executor}" "${digest_analyzer}"
          rendered="$(helm template publish-check dist/chart --set clusterId=publish-check)"
          for d in "${digest_executor}" "${digest_analyzer}"; do
            grep -qF "@${d}\"" <<<"${rendered}" || { echo "the chart does not run ${d}" >&2; exit 1; }
          done

      - name: Package the chart
        run: helm package dist/chart --destination "${RUNNER_TEMP}/chart"

      - name: Push the chart
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm push "${RUNNER_TEMP}/chart/shadewright-${TAG#v}.tgz" "oci://ghcr.io/${owner}/charts" 2>&1 | tee "${RUNNER_TEMP}/push.log"
          digest="$(sed -n 's/^Digest: //p' "${RUNNER_TEMP}/push.log")"
          if ! printf '%s' "${digest}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "no chart digest in the helm push output" >&2
            exit 1
          fi
          echo "CHART_REF=ghcr.io/${owner}/charts/shadewright@${digest}" >> "${GITHUB_ENV}"
          echo "oci://ghcr.io/${owner}/charts/shadewright:${TAG#v} (${digest})" >> "${GITHUB_STEP_SUMMARY}"

      # Always by digest: a tag can move, the digest names the pushed chart.
      - name: Sign the chart (keyless)
        run: cosign sign --yes "${CHART_REF}"

      # The identity is this workflow file on a release tag of this repository, issued by GitHub's OIDC
      # provider. Anything else (another workflow, another repository, a branch) fails the run.
      - name: Verify the signature
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity="^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/chart\.yml@refs/tags/v[0-9].*$"
          cosign verify \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CHART_REF}" > /dev/null
