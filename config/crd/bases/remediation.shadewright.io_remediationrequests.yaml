          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.ended)
            || !oldSelf.status.rollout.ended || (has(self.status) && has(self.status.rollout)
            && has(self.status.rollout.ended) && self.status.rollout.ended)'
    selectableFields:
    - jsonPath: .status.phase
    - jsonPath: .status.breakerProbe
    - jsonPath: .status.holdsTarget
    - jsonPath: .status.breakerCounts
    - jsonPath: .status.breakerClearedBy
    served: true
    storage: true
    subresources:
      status: {}
