name: Images

# Builds the executor and analyzer images. Pull requests build linux/amd64 only, without pushing, and only when
# a file of the image build changes (the `changes` job, hack/ci-changed.sh); a superseded pull request run is
# cancelled. Pushes to main and v* tags build linux/amd64 and linux/arm64, push to ghcr.io/pkalin/shadewright-{executor,analyzer}; only the
# publish job has packages: write. After the push, the same job signs each image by digest with cosign keyless
# (GitHub OIDC, no key to store), attaches an SPDX SBOM as a signed attestation, records a GitHub build
# provenance attestation, and verifies all three against the identity of this workflow, so a mismatch fails the
# run (#82). The id-token and attestations permissions exist only on the publish job, which never runs for a
# pull request (forks included). The release workflow (#84) decides which tags are cut.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests: decided from the files the pull request changes (hack/ci-changed.sh). Pushes to main,
      # tags, scheduled and manual runs always run. The jobs below are skipped with a job-level `if`, which
      # counts as passing for the required checks (a workflow-level `paths` filter would leave them pending).
      - name: Decide from the changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: hack/ci-changed.sh images .github/workflows/images.yml >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (no push)
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [executor, analyzer]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only: arm64 is built under emulation and takes minutes; main and tags build both (publish).
      - name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: false

  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [executor, analyzer]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Always by digest: a tag can move, the digest names the pushed index (both architectures).
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Syft scans the platform of the runner (linux/amd64); the Go binaries and the base image are the same
      # modules for both architectures.
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM: ${{ runner.temp }}/sbom.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}@${DIGEST}"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The identity is this workflow file on main or on a release tag of this repository, issued by GitHub's
      # OIDC provider. Anything else (another workflow, another repository, a branch) fails the run.
      - name: Verify signature, SBOM and provenance
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/images\.yml@refs/(heads/main|tags/v[0-9].*)$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${REPOSITORY}" \
            --signer-workflow "${REPOSITORY}/.github/workflows/images.yml"

      - name: Show the digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
