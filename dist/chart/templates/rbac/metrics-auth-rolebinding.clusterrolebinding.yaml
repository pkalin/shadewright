{{- if and .Values.metrics.enabled .Values.metrics.secure }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "metrics-auth-rolebinding" "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shadewright.resourceName" (dict "suffix" "metrics-auth-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "executor" "context" $) }}
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer" "context" $) }}
  namespace: {{ .Release.Namespace }}
{{- end }}
