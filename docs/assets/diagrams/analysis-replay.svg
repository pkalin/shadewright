<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 572" role="img" aria-labelledby="t d" data-diagram="analysis-replay" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">One analysis, replayed</title>
  <desc id="d">A looping replay of one recorded analysis, from a Warning event to a verified pull request, in about 28 seconds. An OOMKilled event becomes an Incident. The analyzer builds the context and redacts it: a secret value in the input is replaced by the placeholder [REDACTED:credential]. The triage model answers with one call, and the answer becomes a typed proposal. If triage is unsure, an escalation model may be asked; this run did not use it, so that path is drawn dim. The executor checks the proposal against the fixed list of changes and the policy, then opens a pull request in the GitOps repository. A person reviews and merges it, Flux applies the commit, and the verifier reads the pods and ends the request. Shown in red: nothing, neither the analyzer, the model nor the executor, has a path to the workloads; only Flux changes them. With reduced motion set, the picture is still and shows every step at once. Replay of release v0.3.0-rc.2, scenario oom, not live: 3 min 34 s from symptom to pull request.</desc>
