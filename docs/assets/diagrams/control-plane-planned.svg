<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 588" role="img" aria-labelledby="t d" data-diagram="control-plane-planned" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Control plane mode, planned</title>
  <desc id="d">Planned, not built: ADR-0038 is proposed. A hub cluster and three spoke clusters. Each spoke runs its own analyzer with its own model, and redacts before anything leaves it. Reports travel only outbound, from each spoke to the hub's intake service, which stores one typed snapshot per spoke. The hub never calls a spoke and holds no kubeconfig for it: that path is drawn crossed out in red. Onboarding happens once: a command reads the spoke identity and writes the registration, a pull request adds its Cluster object to the hub's GitOps repository, and a person merges it; there is no self-registration. The Cluster object of a spoke carries the kill switch: suspended true stops that spoke's reports. Where the Git App and the pull requests live in this mode is an open question and is not drawn. Everything is dashed because nothing is built. With reduced motion set, the picture is still and shows every step at once.</desc>
