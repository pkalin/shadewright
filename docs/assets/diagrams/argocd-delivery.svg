<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">What the executor reads from Argo CD</title>
  <desc id="d">Planned, not built. Four columns, left to right. Column 1, the workload: its tracking-id annotation names an Application and is not trusted; the instance label is not read; a workload that also carries Flux labels is refused. Column 2, the Application, read with get in one configured namespace: metadata (the skip-reconcile annotation, owner references, deletion time), spec (source, sources, source hydrator, destination, ignore differences, automated sync) and status (sync, resources, operation state, conditions, source type, health, history). Below it, what is never read: the argocd-cm ConfigMap, AppProjects, Secrets and the repo server. Column 3, the checks the executor makes on those fields, and below them the Git host outside the cluster, which answers the branch head, file reads, directory listings and whether one commit is in the history of another. Column 4, the two results: the source mapping, which writes repository, branch, path, file and base commit to the request status or stops with a reason, and the delivery status that DeliveryVerifier returns, read from the sync and operation state, with health not an input.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
    <style>
      .lane{fill:#13121c;stroke:#2a2740}
      .pl{fill:#1d1b2b;stroke:#7c24fc;stroke-width:1.4;stroke-dasharray:5 4}
      .ext{fill:#16222a;stroke:#2f5d63;stroke-width:1.2;stroke-dasharray:5 4}
      .no{fill:#241a22;stroke:#6b3a4a;stroke-width:1.2;stroke-dasharray:5 4}
      .h{fill:#f1edff;font-size:14.5px;font-weight:650}
      .s{fill:#a9a4c4;font-size:12px}
      .lbl{fill:#c6a8ff;font-size:12px;font-weight:600}
      .bad{fill:#ff8fa3;font-size:12px}
      .lanet{fill:#7d7999;font-size:12.5px;font-weight:600;letter-spacing:.14em}
      .f{stroke:#a879ff;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1280" height="640" rx="18" fill="#0e0e16"/>

  <text class="lanet" x="28" y="42">1  WORKLOAD</text>
  <text class="lanet" x="338" y="42">2  APPLICATION</text>
  <text class="lanet" x="672" y="42">3  CHECKS</text>
  <text class="lanet" x="984" y="42">4  RESULT</text>

  <rect class="pl" x="24" y="58" width="270" height="130" rx="10"/>
  <text class="h" x="38" y="84">Live Deployment</text>
  <text class="s" x="38" y="106">Only a hint, never proof:</text>
  <text class="lbl" x="38" y="128">tracking-id annotation</text>
  <text class="s" x="38" y="148">app:group/kind:ns/name</text>
  <text class="s" x="38" y="168">or ns_app:... outside argocd</text>

  <rect class="no" x="24" y="206" width="270" height="92" rx="10"/>
  <text class="h" x="38" y="232">Not read</text>
  <text class="s" x="38" y="254">instance label</text>
  <text class="s" x="38" y="274">(Helm charts set it too)</text>

  <rect class="no" x="24" y="316" width="270" height="110" rx="10"/>
  <text class="h" x="38" y="342">Flux labels as well</text>
  <text class="s" x="38" y="364">Two delivery systems claim</text>
  <text class="s" x="38" y="384">the object: refused, no guess</text>
  <text class="bad" x="38" y="408">AmbiguousDelivery</text>

  <rect class="pl" x="326" y="58" width="310" height="420" rx="10"/>
  <text class="h" x="340" y="84">Application, read with get</text>
  <text class="s" x="340" y="104">one namespace of a configured list</text>
  <text class="lbl" x="340" y="134">metadata</text>
  <text class="s" x="340" y="154">skip-reconcile annotation,</text>
  <text class="s" x="340" y="172">ownerReferences, deletion time</text>
  <text class="lbl" x="340" y="202">spec</text>
  <text class="s" x="340" y="222">source (repoURL, path,</text>
  <text class="s" x="340" y="240">targetRevision, tool options)</text>
  <text class="s" x="340" y="258">sources, sourceHydrator,</text>
  <text class="s" x="340" y="276">destination, ignoreDifferences,</text>
  <text class="s" x="340" y="294">syncPolicy.automated</text>
  <text class="lbl" x="340" y="324">status</text>
  <text class="s" x="340" y="344">sync (status, revision,</text>
  <text class="s" x="340" y="362">comparedTo), resources,</text>
  <text class="s" x="340" y="380">operationState, conditions,</text>
  <text class="s" x="340" y="398">sourceType, health, history</text>
  <text class="s" x="340" y="432">Fields and upstream sources: ADR table</text>
  <text class="s" x="340" y="452">in section 3 (Argo CD v3.6.1)</text>

  <rect class="no" x="326" y="496" width="310" height="96" rx="10"/>
  <text class="h" x="340" y="522">Never read, never written</text>
  <text class="s" x="340" y="544">argocd-cm, AppProjects, Secrets,</text>
  <text class="s" x="340" y="562">the repo server and its API.</text>
  <text class="s" x="340" y="580">No sync, no refresh, no patch.</text>

  <rect class="pl" x="668" y="58" width="280" height="330" rx="10"/>
  <text class="h" x="682" y="84">Checks (fail closed)</text>
  <text class="s" x="682" y="108">1 the id names this object</text>
  <text class="s" x="682" y="128">2 the Application lists it,</text>
  <text class="s" x="682" y="146">  with a sync status</text>
  <text class="s" x="682" y="168">3 one source, no tool options,</text>
  <text class="s" x="682" y="186">  automated sync, not generated</text>
  <text class="s" x="682" y="208">4 targetRevision is the branch</text>
  <text class="s" x="682" y="230">5 status describes this spec</text>
  <text class="s" x="682" y="248">  (comparedTo equals spec)</text>
  <text class="s" x="682" y="270">6 revision is a full commit,</text>
  <text class="s" x="682" y="288">  in the branch history</text>
  <text class="s" x="682" y="310">7 URL, branch and file against</text>
  <text class="s" x="682" y="328">  settings and policy</text>
  <text class="bad" x="682" y="360">a failed read: retry, never a verdict</text>

  <rect class="ext" x="668" y="410" width="280" height="130" rx="10"/>
  <text class="h" x="682" y="436">Git host, outside the cluster</text>
  <text class="s" x="682" y="460">branch head</text>
  <text class="s" x="682" y="478">file reads and directory listings</text>
  <text class="s" x="682" y="496">is one commit in the history</text>
  <text class="s" x="682" y="514">of another (compare)</text>

  <rect class="pl" x="980" y="58" width="276" height="170" rx="10"/>
  <text class="h" x="994" y="84">Source mapping</text>
  <text class="s" x="994" y="106">repository, branch, path, file</text>
  <text class="s" x="994" y="124">and base commit go to</text>
  <text class="s" x="994" y="142">status.source</text>
  <text class="s" x="994" y="168">or a stop: Denied or</text>
  <text class="s" x="994" y="186">NeedsIntervention, with a</text>
  <text class="s" x="994" y="204">reason from the ADR table</text>

  <rect class="pl" x="980" y="248" width="276" height="292" rx="10"/>
  <text class="h" x="994" y="274">DeliveryVerifier.Status</text>
  <text class="s" x="994" y="298">applied commit: sync.revision,</text>
  <text class="s" x="994" y="316">only when Synced and current</text>
  <text class="s" x="994" y="340">attempted commit:</text>
  <text class="s" x="994" y="358">operationState.syncResult</text>
  <text class="s" x="994" y="382">failed: operationState.phase</text>
  <text class="s" x="994" y="400">Failed or Error</text>
  <text class="s" x="994" y="424">suspended: skip-reconcile, or</text>
  <text class="s" x="994" y="442">automated sync off</text>
  <text class="s" x="994" y="466">health: never an input</text>
  <text class="lbl" x="994" y="500">outcome: Pending, Applied, Failed</text>
  <text class="s" x="994" y="520">by the unchanged DeliveryStatus rules</text>

  <path class="f" d="M294 120 H326" marker-end="url(#a)"/>
  <path class="f" d="M636 200 H668" marker-end="url(#a)"/>
  <path class="f" d="M948 140 H980" marker-end="url(#a)"/>
  <path class="f" d="M948 330 H980" marker-end="url(#a)"/>
  <path class="f" d="M808 388 V410" marker-end="url(#a)"/>

  <text class="s" x="28" y="620">Planned. Nothing in this diagram is built. Dashed boxes are designed only; the teal box is outside the cluster.</text>
</svg>
