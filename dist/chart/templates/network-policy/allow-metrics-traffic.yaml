{{- if and .Values.networkPolicy.enabled .Values.metrics.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
  name: {{ include "shadewright.resourceName" (dict "suffix" "allow-metrics-traffic" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          metrics: enabled
    ports:
    - port: {{ .Values.metrics.port }}
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shadewright.name" . }}
  policyTypes:
  - Ingress
{{- end }}
