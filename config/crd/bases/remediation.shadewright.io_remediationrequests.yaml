---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: remediationrequests.remediation.shadewright.io
spec:
  group: remediation.shadewright.io
  names:
    categories:
    - shadewright
    kind: RemediationRequest
    listKind: RemediationRequestList
    plural: remediationrequests
    shortNames:
    - rr
    singular: remediationrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - description: 'Reason of the PolicyAllowed condition: the policy decision'
      jsonPath: .status.conditions[?(@.type=="PolicyAllowed")].reason
      name: Policy
      type: string
    - jsonPath: .spec.action.type
      name: Action
      type: string
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.pullRequest.number
      name: PR
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RemediationRequest is one proposed fix: a typed action on one object, carried out as a GitOps pull request
          after deterministic policy allows it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the plan.
            properties:
              action:
                description: action is the typed change.
                properties:
                  adjustKedaMaxReplicas:
                    description: adjustKedaMaxReplicas holds the parameters for AdjustKedaMaxReplicas.
                    properties:
                      desiredValue:
                        description: desiredValue is the new maxReplicaCount.
                        format: int32
                        maximum: 1000
                        minimum: 1
                        type: integer
                      previousValue:
                        description: previousValue is the value the plan was made
                          against.
                        format: int32
                        maximum: 1000
                        minimum: 1
                        type: integer
                    required:
                    - desiredValue
                    - previousValue
                    type: object
                    x-kubernetes-validations:
                    - message: desiredValue must differ from previousValue
                      rule: self.desiredValue != self.previousValue
                  setContainerMemoryLimit:
                    description: setContainerMemoryLimit holds the parameters for
                      SetContainerMemoryLimit.
                    properties:
                      container:
                        description: container is the container name in the pod template.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      desired:
                        anyOf:
                        - type: integer
                        - type: string
                        description: desired is the new limit.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      previous:
                        anyOf:
                        - type: integer
                        - type: string
                        description: previous is the limit the plan was made against.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - container
                    - desired
                    - previous
                    type: object
                    x-kubernetes-validations:
                    - message: desired must differ from previous
                      rule: quantity(string(self.desired)).compareTo(quantity(string(self.previous)))
                        != 0
                    - message: previous and desired must be whole bytes
                      rule: quantity(string(self.previous)).isInteger() && quantity(string(self.desired)).isInteger()
                    - message: previous must be between 1Mi and 1Ti
                      rule: quantity(string(self.previous)).compareTo(quantity('1Mi'))
                        >= 0 && quantity(string(self.previous)).compareTo(quantity('1Ti'))
                        <= 0
                    - message: desired must be between 1Mi and 1Ti
                      rule: quantity(string(self.desired)).compareTo(quantity('1Mi'))
                        >= 0 && quantity(string(self.desired)).compareTo(quantity('1Ti'))
                        <= 0
                  type:
                    description: type selects the action.
                    enum:
                    - AdjustKedaMaxReplicas
                    - SetContainerMemoryLimit
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: adjustKedaMaxReplicas must be set if and only if type is
                    AdjustKedaMaxReplicas
                  rule: 'self.type == ''AdjustKedaMaxReplicas'' ? has(self.adjustKedaMaxReplicas)
                    : !has(self.adjustKedaMaxReplicas)'
                - message: setContainerMemoryLimit must be set if and only if type
                    is SetContainerMemoryLimit
                  rule: 'self.type == ''SetContainerMemoryLimit'' ? has(self.setContainerMemoryLimit)
                    : !has(self.setContainerMemoryLimit)'
              approvalRequired:
                default: true
                description: |-
                  approvalRequired asks for human review. false is a request for automation that policy may refuse;
                  it never lowers policy or repository rules.
                type: boolean
              chainRoot:
                description: |-
                  chainRoot is the UID of the first request of the supersede chain: the replaced request's chainRoot, or
                  its own UID when it has none. Set together with replaces. The branch of the pull request derives from it
                  (planned), so every request of a chain works on the same branch and pull request.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              incidentRef:
                description: incidentRef is the incident this plan answers.
                properties:
                  name:
                    description: name of the Incident.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: uid of the Incident.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - name
                - uid
                type: object
              mode:
                default: GitOps
                description: mode is how the plan is carried out.
                enum:
                - GitOps
                type: string
              policyRef:
                description: policyRef names the RemediationPolicy that must allow
                  this plan.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              replaces:
                description: |-
                  replaces names the request this one replaces and the reviewer hint of that request it answers
                  (ADR-0028 section 4). Set only by the analyzer on a replacement, together with chainRoot. It is part of
                  the plan, so it is part of the request's name: the same plan answering another hint is another request.
                  Planned: the executor does not act on it yet.
                properties:
                  hint:
                    description: hint is the pinned hint of the replaced request that
                      this plan answers.
                    properties:
                      commentID:
                        description: commentID is the comment's ID in the source.
                        format: int64
                        minimum: 1
                        type: integer
                      digest:
                        description: digest is the SHA-256 of the stored, redacted
                          hint text.
                        pattern: ^sha256:[0-9a-f]{64}$
                        type: string
                      source:
                        description: source is the system the comment is in.
                        enum:
                        - GitHub
                        type: string
                    required:
                    - commentID
                    - digest
                    - source
                    type: object
                  name:
                    description: name of the replaced request, in the same namespace.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid of the replaced request, so a request recreated
                      under the same name is never taken for it.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - hint
                - name
                - uid
                type: object
              targetRef:
                description: targetRef is the live object the change is about.
                properties:
                  apiVersion:
                    description: apiVersion of the object, for example apps/v1 or
                      keda.sh/v1alpha1.
                    maxLength: 253
                    minLength: 1
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?v[0-9]+((alpha|beta)[0-9]+)?$
                    type: string
                  kind:
                    description: kind of the object.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Z][A-Za-z0-9]*$
                    type: string
                  name:
                    description: name of the object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: namespace of the object; empty for cluster-scoped
                      objects.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid of the object.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: targetRef.uid is required
                  rule: has(self.uid) && size(self.uid) > 0
                - message: targetRef.namespace is required
                  rule: has(self.namespace) && size(self.namespace) > 0
              verification:
                default: {}
                description: verification says when the change counts as a success.
                properties:
                  checks:
                    description: checks to run in addition to the ones the action
                      type always needs.
                    items:
                      description: |-
                        VerificationCheck is a named, deterministic check run after delivery. DeliveryRevisionApplied: the GitOps
                        controller has applied the revision that contains the merged change. WorkloadHealthy: the target workload
                        is available and its rollout is complete. KedaReady: the KEDA ScaledObject reports Ready=True, is not
                        paused (Paused=True, which a scale-in or scale-out pause also sets), is not on fallback (Fallback=True) and
                        its HPA can read its metrics (HPAActive is not False). QueueBacklogDecreasing: the backlog that drives the
                        ScaledObject is going down. NoNewOOMKills: no container of the target is OOMKilled after the change.
                      enum:
                      - DeliveryRevisionApplied
                      - WorkloadHealthy
                      - KedaReady
                      - QueueBacklogDecreasing
                      - NoNewOOMKills
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                  stableFor:
                    default: 3m
                    description: stableFor is how long all checks must hold.
                    type: string
                  timeout:
                    default: 10m
                    description: timeout is how long to wait for delivery and stability
                      before giving up.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: stableFor must be at least 1m
                  rule: '!has(self.stableFor) || duration(self.stableFor) >= duration(''1m'')'
                - message: timeout must be at most 24h
                  rule: '!has(self.timeout) || duration(self.timeout) <= duration(''24h'')'
                - message: timeout must be longer than stableFor
                  rule: '!has(self.timeout) || !has(self.stableFor) || duration(self.timeout)
                    > duration(self.stableFor)'
            required:
            - action
            - incidentRef
            - policyRef
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; a changed plan is a new RemediationRequest
              rule: self == oldSelf
            - message: AdjustKedaMaxReplicas can only target a keda.sh ScaledObject
              rule: self.action.type != 'AdjustKedaMaxReplicas' || (self.targetRef.apiVersion.startsWith('keda.sh/')
                && self.targetRef.kind == 'ScaledObject')
            - message: SetContainerMemoryLimit can only target an apps/v1 Deployment
                or StatefulSet
              rule: self.action.type != 'SetContainerMemoryLimit' || (self.targetRef.apiVersion
                == 'apps/v1' && self.targetRef.kind in ['Deployment', 'StatefulSet'])
            - message: replaces and chainRoot are set together or not at all
              rule: has(self.replaces) == has(self.chainRoot)
          status:
            description: status is the progress, written by the controller.
            properties:
              breakerClearedBy:
                description: |-
                  breakerClearedBy is the name of the request in Succeeded whose success made the executor set breakerCounts
                  to false on this one, written in the same status write. When that request is deleted, its finalizer sets
                  breakerCounts back to true on every request that names it, before the finalizer is removed. It is a
                  selectable field (field selector status.breakerClearedBy).
                maxLength: 253
                type: string
              breakerCounts:
                description: |-
                  breakerCounts says whether the executor's limits still read the request for the circuit breaker. It is
                  set in the status write that ends the request: true for a success (Merged or a later phase), a failure
                  (Failed, NeedsIntervention) or a probe (breakerProbe) that ended in any other way, false for any other
                  end. The executor sets it to false only when a newer request in Succeeded is recorded (breakerClearedBy
                  names it), and back to true when that request is deleted, or when a request whose deletion may still close
                  a pull request (NeedsIntervention, Expired) is being deleted. It is unset while the request has not ended
                  and on one that ended before the field existed; an unset request is read (fail closed), and the executor
                  sets the field once on an ended one from its status. It is a selectable field (field selector
                  status.breakerCounts), so the breaker reads only the outcomes that still count.
                type: boolean
              breakerProbe:
                description: |-
                  breakerProbe is true on a request the policy check let through while the circuit breaker was tripped
                  (half-open): it is the breaker's probe. It is written with the allowed decision and never cleared. The
                  breaker finds a running probe, or one that ended without a success, by this field only; a request
                  without it is not a probe. It is a selectable field (field selector status.breakerProbe).
                type: boolean
              commentCursor:
                description: |-
                  commentCursor is where the executor's next look at the comments of the pull request starts (ADR-0028
                  section 3). Only the executor writes it.
                properties:
                  afterID:
                    description: 'afterID: the comments of the current sweep with
                      an ID up to this one were returned already.'
                    format: int64
                    minimum: 0
                    type: integer
                  etag:
                    description: |-
                      etag is the entity tag of the last answer to the first page of a sweep that held no comment, sent as
                      If-None-Match, so an unchanged answer is "not modified" and costs no read.
                    maxLength: 256
                    pattern: ^(W/)?"[!#-~]*"$
                    type: string
                  page:
                    description: page is the page the next look starts on; 0 starts
                      a new sweep.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                  since:
                    description: |-
                      since is the oldest update time the current sweep of the comments asks for. Every comment created before
                      it was returned by an earlier look.
                    format: date-time
                    type: string
                  sweepStart:
                    description: sweepStart is the code host's time when the current
                      sweep began.
                    format: date-time
                    type: string
                type: object
              conditions:
                description: |-
                  conditions explain the phase. Types: PolicyAllowed, PullRequestOpened, Approved, Delivered,
                  Verified, PlanFresh, WritesPaused, Queued and RolledOut (after the merge: whether the target's pods run
                  the applied template; False with reason RolloutStuck or DeliveryNotObserved, Unknown while in progress and
                  with reason KindNotChecked, RolloutSuperseded or RolloutNotDetermined when the check ends without a verdict).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deadline:
                description: deadline is when the current step gives up.
                format: date-time
                type: string
              effectiveApprovalRequired:
                description: effectiveApprovalRequired is what policy decided, which
                  may be stricter than spec.approvalRequired.
                type: boolean
              handoff:
                description: |-
                  handoff records the supersede handoff (ADR-0028 section 4): on a replacement, the request it takes over
                  (from); on a predecessor, its replacement (to); a request in the middle of a chain has both. Each side is
                  written once and never removed; only its phase moves on. Planned: nothing writes it yet.
                properties:
                  from:
                    description: from is the incoming side, set on a replacement.
                    properties:
                      hint:
                        description: hint is the predecessor's hint the replacement
                          answers.
                        properties:
                          commentID:
                            description: commentID is the comment's ID in the source.
                            format: int64
                            minimum: 1
                            type: integer
                          digest:
                            description: digest is the SHA-256 of the stored, redacted
                              hint text.
                            pattern: ^sha256:[0-9a-f]{64}$
                            type: string
                          source:
                            description: source is the system the comment is in.
                            enum:
                            - GitHub
                            type: string
                        required:
                        - commentID
                        - digest
                        - source
                        type: object
                      name:
                        description: name of the predecessor.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      phase:
                        description: phase is how far this side has come.
                        enum:
                        - Reserved
                        - Intent
                        - Done
                        - Aborted
                        type: string
                      uid:
                        description: uid of the predecessor.
                        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        type: string
                    required:
                    - hint
                    - name
                    - phase
                    - uid
                    type: object
                    x-kubernetes-validations:
                    - message: an incoming handoff is Reserved, Done or Aborted
                      rule: self.phase in ['Reserved', 'Done', 'Aborted']
                    - message: 'an incoming handoff is pinned: only its phase changes'
                      rule: self.name == oldSelf.name && self.uid == oldSelf.uid &&
                        self.hint == oldSelf.hint
                    - message: an incoming handoff moves only from Reserved to Done
                        or Aborted
                      rule: oldSelf.phase == self.phase || (oldSelf.phase == 'Reserved'
                        && self.phase in ['Done', 'Aborted'])
                  to:
                    description: to is the outgoing side, set on a predecessor.
                    properties:
                      expectedHead:
                        description: |-
                          expectedHead is the head of the branch when the intent was recorded: the replacement's commit must have
                          it as its parent.
                        pattern: ^[0-9a-f]{40}$
                        type: string
                      hint:
                        description: hint is this request's hint the replacement answers.
                        properties:
                          commentID:
                            description: commentID is the comment's ID in the source.
                            format: int64
                            minimum: 1
                            type: integer
                          digest:
                            description: digest is the SHA-256 of the stored, redacted
                              hint text.
                            pattern: ^sha256:[0-9a-f]{64}$
                            type: string
                          source:
                            description: source is the system the comment is in.
                            enum:
                            - GitHub
                            type: string
                        required:
                        - commentID
                        - digest
                        - source
                        type: object
                      name:
                        description: name of the replacement.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      phase:
                        description: phase is how far this side has come.
                        enum:
                        - Reserved
                        - Intent
                        - Done
                        - Aborted
                        type: string
                      uid:
                        description: uid of the replacement, so a request recreated
                          under the same name is never taken for it.
                        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        type: string
                    required:
                    - expectedHead
                    - hint
                    - name
                    - phase
                    - uid
                    type: object
                    x-kubernetes-validations:
                    - message: an outgoing handoff is Intent, Done or Aborted
                      rule: self.phase in ['Intent', 'Done', 'Aborted']
                    - message: 'an outgoing handoff is pinned: only its phase changes'
                      rule: self.name == oldSelf.name && self.uid == oldSelf.uid &&
                        self.hint == oldSelf.hint && self.expectedHead == oldSelf.expectedHead
                    - message: an outgoing handoff moves only from Intent to Done
                        or Aborted
                      rule: oldSelf.phase == self.phase || (oldSelf.phase == 'Intent'
                        && self.phase in ['Done', 'Aborted'])
                type: object
                x-kubernetes-validations:
                - message: a handoff has from, to or both
                  rule: has(self.from) || has(self.to)
              hints:
                description: |-
                  hints are the reviewer hints the executor accepted from comments on the pull request, and the hints a
                  replacement carried over from its chain (ADR-0028). Two bounds: at most MaxStoredHints entries in all,
                  and at most MaxHints of them Consumed or Reserved, the hints a supersede chain may consume. Only the
                  executor writes them; a stored hint keeps its pin, moves only forward in its state and is never removed,
                  so a Declined hint stays as the record of what was asked. Planned: carrying them over to a replacement.
                items:
                  description: |-
                    Hint is one reviewer hint the executor accepted from a comment on the request's pull request (ADR-0028
                    section 2): its author had write access when it was accepted, its text is redacted and bounded, and it is
                    pinned by comment ID, digest and the comment's updatedAt. Only the executor writes it; the analyzer reads
                    the stored text, never the comment.
                  properties:
                    acceptedAt:
                      description: acceptedAt is when the executor accepted the hint.
                      format: date-time
                      type: string
                    author:
                      description: author wrote the comment.
                      properties:
                        id:
                          description: id is the author's numeric user ID in the source.
                          format: int64
                          minimum: 1
                          type: integer
                        login:
                          description: login is the author's login when the hint was
                            accepted, for the reader only.
                          maxLength: 100
                          minLength: 1
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                          type: string
                      required:
                      - id
                      - login
                      type: object
                    commentID:
                      description: commentID is the comment's ID in the source.
                      format: int64
                      minimum: 1
                      type: integer
                    digest:
                      description: digest is the SHA-256 of text.
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    reason:
                      description: reason says why a Declined hint was declined, for
                        example BudgetSpent or NoProposal.
                      maxLength: 64
                      minLength: 1
                      pattern: ^[A-Z][A-Za-z0-9]*$
                      type: string
                    source:
                      description: source is the system the comment is in.
                      enum:
                      - GitHub
                      type: string
                    state:
                      description: state says what became of the hint.
                      enum:
                      - Pending
                      - Reserved
                      - Consumed
                      - Declined
                      type: string
                    text:
                      description: |-
                        text is the hint after redaction, at most 2048 bytes. It is untrusted input: the analysis fences it as
                        a reviewer's opinion, never as instructions or evidence.
                      maxLength: 2048
                      minLength: 1
                      type: string
                    updatedAt:
                      description: |-
                        updatedAt is the comment's updated time when the hint was accepted. A comment whose updated time
                        differs later was edited after acceptance, and the edit is ignored.
                      format: date-time
                      type: string
                  required:
                  - acceptedAt
                  - author
                  - commentID
                  - digest
                  - source
                  - state
                  - text
                  - updatedAt
                  type: object
                  x-kubernetes-validations:
                  - message: text must be at most 2048 bytes
                    rule: size(bytes(self.text)) <= 2048
                  - message: a Declined hint needs a reason
                    rule: self.state != 'Declined' || has(self.reason)
                  - message: 'a stored hint is pinned: only its state and reason change'
                    rule: self.source == oldSelf.source && self.commentID == oldSelf.commentID
                      && self.digest == oldSelf.digest && self.text == oldSelf.text
                      && self.author == oldSelf.author && self.updatedAt == oldSelf.updatedAt
                      && self.acceptedAt == oldSelf.acceptedAt
                  - message: the reason of a Consumed or Declined hint never changes
                    rule: '!(oldSelf.state in [''Consumed'', ''Declined'']) || (has(self.reason)
                      == has(oldSelf.reason) && (!has(self.reason) || self.reason
                      == oldSelf.reason))'
                  - message: a hint moves only from Pending to Reserved or Declined,
                      and from Reserved to Consumed or Declined
                    rule: oldSelf.state == self.state || (oldSelf.state == 'Pending'
                      && self.state in ['Reserved', 'Declined']) || (oldSelf.state
                      == 'Reserved' && self.state in ['Consumed', 'Declined'])
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - source
                - commentID
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: 'status.hints: at most 3 hints are Consumed or Reserved'
                  rule: self.filter(h, h.state in ['Consumed', 'Reserved']).size()
                    <= 3
              holdsTarget:
                description: |-
                  holdsTarget is true while the request holds the executor's lock on its target: it is set in the status
                  write of the allowed decision and cleared only once the request's pull request is known merged or closed,
                  or a look-up by its branch and marker found none of its own open. While it is true no other request on the
                  same target goes through the policy check. Unset on a request not yet decided, and on one written before the
                  field existed; the executor then derives it once from the request's phase and pull request, keeping the
                  lock when in doubt.
                  A refused request gets false with its refusal.
                  It is a selectable field (field selector status.holdsTarget), so the executor's lock reads only holders.
                type: boolean
              lastPhaseTransitionTime:
                description: |-
                  lastPhaseTransitionTime is when phase last changed, to the microsecond. The circuit breaker orders the
                  outcomes of requests by it.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation the status describes.
                format: int64
                type: integer
              phase:
                description: |-
                  phase summarizes progress. It is a selectable field (field selector status.phase), so the executor's
                  limits list only the phases they need from the API server.
                enum:
                - Pending
                - PolicyChecked
                - PRCreated
                - AwaitingApproval
                - AutoMergeQueued
                - Merged
                - WaitingForDelivery
                - Verifying
                - Succeeded
                - Denied
                - Failed
                - Expired
                - Cancelled
                - Superseded
                - NeedsIntervention
                type: string
              planDigest:
                description: |-
                  planDigest covers the semantic change, the target UID, the resolved source with the repository URL and
                  provider installation from RemediationSettings, and the policy UID and generation. It is fixed when the
                  branch is created; if any input changes later, the request becomes Superseded and its PR is closed.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              planRepository:
                description: planRepository is the repository and installation the
                  plan digest covers, set together with planDigest.
                properties:
                  installationID:
                    description: installationID is the provider installation that
                      covers the repository; 0 when the provider has none.
                    format: int64
                    minimum: 0
                    type: integer
                  url:
                    description: url is the repository URL from RemediationSettings.
                    maxLength: 512
                    type: string
                required:
                - url
                type: object
              policyRevision:
                description: |-
                  policyRevision is the policy name and generation the decision used, as name/generation. The policy UID
                  is recorded next to it, because a deleted and recreated policy can reach the same generation again.
                maxLength: 128
                type: string
              policyUID:
                description: policyUID is the UID of the policy the decision used.
                  It is part of the plan digest.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              pullRequest:
                description: pullRequest is set once the pull request exists.
                properties:
                  appliedObservedAt:
                    description: |-
                      appliedObservedAt is when the executor first saw the GitOps controller report mergeCommitSHA, or a later
                      commit of the target branch that holds it, as applied and Ready. It is set once and never moved, so a
                      deadline measured from it (the rollout check, condition RolledOut) cannot be pushed back. Written only for
                      a Deployment or StatefulSet target delivered by a Flux Kustomization, within an hour of the merge.
                    format: date-time
                    type: string
                  headSHA:
                    description: headSHA is the commit Shadewright pushed. Any other
                      head stops automation.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  mergeCommitSHA:
                    description: |-
                      mergeCommitSHA is the commit the Git host reports the pull request was merged as, recorded when
                      Shadewright sees the merge of the pull request it pushed. Delivery is checked against it: the GitOps
                      controller must report this commit, or a later commit of the target branch containing it, as applied.
                      Empty until then, and when the host reported none. Once set it never changes.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  number:
                    description: number of the pull request.
                    format: int64
                    minimum: 1
                    type: integer
                  renderedTargetHead:
                    description: |-
                      renderedTargetHead is the head of the target branch at which the change in the pull request was last
                      rendered and found to be exactly the planned one. While the pull request waits, the change is rendered
                      again only when the target branch head is another commit; empty means not rendered since it was recorded.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  url:
                    description: url of the pull request.
                    maxLength: 2048
                    pattern: ^https://
                    type: string
                required:
                - headSHA
                - number
                - url
                type: object
                x-kubernetes-validations:
                - message: appliedObservedAt needs mergeCommitSHA
                  rule: '!has(self.appliedObservedAt) || has(self.mergeCommitSHA)'
              refusedHints:
                description: |-
                  refusedHints are the newest comments with the command that the executor refused, at most
                  MaxRefusedHints, oldest first; an older one is dropped. Only the executor writes them.
                items:
                  description: |-
                    RefusedHint records a comment that carried the command and was refused, so the refusal is made once and a
                    reader sees why no hint was stored. It holds no text of the comment.
                  properties:
                    author:
                      description: author wrote the comment, as the source's API reported
                        it.
                      properties:
                        id:
                          description: id is the author's numeric user ID in the source.
                          format: int64
                          minimum: 1
                          type: integer
                        login:
                          description: login is the author's login when the hint was
                            accepted, for the reader only.
                          maxLength: 100
                          minLength: 1
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                          type: string
                      required:
                      - id
                      - login
                      type: object
                    commentID:
                      description: commentID is the comment's ID in the source.
                      format: int64
                      minimum: 1
                      type: integer
                    reason:
                      description: reason says why no hint was stored.
                      enum:
                      - CapReached
                      - TooLong
                      - NotRedactable
                      - Empty
                      - EditedAfterAccept
                      - EditedAfterSeen
                      type: string
                    refusedAt:
                      description: refusedAt is when the executor refused it.
                      format: date-time
                      type: string
                    source:
                      description: source is the system the comment is in.
                      enum:
                      - GitHub
                      type: string
                  required:
                  - author
                  - commentID
                  - reason
                  - refusedAt
                  - source
                  type: object
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - source
                - commentID
                x-kubernetes-list-type: map
              rollout:
                description: rollout is what the check after the merge keeps between
                  reconciles (the RolledOut condition).
                properties:
                  appliedRevision:
                    description: |-
                      appliedRevision is the commit the GitOps controller reported applied when the executor first saw the merge
                      commit delivered: the merge commit, or a later commit of the target branch that holds it.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  ended:
                    description: ended is true once the check gave its final verdict
                      in RolledOut; nothing is read for it after that.
                    type: boolean
                  pausedSeconds:
                    description: |-
                      pausedSeconds is how long, in seconds, writes were paused while the executor waited for the delivery; the
                      delivery window is extended by it (and by the pause still running), so a pause never uses up the window.
                      It never decreases.
                    format: int64
                    minimum: 0
                    type: integer
                  pausedSince:
                    description: |-
                      pausedSince is when the executor first saw writes paused (RemediationSettings spec.paused) while it waited
                      for the delivery; cleared when it sees them resumed, the paused time then added to pausedSeconds. It is
                      never moved while set.
                    format: date-time
                    type: string
                  targetGeneration:
                    description: |-
                      targetGeneration is the target's metadata.generation read right after appliedRevision was seen applied:
                      the generation the applied commit produced.
                    format: int64
                    minimum: 0
                    type: integer
                  templateHash:
                    description: |-
                      templateHash is the SHA-256 of the target's pod template at targetGeneration. When the target's controller
                      first reports a generation past targetGeneration, the revision it names is recorded only if the template
                      is still this one; otherwise the check ends with RolledOut Unknown, reason RolloutSuperseded.
                    maxLength: 64
                    minLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  templateRevision:
                    description: |-
                      templateRevision is the template revision the check judges: a StatefulSet's status.updateRevision or a
                      Deployment's deployment.kubernetes.io/revision annotation, read once the controller observed
                      targetGeneration and the target's current generation (a revision annotation can name a later generation
                      before the status does), and, past targetGeneration, only while the template still matches templateHash. A newer revision
                      ends the check with RolledOut Unknown, reason RolloutSuperseded.
                    maxLength: 253
                    type: string
                  waitStartedAt:
                    description: |-
                      waitStartedAt is when the executor started waiting for the delivery of a merged request that has no
                      lastPhaseTransitionTime; the delivery window is then measured from it instead of from the merge.
                    format: date-time
                    type: string
                type: object
              source:
                description: source is where the change is made, resolved by the controller
                  before the policy check.
                properties:
                  baseCommit:
                    description: |-
                      baseCommit is the full SHA of the target branch the change was made against. It is fixed when the branch
                      is created; later merges to the target branch do not change it.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  buildPath:
                    description: |-
                      buildPath is the directory the Flux Kustomization builds (its spec.path, "." for the repository root).
                      Before every commit the pull request step renders it with and without the change and refuses anything
                      but the planned difference (design 8.2, steps 4 and 5). The policy check always sets it, and the plan
                      digest covers it; a request without it is never committed.
                    maxLength: 512
                    minLength: 1
                    pattern: ^(\.|[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*)$
                    type: string
                  path:
                    description: path is the file that declares the target.
                    maxLength: 512
                    minLength: 1
                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*\.ya?ml$
                    type: string
                  repositoryRef:
                    description: repositoryRef is the RemediationSettings entry whose
                      URL matches the Flux source.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  targetBranch:
                    description: |-
                      targetBranch is the branch the pull request targets: the branch Flux tracks, which must equal the
                      repository's targetBranch in RemediationSettings.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a plain branch name, not HEAD, refs/..., shadewright/...
                        or one containing '..' or '.lock'
                      rule: '!self.contains(''..'') && !self.endsWith(''.lock'') &&
                        !self.contains(''.lock/'') && self != ''HEAD'' && !self.startsWith(''refs/'')
                        && !self.startsWith(''shadewright/'')'
                required:
                - baseCommit
                - path
                - repositoryRef
                - targetBranch
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: status.pullRequest.mergeCommitSHA is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.pullRequest) || !has(oldSelf.status.pullRequest.mergeCommitSHA)
            || (has(self.status) && has(self.status.pullRequest) && has(self.status.pullRequest.mergeCommitSHA)
            && self.status.pullRequest.mergeCommitSHA == oldSelf.status.pullRequest.mergeCommitSHA)'
        - message: status.pullRequest.appliedObservedAt is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.pullRequest) || !has(oldSelf.status.pullRequest.appliedObservedAt)
            || (has(self.status) && has(self.status.pullRequest) && has(self.status.pullRequest.appliedObservedAt)
            && self.status.pullRequest.appliedObservedAt == oldSelf.status.pullRequest.appliedObservedAt)'
        - message: 'status.hints: a stored hint is never removed'
          rule: '!has(oldSelf.status) || !has(oldSelf.status.hints) || (has(self.status)
            && has(self.status.hints) && oldSelf.status.hints.all(o, self.status.hints.exists(h,
            h.source == o.source && h.commentID == o.commentID)))'
        - message: status.handoff.from is never removed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.handoff) || !has(oldSelf.status.handoff.from)
            || (has(self.status) && has(self.status.handoff) && has(self.status.handoff.from))'
        - message: status.handoff.to is never removed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.handoff) || !has(oldSelf.status.handoff.to)
            || (has(self.status) && has(self.status.handoff) && has(self.status.handoff.to))'
        - message: status.handoff.from starts in Reserved
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.from)
            || self.status.handoff.from.phase == ''Reserved'' || (has(oldSelf.status)
            && has(oldSelf.status.handoff) && has(oldSelf.status.handoff.from))'
        - message: status.handoff.to starts in Intent
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.to)
            || self.status.handoff.to.phase == ''Intent'' || (has(oldSelf.status)
            && has(oldSelf.status.handoff) && has(oldSelf.status.handoff.to))'
        - message: status.handoff.from must match spec.replaces
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.from)
            || (has(self.spec.replaces) && self.status.handoff.from.name == self.spec.replaces.name
            && self.status.handoff.from.uid == self.spec.replaces.uid && self.status.handoff.from.hint.source
            == self.spec.replaces.hint.source && self.status.handoff.from.hint.commentID
            == self.spec.replaces.hint.commentID && self.status.handoff.from.hint.digest
            == self.spec.replaces.hint.digest)'
        - message: status.handoff.to must name a hint in status.hints that is no longer
            Pending, and Reserved while the intent stands
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.to)
            || (has(self.status.hints) && self.status.hints.exists(h, h.source ==
            self.status.handoff.to.hint.source && h.commentID == self.status.handoff.to.hint.commentID
            && h.digest == self.status.handoff.to.hint.digest && h.state != ''Pending''
            && (self.status.handoff.to.phase != ''Intent'' || h.state == ''Reserved'')))'
        - message: status.rollout is kept once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || (has(self.status)
            && has(self.status.rollout))'
        - message: status.rollout.waitStartedAt is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.waitStartedAt)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.waitStartedAt)
            && self.status.rollout.waitStartedAt == oldSelf.status.rollout.waitStartedAt)'
        - message: status.rollout.appliedRevision is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.appliedRevision)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.appliedRevision)
            && self.status.rollout.appliedRevision == oldSelf.status.rollout.appliedRevision)'
        - message: status.rollout.targetGeneration is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.targetGeneration)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.targetGeneration)
            && self.status.rollout.targetGeneration == oldSelf.status.rollout.targetGeneration)'
        - message: status.rollout.templateHash is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.templateHash)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.templateHash)
            && self.status.rollout.templateHash == oldSelf.status.rollout.templateHash)'
        - message: status.rollout.templateRevision is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.templateRevision)
            || (has(self.status) && has(self.status.rollout) && has(self.status.rollout.templateRevision)
            && self.status.rollout.templateRevision == oldSelf.status.rollout.templateRevision)'
        - message: status.rollout.pausedSince is never moved while set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.rollout) || !has(oldSelf.status.rollout.pausedSince)
            || !has(self.status) || !has(self.status.rollout) || !has(self.status.rollout.pausedSince)
            || self.status.rollout.pausedSince == oldSelf.status.rollout.pausedSince'
