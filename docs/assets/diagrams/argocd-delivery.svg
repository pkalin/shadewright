<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">What the executor reads from Argo CD</title>
  <desc id="d">Planned, not built. Four columns, left to right. Column 1, the workload: its tracking-id annotation names an Application and is not trusted; the instance label is not read; a workload that carries the evidence of the other delivery system (Flux labels) is refused. Column 2, the Application, read with get in the Argo CD control plane namespace: metadata (the skip-reconcile annotation, owner references, deletion time), spec (source, sources, source hydrator, destination, ignore differences, automated sync) and status (sync, resources, operation state, conditions, source type, health, history). The Application's writers (the Argo CD controller, API users who may update Applications, cluster administrators, authors of a parent's Git source) are in the trust base of the delivery verdict. Below it, what is never read: the argocd-cm ConfigMap, AppProjects, Secrets and the repo server. Column 3, the checks the executor makes on those fields, and below them the Git host outside the cluster, which answers the branch head, file reads, directory listings, whether one commit is in the history of another and whether a tag has the branch's name. Column 4, the two results: the source mapping, which writes repository, branch, path, file and base commit to the request status or stops with a reason, and the delivery status that DeliveryVerifier returns, read from the sync and operation state, with health not an input. Applied is reported only when the live target also holds the merged value, and an Application with the skip-reconcile annotation gives no verdict.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c24fc" stop-opacity=".35"/><stop offset="1" stop-color="#7c24fc" stop-opacity=".08"/></linearGradient>
    <style>
      .box{fill:#1d1b2b;stroke:#3a3556;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#7c24fc;stroke-width:1.6}
      .ext{fill:#16222a;stroke:#2f5d63;stroke-width:1.2}
      .no{fill:#241a22;stroke:#6b3a4a;stroke-width:1.2}
      .h{fill:#f1edff;font-size:15px;font-weight:650}
      .s{fill:#a9a4c4;font-size:12.5px}
      .f{stroke:#a879ff;stroke-width:1.8;fill:none}
      .l{fill:#c6a8ff;font-size:12.5px;font-weight:600}
      .n{fill:#7d7999;font-size:12.5px}
    </style>
  </defs>

  <rect width="1150" height="420" rx="18" fill="#0e0e16"/>

  <rect class="ext" x="30" y="110" width="230" height="110" rx="12"/>
  <text class="h" x="145.0" y="151.0" text-anchor="middle">Live workload</text>
  <text class="s" x="145.0" y="172.0" text-anchor="middle">tracking-id annotation</text>
  <text class="s" x="145.0" y="191.0" text-anchor="middle">a hint, never proof</text>
  <rect class="no" x="30" y="270" width="230" height="80" rx="12"/>
  <text class="h" x="145.0" y="305.5" text-anchor="middle">Other system evidence</text>
  <text class="s" x="145.0" y="326.5" text-anchor="middle">Flux labels: refused</text>
  <rect class="key" x="320" y="110" width="230" height="110" rx="12"/>
  <text class="h" x="435.0" y="141.5" text-anchor="middle">Application</text>
  <text class="s" x="435.0" y="162.5" text-anchor="middle">read with get</text>
  <text class="s" x="435.0" y="181.5" text-anchor="middle">metadata, spec, status</text>
  <text class="s" x="435.0" y="200.5" text-anchor="middle">control plane namespace</text>
  <rect class="no" x="320" y="270" width="230" height="80" rx="12"/>
  <text class="h" x="435.0" y="296.0" text-anchor="middle">Never read, never written</text>
  <text class="s" x="435.0" y="317.0" text-anchor="middle">argocd-cm, AppProjects,</text>
  <text class="s" x="435.0" y="336.0" text-anchor="middle">Secrets, repo server</text>
  <rect class="key" x="610" y="110" width="230" height="110" rx="12"/>
  <text class="h" x="725.0" y="141.5" text-anchor="middle">Seven checks</text>
  <text class="s" x="725.0" y="162.5" text-anchor="middle">id, source, revision,</text>
  <text class="s" x="725.0" y="181.5" text-anchor="middle">status, URL, branch</text>
  <text class="s" x="725.0" y="200.5" text-anchor="middle">fail closed</text>
  <rect class="ext" x="610" y="270" width="230" height="80" rx="12"/>
  <text class="h" x="725.0" y="296.0" text-anchor="middle">Git host</text>
  <text class="s" x="725.0" y="317.0" text-anchor="middle">outside the cluster</text>
  <text class="s" x="725.0" y="336.0" text-anchor="middle">branch head, history</text>
  <rect class="box" x="900" y="110" width="220" height="110" rx="12"/>
  <text class="h" x="1010.0" y="151.0" text-anchor="middle">Source mapping</text>
  <text class="s" x="1010.0" y="172.0" text-anchor="middle">repository, branch, path</text>
  <text class="s" x="1010.0" y="191.0" text-anchor="middle">or a stop with a reason</text>
  <rect class="box" x="900" y="270" width="220" height="80" rx="12"/>
  <text class="h" x="1010.0" y="305.5" text-anchor="middle">DeliveryVerifier.Status</text>
  <text class="s" x="1010.0" y="326.5" text-anchor="middle">Pending, Applied, Failed</text>
  <path class="f" d="M260 165H320" marker-end="url(#a)"/>
  <text class="l" x="290" y="157" text-anchor="middle">read</text>
  <path class="f" d="M550 165H610" marker-end="url(#a)"/>
  <text class="l" x="580" y="157" text-anchor="middle">check</text>
  <path class="f" d="M840 150H900" marker-end="url(#a)"/>
  <path class="f" d="M840 200H870V310H900" marker-end="url(#a)"/>
  <path class="f" d="M725 220V270" marker-end="url(#a)"/>
  <text class="l" x="737" y="250" text-anchor="start">compare</text>
  <text class="n" x="30" y="395">Planned. Nothing in this diagram is built.</text>
</svg>
