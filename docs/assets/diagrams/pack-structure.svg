<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 640" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">Shadewright pack structure</title>
<desc id="d">Overview of ADR-0034 (proposed, nothing built). A pack is a directory of data with five parts: the manifest pack.yaml, diagnosis rules, guidance text, a verification contract and rule cases. One reader, packs.Load, reads it from an embedded file system now and from an OCI layer held in memory later, decodes strictly, bounds sizes, computes the content digest and runs the rule cases. The parts land in five places: the module registry (Rules and Checks only), one block of the model context, the verification part of the plan, the evaluation manifest, and the analysis record and pull request body as provenance. On the right, the core that a pack never reaches: the action catalog, the policy bounds and decision, the proposal validator, the patchers and the executor, RBAC, built-in redaction and the verification minimums. A dashed wall separates the two.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
<style>
.bt{fill:#1d1b2b;stroke:#7c24fc;stroke-width:1.4}
.pl{fill:#1d1b2b;stroke:#7c24fc;stroke-width:1.4;stroke-dasharray:5 4}
.core{fill:#1d1b2b;stroke:#4fd1c5;stroke-width:1.4}
.lanet{fill:#7d7999;font-size:13px;font-weight:600;letter-spacing:.12em}
.h{fill:#f1edff;font-size:15px;font-weight:650}
.s{fill:#a9a4c4;font-size:12.5px}
.lbl{fill:#c6a8ff;font-size:12.5px}
.no{fill:#ff8fa3;font-size:12.5px;font-weight:600}
.fb{stroke:#a879ff;stroke-width:1.8;fill:none}
.wall{stroke:#ff8fa3;stroke-width:2;stroke-dasharray:3 5}
</style></defs>
<rect width="1380" height="640" rx="18" fill="#0e0e16"/>
<text class="lanet" x="20" y="62">1  PACK: DATA ONLY</text>
<text class="lanet" x="330" y="62">2  ONE READER</text>
<text class="lanet" x="640" y="62">3  WHERE EACH PART LANDS</text>
<text class="lanet" x="1110" y="62">4  THE CORE</text>
<rect class="bt" x="20" y="80" width="270" height="86" rx="10"/>
<text class="h" x="34" y="106">pack.yaml</text>
<text class="s" x="34" y="128">manifest: name, module, files</text>
<rect class="bt" x="20" y="180" width="270" height="86" rx="10"/>
<text class="h" x="34" y="206">rules/*.yaml</text>
<text class="s" x="34" y="228">one rule kind: incident</text>
<rect class="bt" x="20" y="280" width="270" height="86" rx="10"/>
<text class="h" x="34" y="306">guidance.txt</text>
<text class="s" x="34" y="328">plain text, at most 2 KiB</text>
<rect class="bt" x="20" y="380" width="270" height="86" rx="10"/>
<text class="h" x="34" y="406">verification.yaml</text>
<text class="s" x="34" y="428">add checks, raise stableFor</text>
<rect class="bt" x="20" y="480" width="270" height="86" rx="10"/>
<text class="h" x="34" y="506">cases/*.yaml</text>
<text class="s" x="34" y="528">evidence in, findings out</text>
<text class="s" x="20" y="590">Identity: the content digest of all files.</text>
<rect class="bt" x="330" y="80" width="270" height="250" rx="10"/>
<text class="h" x="344" y="106">packs.Load(fs.FS, digest)</text>
<text class="s" x="344" y="128">strict YAML, no anchors</text>
<text class="s" x="344" y="147">no unknown key, no link, no code</text>
<text class="s" x="344" y="166">bounded files, tree and strings</text>
<text class="s" x="344" y="185">content digest checked</text>
<text class="s" x="344" y="204">rule cases run at load</text>
<text class="s" x="344" y="223">a failed case refuses the pack</text>
<rect class="bt" x="330" y="370" width="130" height="96" rx="10"/>
<text class="h" x="344" y="396">Compiled in</text>
<text class="s" x="344" y="418">go:embed</text>
<text class="s" x="344" y="437">in the binary</text>
<text class="s" x="344" y="456">(now)</text>
<rect class="pl" x="470" y="370" width="130" height="96" rx="10"/>
<text class="h" x="484" y="396">OCI (later)</text>
<text class="s" x="484" y="418">layer in memory,</text>
<text class="s" x="484" y="437">pinned by digest</text>
<path class="fb" d="M395 370 L395 330" marker-end="url(#a)"/>
<path class="fb" d="M535 370 L535 330" marker-end="url(#a)"/>
<text class="s" x="330" y="490">Same reader for both sources.</text>
<rect class="bt" x="640" y="80" width="420" height="86" rx="10"/>
<text class="h" x="654" y="106">Module registry</text>
<text class="s" x="654" y="128">Hooks.Rules and Hooks.Checks only</text>
<text class="s" x="654" y="147">Symptoms, Tools, Actions stay empty</text>
<rect class="bt" x="640" y="180" width="420" height="86" rx="10"/>
<text class="h" x="654" y="206">Context</text>
<text class="s" x="654" y="228">one pack block after the policy block</text>
<text class="s" x="654" y="247">redacted, fixed notice, never quotable</text>
<rect class="bt" x="640" y="280" width="420" height="86" rx="10"/>
<text class="h" x="654" y="306">Plan</text>
<text class="s" x="654" y="328">spec.verification: core plus pack</text>
<text class="s" x="654" y="347">the larger stableFor, never lower</text>
<rect class="bt" x="640" y="380" width="420" height="86" rx="10"/>
<text class="h" x="654" y="406">Evaluation manifest</text>
<text class="s" x="654" y="428">packs: name, version, content digest</text>
<text class="s" x="654" y="447">any changed byte, a new digest</text>
<rect class="bt" x="640" y="480" width="420" height="86" rx="10"/>
<text class="h" x="654" y="506">Record and pull request</text>
<text class="s" x="654" y="528">pack digest, provenance only</text>
<text class="s" x="654" y="547">no component decides from it</text>
<path class="fb" d="M600 123 L640 123" marker-end="url(#a)"/>
<path class="fb" d="M600 223 L640 223" marker-end="url(#a)"/>
<path class="fb" d="M600 250 L640 323" marker-end="url(#a)"/>
<path class="fb" d="M600 250 L640 423" marker-end="url(#a)"/>
<path class="fb" d="M600 250 L640 523" marker-end="url(#a)"/>
<path class="fb" d="M290 123 L330 123" marker-end="url(#a)"/>
<path class="fb" d="M290 223 L330 223" marker-end="url(#a)"/>
<path class="fb" d="M290 323 L330 300" marker-end="url(#a)"/>
<path class="fb" d="M290 423 L312 423 L312 315 L330 315" marker-end="url(#a)"/>
<path class="fb" d="M290 523 L304 523 L304 315 L330 315" marker-end="url(#a)"/>
<path class="wall" d="M1085 80 L1085 566"/>
<text class="no" x="1096" y="590">No key, no import, no grant.</text>
<rect class="core" x="1110" y="80" width="250" height="486" rx="10"/>
<text class="h" x="1124" y="106">Never in a pack</text>
<text class="lbl" x="1124" y="128">action catalog (ActionTypes)</text>
<text class="lbl" x="1124" y="147">parameters and target kinds</text>
<text class="lbl" x="1124" y="166">RemediationPolicy bounds</text>
<text class="lbl" x="1124" y="185">policy.Decide and accept</text>
<text class="lbl" x="1124" y="204">patchers and the executor</text>
<text class="lbl" x="1124" y="223">Git writes, the pull request</text>
<text class="lbl" x="1124" y="242">RBAC, watches, tools</text>
<text class="lbl" x="1124" y="261">built-in redaction</text>
<text class="lbl" x="1124" y="280">verification minimums</text>
<text class="lbl" x="1124" y="299">the system prompt</text>
<text class="s" x="1124" y="318"></text>
<text class="s" x="1124" y="337">still enforced by code that</text>
<text class="s" x="1124" y="356">does not know packs exist</text>
</svg>
