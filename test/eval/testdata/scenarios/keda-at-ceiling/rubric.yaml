# How the diagnosis of keda-at-ceiling is scored: each fact of expected.yaml, verbatim, with the terms the
# result's summary, hypotheses or evidence quotes must contain (case ignored), or why it is not scored.
facts:
  - fact: the HPA runs at its maximum, ScalingLimited is True with reason TooManyReplicas, and spec.maxReplicas and status.currentReplicas are both 2
    all: ["TooManyReplicas"]
  - fact: the owning ScaledObject is worker
    all: ["worker"]
  - fact: the backlog, the current external metric value (about 13 requests per second) against its target (5 per replica)
    unscored: no approved metric template reads HPA or external metrics, and a ScaledObject subject resolves no pods, so the metrics section has nothing to query; the Incident's symptom evidence would carry the values, but recorded milli quantities (such as 6500m) are normalized away, so this recorded Incident does not hold them
  - fact: the ScaledObject is Ready, not paused, not on fallback, and its HPA can read its metrics
    unscored: checked by the policy gate for AdjustKedaMaxReplicas at the policy step, not diagnosis input
  - fact: request rate and replica history over time
    unscored: no approved metric template reads request rates or replica history, so the scenario records no metrics.yaml
