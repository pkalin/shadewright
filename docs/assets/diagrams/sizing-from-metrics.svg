<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Shadewright sizing from metrics</title>
  <desc id="d">Overview of ADR-0040, accepted. The context builder reads the memory working set and the limit of the target's containers from the metrics source with approved query templates and keeps the numbers as typed values. After the model replies, the analysis loop takes only the action and the container from the reply, accepts them only where code saw memory pressure for that container (the Incident's OOMKilled symptom or a peak near the limit) and ignores any size. Code computes the size: observed peak plus headroom, a multiplicative step when at the limit, rounded up, clamped to the policy range and step, rounded down to the unit. Without a measurement the Incident is handed off as MissingData, without pressure as NoMemoryPressure. The request is created with the new limit and optional typed sizing evidence. The executor's policy engine decides the request as before, and the executor prints the evidence in the pull request body. Where there is no Prometheus, the OOMKilled symptom, whose termination must be the one in the container status, is the measurement for the at-the-limit step, and only when the metrics server answers; if it is absent or the read fails there is no proposal. The symptom must name the container, which needs ADR-0039; until then the gate stays shut. The model sits beside this path and chooses only the action and the container.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c24fc" stop-opacity=".35"/><stop offset="1" stop-color="#7c24fc" stop-opacity=".08"/></linearGradient>
    <style>
      .box{fill:#1d1b2b;stroke:#3a3556;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#7c24fc;stroke-width:1.6}
      .ext{fill:#16222a;stroke:#2f5d63;stroke-width:1.2}
      .no{fill:#241a22;stroke:#6b3a4a;stroke-width:1.2}
      .h{fill:#f1edff;font-size:15px;font-weight:650}
      .s{fill:#a9a4c4;font-size:12.5px}
      .f{stroke:#a879ff;stroke-width:1.8;fill:none}
      .l{fill:#c6a8ff;font-size:12.5px;font-weight:600}
      .n{fill:#7d7999;font-size:12.5px}
    </style>
  </defs>

  <rect width="1190" height="420" rx="18" fill="#0e0e16"/>

  <rect class="ext" x="30" y="130" width="170" height="100" rx="12"/>
  <text class="h" x="115.0" y="166.0" text-anchor="middle">Metrics source</text>
  <text class="s" x="115.0" y="187.0" text-anchor="middle">Prometheus</text>
  <text class="s" x="115.0" y="206.0" text-anchor="middle">working set, limit</text>
  <rect class="key" x="270" y="130" width="170" height="100" rx="12"/>
  <text class="h" x="355.0" y="166.0" text-anchor="middle">Measurement</text>
  <text class="s" x="355.0" y="187.0" text-anchor="middle">typed values</text>
  <text class="s" x="355.0" y="206.0" text-anchor="middle">peak, samples</text>
  <rect class="key" x="510" y="130" width="170" height="100" rx="12"/>
  <text class="h" x="595.0" y="166.0" text-anchor="middle">Size by code</text>
  <text class="s" x="595.0" y="187.0" text-anchor="middle">peak plus headroom,</text>
  <text class="s" x="595.0" y="206.0" text-anchor="middle">clamped to policy</text>
  <rect class="box" x="750" y="130" width="170" height="100" rx="12"/>
  <text class="h" x="835.0" y="166.0" text-anchor="middle">Request</text>
  <text class="s" x="835.0" y="187.0" text-anchor="middle">RemediationRequest</text>
  <text class="s" x="835.0" y="206.0" text-anchor="middle">with sizing evidence</text>
  <rect class="ext" x="990" y="130" width="170" height="100" rx="12"/>
  <text class="h" x="1075.0" y="175.5" text-anchor="middle">Pull request</text>
  <text class="s" x="1075.0" y="196.5" text-anchor="middle">evidence in the body</text>
  <rect class="box" x="270" y="290" width="170" height="80" rx="12"/>
  <text class="h" x="355.0" y="325.5" text-anchor="middle">MissingData</text>
  <text class="s" x="355.0" y="346.5" text-anchor="middle">no measurement</text>
  <rect class="box" x="510" y="290" width="170" height="80" rx="12"/>
  <text class="h" x="595.0" y="316.0" text-anchor="middle">No proposal</text>
  <text class="s" x="595.0" y="337.0" text-anchor="middle">NoMemoryPressure,</text>
  <text class="s" x="595.0" y="356.0" text-anchor="middle">SizeNotAnIncrease</text>
  <rect class="box" x="750" y="290" width="170" height="80" rx="12"/>
  <text class="h" x="835.0" y="325.5" text-anchor="middle">Policy engine</text>
  <text class="s" x="835.0" y="346.5" text-anchor="middle">unchanged</text>
  <rect class="box" x="510" y="20" width="170" height="70" rx="12"/>
  <text class="h" x="595.0" y="50.5" text-anchor="middle">Model</text>
  <text class="s" x="595.0" y="71.5" text-anchor="middle">action, container only</text>
  <path class="f" d="M200 180H270" marker-end="url(#a)"/>
  <path class="f" d="M440 180H510" marker-end="url(#a)"/>
  <path class="f" d="M680 180H750" marker-end="url(#a)"/>
  <path class="f" d="M920 180H990" marker-end="url(#a)"/>
  <path class="f" d="M355 230V290" marker-end="url(#a)"/>
  <path class="f" d="M595 230V290" marker-end="url(#a)"/>
  <path class="f" d="M835 230V290" marker-end="url(#a)"/>
  <path class="f" d="M595 90V130" marker-end="url(#a)"/>
  <text class="n" x="30" y="405">ADR-0040, accepted. The model's size is never read.</text>
</svg>
