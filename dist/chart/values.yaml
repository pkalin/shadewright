# Shadewright chart values. The schema in values.schema.json validates them on install, upgrade, lint and
# template. Nothing here looks like a real identity or cluster. With no values at all the published chart installs
# an idle Shadewright: the analyzer watches no namespace and the executor has no Azure workload identity, so it
# cannot reach Key Vault to sign for the GitHub App.
# README.md is generated from the "# --" comments below with helm-docs (make chart-docs): every key needs one.

# -- Partially overrides the chart name, which is kept in the release name. At most 63 characters. Empty uses `shadewright`.
# @section -- General
nameOverride: ""
# -- Fully overrides the resource name prefix, at most 63 characters. Empty uses the release name (or `<release>-shadewright` if it does not contain the chart name). The ServiceAccount names, and so the subject of the federated credential, derive from it.
# @section -- General
fullnameOverride: ""
# -- Cluster ID, 1 to 63 letters, digits, `.`, `_` or `-`, starting and ending with a letter or digit. Passed as `--cluster-id` and hashed into every Incident fingerprint so Incidents of two clusters never merge. Empty uses the UID of the `kube-system` namespace, read with `lookup` at install and upgrade (stable and unique for the life of the cluster); `helm template`, `helm lint`, a client-side `--dry-run`, GitOps tools that render client-side (helm diff, Argo CD, Flux with a dry-run) and an installer without `get` on the `kube-system` namespace must set it, or the chart fails. Changing it, also from empty to a value, starts every Incident afresh, so choose it once. It is an ID, never a display name.
# @default -- empty (the UID of `kube-system`)
# @section -- General
clusterId: ""
# -- Image pull secrets of both Pods, a list of `{name: <secret>}` (at most 16), for a mirror that needs them. The default images are public. Each component's `imagePullSecrets` is added to it.
# @section -- General
imagePullSecrets: []
image:
  # -- Allow an image without a digest to run by the `appVersion` tag. Off by default, so the chart fails to render when a digest is missing: the published chart carries the release's signed digests and needs nothing here. Set `true` only from a source checkout, with images built from that same checkout (older images, such as v0.1.0, stop at start with an empty `analyzer.watchNamespaces`).
  # @section -- Images
  allowTag: false
metrics:
  # -- Serve the metrics endpoint of both components, with its two Services. When false there are no Services, no metrics RBAC and no metrics NetworkPolicy.
  # @section -- Metrics
  enabled: true
  # -- Metrics port, 1 to 65535. Passed as `--metrics-bind-address` and opened by the metrics NetworkPolicy.
  # @section -- Metrics
  port: 8443
  # -- Serve metrics over HTTPS with a TokenReview and a SubjectAccessReview per request. `false` serves plain HTTP with no authentication: for a test only, `helm install` prints a warning.
  # @section -- Metrics
  secure: true
  serviceMonitor:
    # -- Install a Prometheus Operator `ServiceMonitor` for each component (needs the `monitoring.coreos.com/v1` CRDs and `metrics.enabled`). Prometheus scrapes with its own ServiceAccount token, so bind that ServiceAccount to the `metrics-reader` ClusterRole, and label its namespace `metrics: enabled` for the NetworkPolicy. The endpoint's certificate is self-signed, so the ServiceMonitor skips its verification. It scrapes with `bearerTokenFile` (Prometheus's own token), which Prometheus Operator deprecates and rejects when `arbitraryFSAccessThroughSMs` is denied: then keep this off and write your own ServiceMonitor with `authorization` from a Secret that holds a token allowed to read metrics.
    # @section -- Metrics
    enabled: false
    # -- Scrape interval, such as `30s` or `1m`. Empty uses the Prometheus default.
    # @section -- Metrics
    interval: ""
    # -- Further labels on the ServiceMonitors, for the `serviceMonitorSelector` of your Prometheus. The chart's own labels cannot be overridden.
    # @section -- Metrics
    labels: {}
    tls:
      # -- Verify the serving certificate of the metrics endpoints instead of skipping the check. On, the ServiceMonitors send a `tlsConfig` with `ca` and `serverName` and no `insecureSkipVerify`, and the chart refuses to render without a CA. Needs `executor.metricsTLS.secretName` and `analyzer.metricsTLS.secretName` (certificates signed by that CA). Issuance stays with you: the chart creates no cert-manager object.
      # @section -- Metrics
      enabled: false
      # -- Name the certificates are checked against (the TLS server name), a DNS name that every serving certificate lists as a subject alternative name. Required when `tls.enabled`.
      # @section -- Metrics
      serverName: ""
      ca:
        secret:
          # -- Name of a Secret in the release namespace that holds the CA certificate (PEM) Prometheus trusts. Set this or `ca.configMap.name`, not both.
          # @section -- Metrics
          name: ""
          # -- Key of the CA certificate in that Secret.
          # @section -- Metrics
          key: ca.crt
        configMap:
          # -- Name of a ConfigMap in the release namespace that holds the CA certificate (PEM) Prometheus trusts. Set this or `ca.secret.name`, not both.
          # @section -- Metrics
          name: ""
          # -- Key of the CA certificate in that ConfigMap.
          # @section -- Metrics
          key: ca.crt
networkPolicy:
  # -- Install the NetworkPolicies: default deny for the namespace, DNS and TCP 443 and 6443 egress per component (the same two ports for both: a NetworkPolicy cannot tell GitHub from the model endpoint, see the README), an optional Prometheus rule for the analyzer only, and ingress to the metrics port from namespaces labeled `metrics: enabled`. Setting `false` installs no NetworkPolicy at all, so the namespace loses its default deny too and every Pod in it can talk to anything unless you restrict it yourself (`helm install` prints a warning).
  # @section -- Network policy
  enabled: true
  dns:
    # -- How the analyzer, the executor and the `helm test` Pod may reach cluster DNS (port 53, UDP and TCP). `kubeDns` allows the `kube-dns` Pods of `kube-system` (label `k8s-app: kube-dns`, CoreDNS and kube-dns). `resolverCIDRs` allows only the addresses in `resolverCIDRs`: choose it when Pods query a resolver that is not a `kube-dns` Pod, such as NodeLocal DNSCache on a link-local address. Only `kubeDns` was tried on the lab CNI (Cilium).
    # @section -- Network policy
    mode: kubeDns
    # -- Resolver addresses for `mode: resolverCIDRs`, at least one IPv4 or IPv6 CIDR such as `169.254.20.10/32`, the default address of NodeLocal DNSCache (check the listen address of your node-local-dns DaemonSet; with kube-proxy in IPVS mode that is the kube-dns Service IP as well). Ignored in `kubeDns` mode.
    # @section -- Network policy
    resolverCIDRs:
    - 169.254.20.10/32
  analyzer:
    prometheus:
      # -- Let the analyzer, and only the analyzer, send TCP to the in-cluster Prometheus it queries (the metrics source, ADR-0017). Off by default: the analyzer sends Prometheus nothing unless `--prometheus-url` is set; with `--prometheus-cluster` too it probes it at startup and every 10 minutes, and it queries it when the analysis loop (#76, on with `analyzer.analysis.triageModel`) calls the context builder or a read tool. Set it together with the analyzer's metrics source, and allow the analyzer in the ingress policy of that Prometheus too (a NetworkPolicy of the Prometheus namespace; the chart does not touch other namespaces).
      # @section -- Network policy
      enabled: false
      # -- Namespace of the Prometheus (matched by `kubernetes.io/metadata.name`). Required when `enabled`.
      # @section -- Network policy
      namespace: ""
      # -- Labels of the Prometheus server Pods in that namespace. The default matches the prometheus-community chart.
      # @section -- Network policy
      podLabels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: server
      # -- TCP port of the Prometheus HTTP API on the Pod (the container port, not the Service port), 1 to 65535.
      # @section -- Network policy
      port: 9090
    traceCollector:
      # -- Let the analyzer, and only the analyzer, send TCP to the OpenTelemetry collector of its traces (`analyzer.tracing.endpoint`). Off by default: with no endpoint the analyzer sends no trace. Set it together with the endpoint, and allow the analyzer in the ingress policy of the collector too, if it has one.
      # @section -- Network policy
      enabled: false
      # -- Namespace of the collector (matched by `kubernetes.io/metadata.name`). Required when `enabled`.
      # @section -- Network policy
      namespace: ""
      # -- Labels of the collector Pods in that namespace. The default matches the opentelemetry-collector chart.
      # @section -- Network policy
      podLabels:
        app.kubernetes.io/name: opentelemetry-collector
      # -- TCP port of the collector's OTLP gRPC receiver on the Pod, 1 to 65535.
      # @section -- Network policy
      port: 4317
crd:
  # -- Install the CRDs as templates (Helm does not upgrade or delete CRDs from a `crds/` directory). Set `false` only if you install them another way.
  # @section -- CRDs
  enabled: true
  # -- Keep the CRDs, and so every Incident and RemediationRequest, when the release is uninstalled (adds the `helm.sh/resource-policy: keep` annotation). Set `false` to delete all of them with the release: `helm uninstall` then removes the executor and the CRDs together, so delete the requests first (steps 1 to 3 of upgrade and uninstall).
  # @section -- CRDs
  keep: true
rbac:
  helpers:
    # -- Install admin, editor and viewer ClusterRoles for each custom resource. Shadewright does not use them, they are for your people. Off by default (least privilege).
    # @section -- RBAC
    enabled: false

## The executor reconciles RemediationRequests and is the only component that talks to Git. Its identity may
## only sign with the GitHub App key in Key Vault.
executor:
  # -- Number of Pods. 1 (the default) runs the one Pod. Above 1 the extra Pods are warm standbys: leader election keeps one of them active and the others idle, and when the leader's Pod fails a standby takes over after about one Lease duration (15 seconds by default). A standby costs an idle Pod and adds no throughput. Above 1 the chart also renders a PodDisruptionBudget (`minAvailable: 1`) and a preferred Pod anti-affinity by node, unless `affinity` sets `podAntiAffinity` itself.
  # @section -- Executor
  replicas: 1
  image:
    # -- Repository of the executor image (a mirror, for example). The Deployment runs repository@digest, or repository:appVersion without a digest when `image.allowTag` is true.
    # @section -- Images
    repository: ghcr.io/pkalin/shadewright-executor
    # -- Digest of the executor image: `sha256:` and 64 lower case hex digits. The chart published on a release tag carries the digest of that release's signed image here. Empty (a source checkout) fails to render unless `image.allowTag` is true, which runs the `appVersion` tag instead. The schema refuses a tag in this field.
    # @default -- the release's digest in the published chart, empty in the source
    # @section -- Images
    digest: ""
    # -- Image pull policy. One of `Always`, `IfNotPresent` or `Never`.
    # @section -- Images
    pullPolicy: IfNotPresent
  identity:
    azure:
      # -- Client ID (a UUID, not a secret) of the executor's Azure managed identity for workload identity. Sets the ServiceAccount annotation `azure.workload.identity/client-id` and the Pod label `azure.workload.identity/use`. Empty sets neither: the executor then cannot sign for the GitHub App, so a request that reaches the Git step is retried quietly and stays Pending. Must differ from the analyzer's, or the chart refuses to render (separate identities, never one for both).
      # @default -- empty (no identity)
      # @section -- Identity
      clientId: ""
  serviceAccount:
    # -- Further ServiceAccount annotations, for another cloud's workload identity. Keys under `azure.workload.identity/` are refused: use `executor.identity.azure.clientId`.
    # @section -- Executor
    annotations: {}
  # -- Go memory limit (`GOMEMLIMIT`) of the container, such as `100MiB`. Empty (the default) sets 90 percent of `resources.limits.memory`, so it follows that limit: the Go runtime then collects before the heap reaches the container's limit, and a large but bounded parse is not OOM-killed. Set it for a limit the chart cannot read (not an integer or a whole number with a `Ki`, `Mi`, `Gi`, `Ti`, `k`, `K`, `M`, `G` or `T` suffix, such as `1.5Gi`: the chart then refuses to render) or for another margin.
  # @default -- 90 percent of `resources.limits.memory`
  # @section -- Executor
  goMemLimit: ""
  resources:
    limits:
      # -- CPU limit (optional; removing it with `null` lets the container use idle CPU).
      # @section -- Executor
      cpu: 500m
      # -- Memory limit. Required by the schema (a `null` override is refused), so the container's memory is never
      # unbounded.
      # @section -- Executor
      memory: 128Mi
    requests:
      # -- CPU request.
      # @section -- Executor
      cpu: 10m
      # -- Memory request.
      # @section -- Executor
      memory: 64Mi
  # -- Further command line flags, each `--name` or `--name=value`. The chart refuses the flags it sets itself, so a free list cannot turn off leader election, metrics authentication or the watched namespaces: `--leader-elect`, `--health-probe-bind-address`, `--metrics-bind-address`, `--metrics-secure`, `--metrics-cert-path`, `--metrics-cert-name`, `--metrics-cert-key`, `--namespace`, `--watch-namespaces`, `--cluster-id` and `--max-incidents`.
  # @section -- Executor
  extraArgs: []
  metricsTLS:
    # -- Name of an existing Secret of type `kubernetes.io/tls` (keys `tls.crt` and `tls.key`) in the release namespace that holds the serving certificate of the metrics endpoint. Empty (the default) keeps the certificate the binary generates for itself. Set, the chart mounts the Secret read-only and passes `--metrics-cert-path`; the key must be in the Secret, never in `values`. Needs `metrics.enabled` and `metrics.secure`. Issuance and renewal stay with you.
    # @section -- Executor
    secretName: ""
  # -- Further Pod labels. The chart refuses `control-plane`, `app.kubernetes.io/*`, `helm.sh/*` and `azure.workload.identity/*`: it sets them itself (the identity labels come from `identity.azure.clientId`).
  # @section -- Executor
  podLabels: {}
  # -- Further Pod annotations.
  # @section -- Executor
  podAnnotations: {}
  # -- Node selector of the Pod, at most 32 labels.
  # @section -- Executor
  nodeSelector: {}
  # -- Tolerations of the Pod, at most 32 Kubernetes toleration objects.
  # @section -- Executor
  tolerations: []
  # -- Affinity of the Pod, a Kubernetes affinity object (`nodeAffinity`, `podAffinity`, `podAntiAffinity`).
  # @section -- Executor
  affinity: {}
  # -- Topology spread constraints of the Pod, at most 8 Kubernetes `topologySpreadConstraints` objects.
  # @section -- Executor
  topologySpreadConstraints: []
  # -- Priority class of the Pod. Empty uses the cluster default.
  # @section -- Executor
  priorityClassName: ""
  # -- Image pull secrets of this component only, added to the global `imagePullSecrets`, a list of `{name: <secret>}` (at most 16).
  # @section -- Executor
  imagePullSecrets: []

## The analyzer reads the cluster and writes Incidents and proposed RemediationRequests. It never acts on them.
analyzer:
  # -- Number of Pods. 1 (the default) runs the one Pod. Above 1 the extra Pods are warm standbys: leader election keeps one of them active and the others idle, and when the leader's Pod fails a standby takes over after about one Lease duration (15 seconds by default). A standby costs an idle Pod and adds no throughput. Above 1 the chart also renders a PodDisruptionBudget (`minAvailable: 1`) and a preferred Pod anti-affinity by node, unless `affinity` sets `podAntiAffinity` itself.
  # @section -- Analyzer
  replicas: 1
  image:
    # -- Repository of the analyzer image (a mirror, for example). The Deployment runs repository@digest, or repository:appVersion without a digest when `image.allowTag` is true.
    # @section -- Images
    repository: ghcr.io/pkalin/shadewright-analyzer
    # -- Digest of the analyzer image: `sha256:` and 64 lower case hex digits. The chart published on a release tag carries the digest of that release's signed image here. Empty (a source checkout) fails to render unless `image.allowTag` is true, which runs the `appVersion` tag instead. The schema refuses a tag in this field.
    # @default -- the release's digest in the published chart, empty in the source
    # @section -- Images
    digest: ""
    # -- Image pull policy. One of `Always`, `IfNotPresent` or `Never`.
    # @section -- Images
    pullPolicy: IfNotPresent
  # -- Unique namespace names, at most 256. The analyzer reads events, Pods and workloads only in these namespaces: the chart passes them as `--watch-namespaces` and binds the read-only watch ClusterRole with one RoleBinding in each (`kube-system` included only if you list it). Empty (the default) watches no namespace, never all of them: the analyzer starts, is Ready and records no Incident, and no RoleBinding is created. `*` is refused.
  # @default -- empty (no namespace)
  # @section -- Analyzer
  watchNamespaces: []
  # -- Most Incidents kept in the operator namespace (`--max-incidents`), 1 or more. Null (unset) keeps the binary's default of 500.
  # @default -- null (the binary's default, 500)
  # @section -- Analyzer
  maxIncidents: null
  podLogs:
    # -- Give the analyzer the pod logs source (`--pod-logs`) and its grant: `get` on `pods/log` in the watch ClusterRole, bound only in the watched namespaces. `false` passes `--pod-logs=false` and renders no `pods/log` rule. With more than 256 watched namespaces the analyzer refuses to start unless this is `false`.
    # @section -- Analyzer
    enabled: true
  # The analyzer's reads of an add-on's own kinds, for the symptom sources of its integration module. Each value renders one ClusterRole with only `list` and `watch` on that add-on's kinds (plus `get` on KEDA `scaledobjects`), bound by one RoleBinding per watched namespace (never cluster-wide, except `kyverno.clusterWide`). These values grant reads only: whether a module runs is still decided by `spec.modules.integrations` of the RemediationSettings and by detection. The chart passes the grants it rendered to the analyzer (`--module-grants`). A module enabled there without its grant here runs no source on those kinds; the analyzer reports them in the settings condition `SymptomSourcesNotWatched`, logs it and sets `shadewright_analyzer_symptom_source_watched` to 0. The one exception is `kyverno.clusterWide` off with the Kyverno module enabled, the least-privilege setup: the cluster-scoped Kyverno kinds are left out without a report and have no series. The cloudflared module reads Pods, which the watch ClusterRole always grants, so it has no value.
  modules:
    flux:
      # -- Grant the analyzer `list` and `watch` on Flux `kustomizations`, `helmreleases` and `gitrepositories` in the watched namespaces (ClusterRole `analyzer-watch-flux`), for the Flux module's symptom sources. Off by default (least privilege): no module used these reads before, so leaving it off stops nothing that worked. Turn it on with the `flux` integration in `spec.modules`.
      # @section -- Analyzer
      enabled: false
    keda:
      # -- Grant the analyzer `get`, `list` and `watch` on KEDA `scaledobjects`, and `list` and `watch` on `scaledjobs`, in the watched namespaces (ClusterRole `analyzer-watch-keda`), for the KEDA module's symptom sources. On by default: the KEDA HPA source already used `get` on `scaledobjects` to verify the owner of an HPA, so defaulting it off would quietly change Incidents of an enabled module (about the HPA instead of the ScaledObject). `false` renders no KEDA rule: use it when KEDA is not installed.
      # @section -- Analyzer
      enabled: true
    kyverno:
      # -- Grant the analyzer `list` and `watch` on Kyverno `policies` and `wgpolicyk8s.io` `policyreports` in the watched namespaces (ClusterRole `analyzer-watch-kyverno`), for the Kyverno module's namespaced symptom sources. Off by default (least privilege), as for `flux`.
      # @section -- Analyzer
      enabled: false
      clusterWide:
        # -- Grant the analyzer `list` and `watch` on Kyverno `clusterpolicies` and `wgpolicyk8s.io` `clusterpolicyreports` cluster-wide (ClusterRole and ClusterRoleBinding `analyzer-kyverno-cluster`), for the Kyverno module's cluster-scoped symptom sources. Off by default: it is the one read of an add-on's kinds outside the watched namespaces, and a ClusterPolicyReport names resources of every namespace. Independent of `kyverno.enabled`: each grants its own kinds. Off, the analyzer leaves those kinds out on purpose: no report in `SymptomSourcesNotWatched` and no `shadewright_analyzer_symptom_source_watched` series, so an alert on `0` stays quiet.
        # @section -- Analyzer
        enabled: false
  prometheus:
    # -- Base URL of the Prometheus query API the analyzer reads metrics from (`--prometheus-url`), `http` or `https`, with no user info, query or fragment, such as `http://prometheus-server.prometheus.svc`. Empty (the default) passes no flag: no metrics. Open the NetworkPolicy egress to Prometheus too (`networkPolicy.analyzer.prometheus`).
    # @section -- Analyzer
    url: ""
    # -- The `cluster` label value of this cluster's series (`--prometheus-cluster`), for a Prometheus shared by several clusters. Empty passes no flag. Used only with `analyzer.prometheus.url`.
    # @section -- Analyzer
    cluster: ""
  tracing:
    # -- OTLP gRPC endpoint of an OpenTelemetry collector for the analysis traces (one trace per analysis: phases, model calls with tokens, tool calls; IDs, counts and fixed labels only, never prompt, log or model text), such as `http://otel-collector.observability.svc:4317` (`http` sends plaintext gRPC, `https` TLS), with an explicit port. Sets `OTEL_TRACES_EXPORTER=otlp` and `OTEL_EXPORTER_OTLP_TRACES_ENDPOINT`. Empty (the default): no traces and no exporter. With the NetworkPolicies on, the chart refuses to render it unless `networkPolicy.analyzer.traceCollector.enabled` opens the egress to the collector.
    # @section -- Analyzer
    endpoint: ""
  analysis:
    # -- Model ID and version the triage deployment of `RemediationSettings` serves, as its replies name it, such as `gpt-5.4-mini-2026-03-17` (`--triage-model`). A reply naming another model is refused (ADR-0023). Empty (the default) passes no analysis flag: the analysis is off, no model is called and no Azure token is requested. Set, it needs `analyzer.identity.azure.clientId` and `analyzer.analysis.endpointSuffixes` (the chart refuses to render without them). Until the evaluation gate (#78) exists, turn it on only for an evaluation run in the lab.
    # @section -- Analyzer
    triageModel: ""
    # -- Model ID and version the escalation deployment serves (`--escalation-model`). Empty: escalation is off whatever `RemediationSettings` names, and an escalation signal hands the incident off. Used only with `triageModel`.
    # @section -- Analyzer
    escalationModel: ""
    # -- Host suffixes a model endpoint in `RemediationSettings` must end with or, without the leading dot, equal (`--model-endpoint-suffixes`), each a dot and two or more lower-case DNS labels, at most 16. Required with `triageModel`: there is no default, so no Azure AI host is allowed unless listed. Any resource under an allowed suffix receives the context and a token, so list your own resource, such as `.<resource>.services.ai.azure.com`, which allows that host only.
    # @section -- Analyzer
    endpointSuffixes: []
    # -- The RemediationPolicy a proposed RemediationRequest of each action type refers to (`--action-policies`), a map from `AdjustKedaMaxReplicas` or `SetContainerMemoryLimit` to a policy name, such as `{SetContainerMemoryLimit: memory-limits}`. An action type without one is never proposed. Used only with `triageModel`. With at least one name, the chart grants the analyzer `get` on exactly these RemediationPolicies (ClusterRole and ClusterRoleBinding `analyzer-policy-reader`, `resourceNames` set to the names, no `list` or `watch`), so the context shows the model the bounds of the policy that will decide its proposal; the policy still decides. Without a name there is no such rule.
    # @section -- Analyzer
    actionPolicies: {}
    recordStore:
      azureBlob:
        # -- Storage account name (3 to 24 lower-case letters and digits) of the Blob Storage container that keeps one redacted record of each analysis (`--analysis-store-account`, ADR-0015). Records are written create-only (`If-None-Match: *`) to `https://<account>.blob.core.windows.net` with the analyzer's workload identity (a token for the Storage audience, no key or SAS); the identity needs a role that may write blobs in that container, such as the analysis writer role of `shadewright-azure/foundation`. Empty (the default) writes no record. Used only with `triageModel` (the chart refuses to render it without one).
        # @section -- Analyzer
        account: ""
        # -- Container of the analysis records in `account` (`--analysis-store-container`), `analyses` in the reference lab. Rendered only with `account`.
        # @section -- Analyzer
        container: analyses
  identity:
    azure:
      # -- Client ID (a UUID, not a secret) of the analyzer's Azure managed identity, for the analyzer's Entra ID tokens: the model call (Cognitive Services audience) and, with `analyzer.analysis.recordStore.azureBlob.account`, the analysis records (Storage audience). Sets the ServiceAccount annotation `azure.workload.identity/client-id` and the Pod label `azure.workload.identity/use`. Needed when `analyzer.analysis.triageModel` is set; leave it empty otherwise. It must differ from the executor's or the chart refuses to render (separate identities, never one for both).
      # @default -- empty (no identity)
      # @section -- Identity
      clientId: ""
  serviceAccount:
    # -- Further ServiceAccount annotations, for another cloud's workload identity. Keys under `azure.workload.identity/` are refused: use `analyzer.identity.azure.clientId`.
    # @section -- Analyzer
    annotations: {}
  # -- Go memory limit (`GOMEMLIMIT`) of the container, such as `100MiB`. Empty (the default) sets 90 percent of `resources.limits.memory`, so it follows that limit: the Go runtime then collects before the heap reaches the container's limit, and a large but bounded parse is not OOM-killed. Set it for a limit the chart cannot read (not an integer or a whole number with a `Ki`, `Mi`, `Gi`, `Ti`, `k`, `K`, `M`, `G` or `T` suffix, such as `1.5Gi`: the chart then refuses to render) or for another margin.
  # @default -- 90 percent of `resources.limits.memory`
  # @section -- Analyzer
  goMemLimit: ""
  resources:
    limits:
      # -- CPU limit (optional; removing it with `null` lets the container use idle CPU).
      # @section -- Analyzer
      cpu: 500m
      # -- Memory limit. Required by the schema (a `null` override is refused), so the container's memory is never
      # unbounded.
      # @section -- Analyzer
      memory: 128Mi
    requests:
      # -- CPU request.
      # @section -- Analyzer
      cpu: 10m
      # -- Memory request.
      # @section -- Analyzer
      memory: 64Mi
  # -- Further command line flags, each `--name` or `--name=value`. The chart refuses the flags it sets itself, so a free list cannot turn off leader election, metrics authentication or the watched namespaces: `--leader-elect`, `--health-probe-bind-address`, `--metrics-bind-address`, `--metrics-secure`, `--metrics-cert-path`, `--metrics-cert-name`, `--metrics-cert-key`, `--namespace`, `--watch-namespaces`, `--cluster-id`, `--max-incidents`, the context source flags and the analysis flags.
  # @section -- Analyzer
  extraArgs: []
  metricsTLS:
    # -- Name of an existing Secret of type `kubernetes.io/tls` (keys `tls.crt` and `tls.key`) in the release namespace that holds the serving certificate of the metrics endpoint. Empty (the default) keeps the certificate the binary generates for itself. Set, the chart mounts the Secret read-only and passes `--metrics-cert-path`; the key must be in the Secret, never in `values`. Needs `metrics.enabled` and `metrics.secure`. Issuance and renewal stay with you.
    # @section -- Analyzer
    secretName: ""
  # -- Further Pod labels. The chart refuses `control-plane`, `app.kubernetes.io/*`, `helm.sh/*` and `azure.workload.identity/*`: it sets them itself (the identity labels come from `identity.azure.clientId`).
  # @section -- Analyzer
  podLabels: {}
  # -- Further Pod annotations.
  # @section -- Analyzer
  podAnnotations: {}
  # -- Node selector of the Pod, at most 32 labels.
  # @section -- Analyzer
  nodeSelector: {}
  # -- Tolerations of the Pod, at most 32 Kubernetes toleration objects.
  # @section -- Analyzer
  tolerations: []
  # -- Affinity of the Pod, a Kubernetes affinity object (`nodeAffinity`, `podAffinity`, `podAntiAffinity`).
  # @section -- Analyzer
  affinity: {}
  # -- Topology spread constraints of the Pod, at most 8 Kubernetes `topologySpreadConstraints` objects.
  # @section -- Analyzer
  topologySpreadConstraints: []
  # -- Priority class of the Pod. Empty uses the cluster default.
  # @section -- Analyzer
  priorityClassName: ""
  # -- Image pull secrets of this component only, added to the global `imagePullSecrets`, a list of `{name: <secret>}` (at most 16).
  # @section -- Analyzer
  imagePullSecrets: []

## The helm test hook (templates/tests): a Pod that checks that the metrics Service of each component answers.
tests:
  image:
    # -- Repository of the image of the `helm test` Pod. It needs `curl`. Rendered only with `metrics.enabled`.
    # @section -- Tests
    repository: docker.io/curlimages/curl
    # -- Digest of the test image (curl 8.23.0), required: `sha256:` and 64 lower case hex digits.
    # @section -- Tests
    digest: sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  # -- Image pull secrets of the test Pod only, added to the global `imagePullSecrets`, a list of `{name: <secret>}` (at most 16).
  # @section -- Tests
  imagePullSecrets: []

settings:
  # -- Create the RemediationSettings object `default` from `spec`, only when it does not exist (a post-install and post-upgrade hook that checks with `lookup`). Helm never changes or deletes it afterwards, so a pause set by hand (`spec.paused: true`) survives every upgrade; change the object with kubectl or GitOps. `lookup` finds nothing under `helm template` and `--dry-run`, so those always render it. Helm does not track hook objects: the object is not deleted when the release is uninstalled. Requires a non-empty `spec`.
  # @section -- Settings
  create: false
  # -- Spec of the RemediationSettings object. Required and non-empty when `create` is true (the schema enforces it). The fields are in the API reference, see the README for an example.
  # @section -- Settings
  spec: {}
