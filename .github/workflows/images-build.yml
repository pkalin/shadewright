name: Images build

# Builds the executor, analyzer and verifier images for linux/amd64 without pushing. Called by ci.yml on pull requests;
# publishing, signing and attestation are in images.yml.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the jobs run; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.image }} (no push)
    if: ${{ inputs.run != false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [executor, analyzer, verifier]
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only: arm64 is built under emulation and takes minutes; main and tags build both (images.yml).
      - name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64
          push: false
