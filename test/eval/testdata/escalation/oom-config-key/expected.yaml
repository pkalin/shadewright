# Synthetic, not from the fleet repository: the expectation of the escalation scenario oom-config-key (#504), in
# the fleet's scenario schema. No lab run has observed it.
apiVersion: scenarios.shadewright.io/v1alpha1
kind: Scenario
name: oom-config-key
summary: The web container is OOMKilled because its item cache grows without bound, since the ConfigMap web-config it mounts has no key cache.yaml; a higher memory limit would only delay the kill.
incident:
  reason: OOMKilled
  status: synthetic
  source: The collector's pod watch, from the container's last termination, attributed to Deployment demo/web through ReplicaSet.
  object:
    apiVersion: apps/v1
    kind: Deployment
    namespace: demo
    name: web
diagnosis:
  status: synthetic
  evidence:
    - fact: the web container is OOMKilled and restarts
      source: the pod's container status in the context
    - fact: the item cache grows until the container is killed
      source: the log excerpt of the previous instance in the context
    - fact: the ConfigMap web-config has no key cache.yaml, so the item cache has no size bound
      source: the current instance's startup lines, read with get_pod_logs
outcome:
  type: refusal
  status: synthetic
  reason: The cause is a missing configuration key, which no catalog action sets; a higher memory limit would only delay the kill. A person is notified.
  phase: NeedsIntervention
