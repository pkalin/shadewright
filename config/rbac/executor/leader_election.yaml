# Leader election for the executor only: it may create a Lease and renew only its own (fbfbf7ca.shadewright.io, the
# LeaderElectionID in the binary). RBAC cannot restrict create by name; another identity cannot renew a
# Lease it does not own, so it would expire and the right holder take over.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/component: executor
    app.kubernetes.io/managed-by: kustomize
  name: executor-leader-election-role
  namespace: system
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - fbfbf7ca.shadewright.io
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/component: executor
    app.kubernetes.io/managed-by: kustomize
  name: executor-leader-election-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: executor-leader-election-role
subjects:
- kind: ServiceAccount
  name: executor
  namespace: system
