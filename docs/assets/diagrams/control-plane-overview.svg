<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Control plane mode: hub and reporting clusters</title>
  <desc id="d">Overview of ADR-0038, proposed and not built. Each spoke keeps working when the hub is down. Two spoke clusters, each a standalone Shadewright install with its own analyzer, executor and verifier, plus a new reporter. Each spoke has its own GitOps repository, where its executor opens pull requests as today, and its own model credential and budget. Each reporter sends redacted summaries and a projected ServiceAccount token over HTTPS, to a path naming its cluster, to the intake service of the hub; the connection is outbound from the spoke and the answer is only accepted or refused. The hub is a Kubernetes cluster. Flux applies the Cluster objects from the hub GitOps repository, one per spoke and nothing else per spoke. The fleet controller writes Cluster status (issuer keys, readiness), reads the heartbeat records and deletes records of an earlier registration. Intake writes the records of every spoke into the one hub namespace, labelled with the cluster it verified, and enforces per-cluster limits in its code. The read-only status page runs in its own namespace, listens on 127.0.0.1 only, is reached by port-forward and reads the records. In the prototype, spoke A is the hub own cluster, so hub and spoke are not separate there. Evidence, prompts, transcripts, credentials and kubeconfigs never cross, and the hub never calls a spoke. Hub and spoke are clusters; the word fleet here is unrelated to the shadewright-fleet repository.</desc>
