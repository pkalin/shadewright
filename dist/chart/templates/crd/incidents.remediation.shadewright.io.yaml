{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
  name: incidents.remediation.shadewright.io
spec:
  group: remediation.shadewright.io
  names:
    categories:
    - shadewright
    kind: Incident
    listKind: IncidentList
    plural: incidents
    singular: incident
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.subject.kind
      name: Kind
      priority: 1
      type: string
    - jsonPath: .spec.subject.name
      name: Subject
      type: string
    - jsonPath: .spec.reason
      name: Reason
      type: string
    - description: 'Reason of the AnalysisDue condition: why the incident is or is
        not due for analysis'
      jsonPath: .status.conditions[?(@.type=="AnalysisDue")].reason
      name: Due
      type: string
    - description: 'Reason of the Analyzed condition: the outcome of the last analysis'
      jsonPath: .status.conditions[?(@.type=="Analyzed")].reason
      name: Outcome
      priority: 1
      type: string
    - jsonPath: .status.count
      name: Count
      priority: 1
      type: integer
    - jsonPath: .status.lastAnalysisTime
      name: Last analysis
      type: date
    - jsonPath: .status.lastSeen
      name: Last seen
      priority: 1
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Incident groups repeated symptoms of one problem on one workload. The rules on the root keep a write from
          removing the whole status, which the rules on the status object cannot see, once status.revertsProposed has
          entries, and refuse a new entry of that list in any state but Pending, also in the first status write.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec identifies the incident.
            properties:
              fingerprint:
                description: |-
                  fingerprint is the hash of cluster, namespace, owner, reason, action, type, reporting controller and
                  normalized symptom.
                maxLength: 71
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              occurrenceNumber:
                description: |-
                  occurrenceNumber is which Incident of the fingerprint this is: absent for the first, n >= 2 for the
                  Incident the analyzer opened when the symptom was seen again more than 24 hours after the previous one was
                  resolved (design 3.2). The name carries it as the suffix "-<n>".
                format: int32
                maximum: 999999
                minimum: 2
                type: integer
              previousIncident:
                description: |-
                  previousIncident is the name of the Incident of the same fingerprint before this one, occurrence n-1,
                  set together with occurrenceNumber. It is a link for people only: the analysis never reads it, so no
                  earlier outcome or policy decision reaches the model (invariant 1).
                maxLength: 80
                pattern: ^incident-[0-9a-f]{64}(-([2-9]|[1-9][0-9]{1,5}))?$
                type: string
              reason:
                description: reason is the event reason or status reason, for example
                  FailedScheduling or OOMKilled.
                maxLength: 128
                minLength: 1
                type: string
              reportingController:
                description: reportingController is the component that reported the
                  symptom.
                maxLength: 253
                type: string
              subject:
                description: 'subject is the object the symptoms are correlated to:
                  the owning workload when there is one.'
                properties:
                  apiVersion:
                    description: apiVersion of the object, for example apps/v1 or
                      keda.sh/v1alpha1.
                    maxLength: 253
                    minLength: 1
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?v[0-9]+((alpha|beta)[0-9]+)?$
                    type: string
                  kind:
                    description: kind of the object.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Z][A-Za-z0-9]*$
                    type: string
                  name:
                    description: name of the object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: namespace of the object; empty for cluster-scoped
                      objects.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid of the object.
                    maxLength: 36
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              symptom:
                description: 'symptom is the normalized, redacted description: variable
                  parts removed, secrets never included.'
                maxLength: 1024
                type: string
              type:
                default: Warning
                description: type is the event type.
                enum:
                - Normal
                - Warning
                type: string
            required:
            - fingerprint
            - reason
            - subject
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; a different symptom is a new Incident
              rule: self == oldSelf
            - message: occurrenceNumber and previousIncident are set together
              rule: has(self.occurrenceNumber) == has(self.previousIncident)
            - message: previousIncident must be the occurrence before this one of
                the same fingerprint
              rule: '!has(self.occurrenceNumber) || (self.occurrenceNumber == 2 ?
                self.previousIncident == ''incident-'' + self.fingerprint.substring(7)
                : (self.previousIncident.startsWith(''incident-'' + self.fingerprint.substring(7)
                + ''-'') && self.previousIncident.size() > 74 && int(self.previousIncident.substring(74))
                == self.occurrenceNumber - 1))'
          status:
            description: status is the deduplication state.
            properties:
              analysisRecords:
                description: analysisRecords are the newest analysis record IDs, oldest
                  first (at most MaxAnalysisRecords).
                items:
                  description: |-
                    RecordID identifies an analysis record in the analysis store: lower-case letters, digits and hyphens, as
                    a blob name of one path segment with nothing to escape.
                  maxLength: 200
                  minLength: 1
                  pattern: ^[a-z0-9][a-z0-9-]{0,199}$
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: conditions explain the phase.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              count:
                description: |-
                  count is the number of occurrences counted, counting event series increments, not totals. It
                  saturates at 1,000,000: a series count is written by whoever can create events, so forged updates can
                  raise it without bound otherwise. It is not a count of distinct occurrences.
                format: int64
                maximum: 1000000
                minimum: 0
                type: integer
              firstSeen:
                description: firstSeen is when the first observation arrived.
                format: date-time
                type: string
              handledHint:
                description: |-
                  handledHint is the reviewer hint the analysis claimed by lastAnalysisTime answers (ADR-0028 section 3):
                  written in the status update that takes the claim and kept with the outcome in the Analyzed condition, so
                  a restarted analyzer does not run the same hint twice and the executor can match a refusal to the hint.
                  Absent for an analysis without a hint. The trigger also writes it, with the Analyzed reason CoolingDown or
                  BudgetSpent, for a hint it refuses without an analysis.
                properties:
                  commentID:
                    description: commentID is the comment's ID in the source.
                    format: int64
                    minimum: 1
                    type: integer
                  digest:
                    description: digest is the SHA-256 of the stored, redacted hint
                      text.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  source:
                    description: source is the system the comment is in.
                    enum:
                    - GitHub
                    type: string
                required:
                - commentID
                - digest
                - source
                type: object
              lastAnalysisTime:
                description: lastAnalysisTime is when the analyzer last ran; it drives
                  the cooldown.
                format: date-time
                type: string
              lastSeen:
                description: lastSeen is when the latest observation arrived.
                format: date-time
                type: string
              occurrences:
                description: |-
                  occurrences are the newest occurrences counted for this incident, newest first, at most 32: for each,
                  the highest total the cluster reported that was counted, and when it began. After a restart the
                  analyzer reads them to count only what is new. Older ones are dropped.
                items:
                  description: OccurrenceRecord is what an Incident counted of one
                    occurrence (design 3.2). It holds no event text.
                  properties:
                    began:
                      description: |-
                        began is when the occurrence began: the event's creation time, the termination's finish time or the
                        condition's last transition time. Absent when the cluster did not report one.
                      format: date-time
                      type: string
                    id:
                      description: |-
                        id names the occurrence: "event:" and the Event UID, "termination:" and a hash of the pod UID, the
                        container and the termination, or "condition:" and a hash of the object UID, the kind, the symptom
                        reason and when the condition began, for a symptom read from an object's status by a module's symptom
                        source.
                      maxLength: 76
                      pattern: ^(event|termination|condition):[A-Za-z0-9-]{1,64}$
                      type: string
                    total:
                      description: |-
                        total is the highest total of the occurrence counted: the event's series count, or 1 for a
                        termination or a condition.
                      format: int64
                      maximum: 2147483647
                      minimum: 0
                      type: integer
                  required:
                  - id
                  - total
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              occurrencesDroppedThrough:
                description: |-
                  occurrencesDroppedThrough is when the newest occurrence dropped from occurrences began. An occurrence
                  with no record that began no later than this is treated as counted in full, so the bound never counts
                  one twice.
                format: date-time
                type: string
              phase:
                description: phase summarizes the incident.
                enum:
                - Open
                - Analyzing
                - Proposed
                - Escalated
                - Resolved
                type: string
              remediationRequests:
                description: remediationRequests are the names of requests made for
                  this incident, oldest first.
                items:
                  description: Name is a DNS label used to reference other Shadewright
                    objects or entries.
                  maxLength: 63
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              resolvedTime:
                description: |-
                  resolvedTime is when the Incident moved to phase Resolved, written in the same status update (design
                  3.2). It cannot change while the phase stays Resolved. A symptom seen again within 24 hours of it, or with it missing, moves the Incident to Escalated
                  without an analysis; seen again later, it opens the next occurrence of the fingerprint as a new Incident.
                format: date-time
                type: string
              revertsProposed:
                description: |-
                  revertsProposed are the failed requests of this incident, by name and UID, that the analyzer's revert
                  proposer decided to revert (ADR-0030 section 8, #96), oldest first. The proposer writes an entry in state
                  Pending before it creates the revert and moves it to Created once the revert exists; it never takes a new
                  decision for a request listed here, so a failed request gets one revert for good, also after that revert
                  was deleted. When a check before a create says no (the target is gone, the request passed the age bound,
                  the request was deleted, the revert's name is taken by another request, the create is refused as invalid),
                  the entry moves to Abandoned instead, with a reason, which is final: no revert is made for it. A new entry
                  is always Pending, entries are never removed, a state moves only from Pending to Created or Abandoned, a
                  reason never changes, and the status cannot be removed while the list has entries; a full list stops new
                  reverts for this incident instead (condition RevertsStopped).
                items:
                  description: |-
                    ProposedRevert is an entry of an Incident's status.revertsProposed: a failed request, by name and UID, and
                    how far the proposer got with its revert.
                  properties:
                    name:
                      description: name of the request.
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    reason:
                      description: reason is why the entry is Abandoned. It is set
                        with that state, only with it, and never changes.
                      enum:
                      - TargetGone
                      - TargetKindUnsupported
                      - OutsideAgeBound
                      - IncidentDeleting
                      - RequestGone
                      - NameTaken
                      - CreateInvalid
                      type: string
                    state:
                      description: |-
                        state is Pending from the decision until the revert exists, then Created, or Abandoned when no revert
                        will be made. Created and Abandoned are final. A new entry is always Pending.
                      enum:
                      - Pending
                      - Created
                      - Abandoned
                      type: string
                    uid:
                      description: uid of the request, so a request recreated under
                        the same name is never taken for it.
                      maxLength: 36
                      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                      type: string
                  required:
                  - name
                  - state
                  - uid
                  type: object
                  x-kubernetes-validations:
                  - message: reason is set exactly when state is Abandoned
                    rule: has(self.reason) == (self.state == 'Abandoned')
                maxItems: 20
                type: array
                x-kubernetes-list-map-keys:
                - uid
                x-kubernetes-list-type: map
            type: object
            x-kubernetes-validations:
            - message: resolvedTime cannot change while the phase stays Resolved
              rule: '!(has(oldSelf.phase) && oldSelf.phase == ''Resolved'' && has(oldSelf.resolvedTime)
                && has(self.phase) && self.phase == ''Resolved'') || (has(self.resolvedTime)
                && self.resolvedTime == oldSelf.resolvedTime)'
            - message: 'revertsProposed only grows: an entry is never removed, its
                state only moves from Pending to Created or Abandoned, and its reason
                never changes'
              rule: '!has(oldSelf.revertsProposed) || (has(self.revertsProposed) &&
                oldSelf.revertsProposed.all(o, self.revertsProposed.exists(n, n.uid
                == o.uid && n.name == o.name && (o.state == ''Pending'' || (n.state
                == o.state && (!has(o.reason) || (has(n.reason) && n.reason == o.reason)))))))'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: status cannot be removed while status.revertsProposed has entries
          rule: '!has(oldSelf.status) || !has(oldSelf.status.revertsProposed) || size(oldSelf.status.revertsProposed)
            == 0 || has(self.status)'
        - message: a new entry of status.revertsProposed must be Pending
          rule: '!has(self.status) || !has(self.status.revertsProposed) || self.status.revertsProposed.all(n,
            n.state == ''Pending'' || (has(oldSelf.status) && has(oldSelf.status.revertsProposed)
            && oldSelf.status.revertsProposed.exists(o, o.uid == n.uid)))'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
