{{- /*
One Prometheus Operator ServiceMonitor per component, off by default (metrics.serviceMonitor.enabled). Prometheus
scrapes with its own ServiceAccount token: the endpoint checks it with a TokenReview and a SubjectAccessReview,
so that ServiceAccount needs the metrics-reader ClusterRole (nothing in the chart binds it). By default the serving
certificate is self-signed by the binary, so its verification is skipped; the token is still checked. With
metrics.serviceMonitor.tls.enabled the endpoints serve a certificate the administrator issued (see
executor.metricsTLS, analyzer.metricsTLS and verifier.metricsTLS) and the ServiceMonitor verifies it against a CA and a serverName.
*/ -}}
{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.enabled }}
{{- fail "metrics.serviceMonitor.enabled needs metrics.enabled: there is no metrics Service to scrape" }}
{{- end }}
{{- $tls := $.Values.metrics.serviceMonitor.tls }}
{{- $caSecret := $tls.ca.secret | default dict }}
{{- $caConfigMap := $tls.ca.configMap | default dict }}
{{- if $tls.enabled }}
{{- if not (or $caSecret.name $caConfigMap.name) }}
{{- fail "metrics.serviceMonitor.tls.enabled needs a CA: set metrics.serviceMonitor.tls.ca.secret.name or ca.configMap.name" }}
{{- end }}
{{- if and $caSecret.name $caConfigMap.name }}
{{- fail "metrics.serviceMonitor.tls.ca: set the Secret or the ConfigMap, not both" }}
{{- end }}
{{- if not $tls.serverName }}
{{- fail "metrics.serviceMonitor.tls.enabled needs metrics.serviceMonitor.tls.serverName" }}
{{- end }}
{{- if not (and $.Values.executor.metricsTLS.secretName $.Values.analyzer.metricsTLS.secretName $.Values.verifier.metricsTLS.secretName) }}
{{- fail "metrics.serviceMonitor.tls.enabled needs executor.metricsTLS.secretName, analyzer.metricsTLS.secretName and verifier.metricsTLS.secretName: a component without its certificate serves a self-signed one the CA does not verify" }}
{{- end }}
{{- end }}
{{- range $component := list "executor" "analyzer" "verifier" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" (printf "%s-metrics" $component) "context" $) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- with omit ($.Values.metrics.serviceMonitor.labels | default dict) "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/version" "app.kubernetes.io/part-of" "app.kubernetes.io/managed-by" "app.kubernetes.io/component" "helm.sh/chart" "control-plane" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- include "shadewright.labels" (dict "component" $component "context" $) | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
    - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "shadewright.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      control-plane: {{ $component }}
  endpoints:
  - path: /metrics
    {{- if $.Values.metrics.secure }}
    port: https
    scheme: https
    {{- /* Prometheus's own ServiceAccount token: the only way to scrape with it. Prometheus Operator deprecates
    bearerTokenFile and rejects it when arbitraryFSAccessThroughSMs is denied; then leave this off and write
    your own ServiceMonitor with authorization (credentials from a Secret holding a token for metrics-reader). */}}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      {{- if $tls.enabled }}
      serverName: {{ $tls.serverName | quote }}
      ca:
        {{- if $caSecret.name }}
        secret:
          name: {{ $caSecret.name | quote }}
          key: {{ $caSecret.key | quote }}
        {{- else }}
        configMap:
          name: {{ $caConfigMap.name | quote }}
          key: {{ $caConfigMap.key | quote }}
        {{- end }}
      {{- else }}
      insecureSkipVerify: true
      {{- end }}
    {{- else }}
    port: http
    scheme: http
    {{- end }}
    {{- with $.Values.metrics.serviceMonitor.interval }}
    interval: {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
