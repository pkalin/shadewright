<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Control plane mode: hub and reporting clusters</title>
  <desc id="d">Overview of ADR-0038 (each spoke keeps working when the hub is down; the hub reads Cluster objects added by a reviewed pull request; the status page escapes everything it shows and a notifier comes later, #97), proposed and not built. Two spoke clusters, each a standalone Shadewright install with its own analyzer, executor and verifier, plus a new reporter. Each spoke has its own GitOps repository, where its executor opens pull requests as today, and its own model credential and budget. Each reporter sends redacted summaries and a projected ServiceAccount token over HTTPS, to a path naming its cluster, to the intake service of the hub; the connection is outbound from the spoke and the answer is only accepted or refused. The hub is a Kubernetes cluster with intake, a fleet controller, one namespace per spoke holding the reported records, and a read-only status page. In the prototype, spoke A is the hub's own cluster, so hub and spoke are not separate there. Revoking a spoke is a pull request that removes its Cluster object; its namespace is kept for a retention and then removed by a second pull request. The hub reads its Cluster objects and the spoke namespaces, quotas and RoleBindings from its own GitOps repository through Flux; the fleet controller writes only Cluster status. Evidence, prompts, transcripts, credentials and kubeconfigs never cross, and the hub never calls a spoke. What crosses: heartbeat and versions, the doctor delivery source report, and bounded, redacted summaries of Incidents, requests and outcomes, with names optionally hashed, always outbound over HTTPS. What comes back: in phase 1 only accepted or refused with a status; later only restrictive directives (pause, slow down), never permissive ones, and configuration for a spoke travels as a pull request to its GitOps repo. Never crosses: evidence, prompts, transcripts, model credentials, kubeconfigs, Secrets; nothing a spoke sends reaches a model or a Git write in phase 1. Hub and spoke are clusters; the word fleet here is unrelated to the shadewright-fleet repository.</desc>
