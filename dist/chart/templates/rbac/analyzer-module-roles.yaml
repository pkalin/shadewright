{{- /*
The analyzer's reads of an add-on's own kinds, for the symptom sources of its integration module (#409): one
ClusterRole per module, rendered only while its value under analyzer.modules is true, so an add-on that is not
deployed gets no grant. Each is bound like the watch role: one RoleBinding per watched namespace, never
cluster-wide. Kyverno's cluster-scoped kinds are the one exception, a ClusterRoleBinding behind a value of its
own. The roles grant list and watch, for the informers; get only on scaledobjects (the owner a KEDA HPA names, and
the subject ScaledObject the context builder reads once before the model call, ADR-0036).
The analyzer gets the list of rendered grants (--module-grants, shadewright.analyzerModuleGrants): without a role
it does not watch those kinds and reports them as not watched, except the optional cluster-wide Kyverno kinds.
Keep each rule equal to config/rbac/analyzer/modules (test/chart checks it).
*/ -}}
{{- $roles := list }}
{{- $listWatch := list "list" "watch" }}
{{- if .Values.analyzer.modules.keda.enabled }}
{{- $roles = append $roles (dict "suffix" "analyzer-watch-keda" "rules" (list
  (dict "group" "keda.sh" "resources" (list "scaledjobs") "verbs" $listWatch)
  (dict "group" "keda.sh" "resources" (list "scaledobjects") "verbs" (list "get" "list" "watch")))) }}
{{- end }}
{{- if .Values.analyzer.modules.flux.enabled }}
{{- $roles = append $roles (dict "suffix" "analyzer-watch-flux" "rules" (list
  (dict "group" "helm.toolkit.fluxcd.io" "resources" (list "helmreleases") "verbs" $listWatch)
  (dict "group" "kustomize.toolkit.fluxcd.io" "resources" (list "kustomizations") "verbs" $listWatch)
  (dict "group" "source.toolkit.fluxcd.io" "resources" (list "gitrepositories") "verbs" $listWatch))) }}
{{- end }}
{{- if .Values.analyzer.modules.kyverno.enabled }}
{{- $roles = append $roles (dict "suffix" "analyzer-watch-kyverno" "rules" (list
  (dict "group" "kyverno.io" "resources" (list "policies") "verbs" $listWatch)
  (dict "group" "wgpolicyk8s.io" "resources" (list "policyreports") "verbs" $listWatch))) }}
{{- end }}
{{- range $role := $roles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" $role.suffix "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
rules:
{{- range $rule := $role.rules }}
- apiGroups:
  - {{ $rule.group }}
  resources:
  {{- range $r := $rule.resources }}
  - {{ $r }}
  {{- end }}
  verbs:
  {{- range $v := $rule.verbs }}
  - {{ $v }}
  {{- end }}
{{- end }}
{{- range $ns := ($.Values.analyzer.watchNamespaces | default list) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" $role.suffix "context" $) }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shadewright.resourceName" (dict "suffix" $role.suffix "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer" "context" $) }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- if .Values.analyzer.modules.kyverno.clusterWide.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer-kyverno-cluster" "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
rules:
- apiGroups:
  - kyverno.io
  resources:
  - clusterpolicies
  verbs:
  - list
  - watch
- apiGroups:
  - wgpolicyk8s.io
  resources:
  - clusterpolicyreports
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer-kyverno-cluster" "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer-kyverno-cluster" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer" "context" $) }}
  namespace: {{ .Release.Namespace }}
{{- end }}
