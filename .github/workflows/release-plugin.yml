name: Release plugin

# Builds the kubectl-shadewright binaries (linux and darwin, amd64 and arm64; static, -trimpath, version stamped
# from the tag, by `make build-plugin` via hack/package-plugin.sh) on every v* tag and uploads them to the GitHub
# release of the tag: kubectl-shadewright_<version>_<os>_<arch>.tar.gz and checksums.txt, plus
# checksums.txt.sigstore.json, a cosign keyless signature bundle over checksums.txt (GitHub OIDC, no key to
# store). Each archive also gets a GitHub build provenance attestation. The jobs split the permissions: build
# has none beyond contents: read, sign has id-token and attestations: write and sees only the built files,
# upload has contents: write and runs no build or signing step. Each job verifies what the one before made
# (the signature against the identity of this workflow, the provenance with gh attestation verify), so a
# mismatch fails the run before anything is uploaded. A tag must point at a commit on main
# (hack/require-on-main.sh, in the first job). Tags are cut by release-please or, for a pre-release, by hand
# (push the tag, then `gh release create --verify-tag --draft --prerelease`). The upload job waits up to five
# minutes for the draft and re-uploads with --clobber on a rerun. Published releases are immutable.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build the archives
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A release tag must point at a commit on main: the signature identity only says "this workflow on a v*
      # tag", so the history of main is fetched for the check below.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag to be on main
        run: hack/require-on-main.sh HEAD origin/main

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release build must not read a cache that another run could have written

      - name: Build and pack the archives
        env:
          TAG: ${{ github.ref_name }}
        run: hack/package-plugin.sh "${TAG}" "${RUNNER_TEMP}/dist"

      - name: Keep the archives for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and attest
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing and the provenance attestation, this job only
      attestations: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-dist
          path: ${{ runner.temp }}/dist

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # checksums.txt lists every archive, so one signature covers all four.
      - name: Sign checksums.txt (keyless)
        env:
          DIST: ${{ runner.temp }}/dist
        run: cosign sign-blob --yes --bundle "${DIST}/checksums.txt.sigstore.json" "${DIST}/checksums.txt"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/kubectl-shadewright_*.tar.gz

      # The identity is this workflow file on a release tag (also a pre-release tag, v[0-9].*) of this repository,
      # issued by GitHub's OIDC provider. Anything else (another workflow, another repository, a branch) fails the run.
      - name: Verify the signature, the checksums and the provenance
        env:
          DIST: ${{ runner.temp }}/dist
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/release-plugin\.yml@refs/tags/v[0-9].*$"
          cosign verify-blob \
            --bundle "${DIST}/checksums.txt.sigstore.json" \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${DIST}/checksums.txt"
          (cd "${DIST}" && sha256sum --check --strict checksums.txt)
          for archive in "${DIST}"/kubectl-shadewright_*.tar.gz; do
            gh attestation verify "${archive}" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${REPOSITORY}/.github/workflows/release-plugin.yml"
          done

      - name: Keep the signature bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-signature
          path: ${{ runner.temp }}/dist/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 7

  # The only job with contents: write. It runs no build and no signing: it uploads the files the jobs above made.
  upload:
    name: Upload to the release
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the release assets of this tag, this job only
    steps:
      - name: Download the archives and the signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          draft=false
          for _ in $(seq 1 20); do
            if state="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"; then
              if [ "${state}" != true ]; then
                echo "release ${TAG} is already published and immutable; refusing asset upload" >&2
                exit 1
              fi
              draft=true
              break
            fi
            sleep 15
          done
          if [ "${draft}" != true ]; then
            echo "no draft release for ${TAG} after 5 minutes; create the draft, then re-run this job" >&2
            exit 1
          fi
          uploaded=false
          for _ in $(seq 1 20); do
            if gh release upload "${TAG}" --clobber \
              "${DIST}"/kubectl-shadewright_*.tar.gz "${DIST}/checksums.txt" "${DIST}/checksums.txt.sigstore.json" 2> "${RUNNER_TEMP}/upload.err"; then
              uploaded=true
              break
            fi
            echo "could not upload to the release ${TAG} yet ($(tail -n 1 "${RUNNER_TEMP}/upload.err")), retrying in 15 s"
            sleep 15
          done
          if [ "${uploaded}" != true ]; then
            echo "no upload to the release ${TAG} after 5 minutes (last error: $(cat "${RUNNER_TEMP}/upload.err")); check the draft and re-run this job" >&2
            exit 1
          fi
          echo "release ${TAG}: kubectl-shadewright archives, checksums.txt and its signature uploaded" >> "${GITHUB_STEP_SUMMARY}"
