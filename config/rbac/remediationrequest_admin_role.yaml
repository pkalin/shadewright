# This rule is not used by the project shadewright itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants every verb, listed explicitly, over remediation.shadewright.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shadewright
    app.kubernetes.io/managed-by: kustomize
  name: remediationrequest-admin-role
rules:
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationrequests
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationrequests/status
  verbs:
  - get
