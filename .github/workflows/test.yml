name: Tests

# Called by ci.yml (the only trigger), which decides from the changed files whether it runs.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the job runs; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true

permissions: {}

jobs:
  test:
    if: ${{ inputs.run != false }}
    permissions:
      contents: read
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The envtest binaries (kube-apiserver, etcd) that setup-envtest downloads; the Kubernetes release comes
      # from k8s.io/api in go.mod, so go.mod is the key.
      - name: Cache envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('go.mod') }}

      # EVAL_REPORT_DIR makes the evaluation inside make test (test/eval, on the fake model) write its report,
      # so the run is not repeated for the summary.
      - name: Running Tests
        env:
          EVAL_REPORT_DIR: ${{ runner.temp }}/eval
        run: |
          go mod tidy
          make test

      # The evaluation on the fake model ran inside make test; its report goes into the job summary (format:
      # docs/evaluation.md), also when the tests failed. The real model is the manual Evaluation workflow.
      - name: Evaluation report (fake model)
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/eval/report.md" ]; then
            cat "${RUNNER_TEMP}/eval/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      # The slowest tests of each test line of make test, from the JSON logs it wrote (bin/gotestsum is the pinned
      # copy it installed). A log is missing when the run stopped before that line started.
      - name: Slowest tests
        if: always()
        run: |
          {
            echo "### Slowest tests (over 3s, top 30)"
            for name in unit-race redactwork wide-mapping; do
              [ -f "test-reports/${name}.json" ] || continue
              echo
              echo "#### ${name}"
              echo '```'
              bin/gotestsum tool slowest --jsonfile "test-reports/${name}.json" --threshold 3s --num 30
              echo '```'
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      # The junit files and JSON logs of every test line of make test, also when a test failed.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: test-reports/
          if-no-files-found: ignore
