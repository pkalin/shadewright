name: Images

# Builds the executor and analyzer images for linux/amd64 and linux/arm64 and pushes them to
# ghcr.io/pkalin/shadewright-{executor,analyzer} from main and v* tags; only the publish job has packages: write.
# The pull request build (amd64 only, no push, no write permission) is images-build.yml, called by ci.yml; it is
# a separate file because a called workflow may not contain a job that asks for more permissions than its caller
# grants, and this file's identity is what the signature is verified against. After the push, the same job signs each image index by digest with cosign keyless
# (GitHub OIDC, no key to store), attaches an SPDX SBOM per platform image (the child digests of the index) as a signed
# attestation, records a GitHub build provenance attestation on the index, and verifies all of them against the identity of this workflow, so a mismatch fails the
# run (#82). The id-token and attestations permissions exist only on the publish job, which never runs for a
# pull request (forks included). Tags are cut by the release workflow (release-please) or, for a pre-release, by hand
# (`gh release create vX.Y.Z-rc.1 --prerelease --target main`). A tag must point at a commit on main (checked
# before anything is pushed). On a tag docker/metadata-action adds no sha tag; a release gets X.Y.Z and X.Y, a
# pre-release only the full version (0.2.0-rc.1): no X.Y, no latest, so it never moves a floating tag.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [executor, analyzer]
    steps:
      # A release tag must point at a commit on main: the signature identity only says "this workflow on a v*
      # tag", so the history of main is fetched for the check below.
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}

      - name: Require the tag to be on main
        if: github.ref_type == 'tag'
        run: hack/require-on-main.sh HEAD origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Always by digest: a tag can move, the digest names the pushed index (both architectures).
      - name: Sign the image (keyless)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The index has one image per platform; the SBOM is made and attested per platform image (#341), because
      # the base image packages and build-tag dependencies can differ. The children come from the index
      # manifest, by digest.
      - name: Resolve the platform images
        id: platforms
        env:
          REF: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: hack/image-platform-digests.sh "${REF}" >> "$GITHUB_OUTPUT"

      # Syft scans the image it is given by its own digest, so each SBOM describes exactly that platform.
      - name: Generate the SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}@${{ steps.platforms.outputs.amd64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}@${{ steps.platforms.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOMs
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          SBOM_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate "${SBOM_DIR}/sbom-amd64.spdx.json" "${IMAGE}@${AMD64}"
          cosign attest --yes --type spdxjson --predicate "${SBOM_DIR}/sbom-arm64.spdx.json" "${IMAGE}@${ARM64}"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The identity is this workflow file on main or on a release tag of this repository, issued by GitHub's
      # OIDC provider. Anything else (another workflow, another repository, a branch) fails the run.
      - name: Verify signature, SBOMs and provenance
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/images\.yml@refs/(heads/main|tags/v[0-9].*)$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          for child in "${AMD64}" "${ARM64}"; do
            cosign verify-attestation --type spdxjson \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              "${IMAGE}@${child}" > /dev/null
          done
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${REPOSITORY}" \
            --signer-workflow "${REPOSITORY}/.github/workflows/images.yml"

      - name: Show the digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/shadewright-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
