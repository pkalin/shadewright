<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, sans-serif">
<title id="title">OpenAI-compatible model boundary</title>
<desc id="desc">After redaction the analyzer selects one provider. Foundry authenticates with Entra, Anthropic with its own key, and OpenAICompatible with a separate optional key bound to an allowed host. The two OpenAI wire formats share parsers. Every proposal passes typed validation and deterministic policy. Only the analyzer mounts key files; no Secret RBAC is added.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker></defs>
<rect width="1120" height="520" rx="18" fill="#0e0e16"/>
<g fill="#1d1b2b" stroke="#7c24fc" stroke-width="2"><rect x="36" y="185" width="260" height="125" rx="12"/><rect x="365" y="48" width="340" height="110" rx="12"/><rect x="365" y="205" width="340" height="110" rx="12"/><rect x="365" y="362" width="340" height="110" rx="12"/></g>
<g fill="#16222a" stroke="#2f5d63" stroke-width="2"><rect x="785" y="48" width="300" height="110" rx="12"/><rect x="785" y="205" width="300" height="110" rx="12"/><rect x="785" y="362" width="300" height="110" rx="12"/></g>
<g fill="none" stroke="#a879ff" stroke-width="2" marker-end="url(#arrow)"><path d="M296 220H330V103H365"/><path d="M296 248H365"/><path d="M296 278H330V417H365"/><path d="M705 103H785"/><path d="M705 260H785"/><path d="M705 417H785"/></g>
<g fill="#f1edff" font-size="19" font-weight="600"><text x="56" y="220">Analyzer</text><text x="385" y="80">Foundry</text><text x="385" y="238">OpenAICompatible</text><text x="385" y="395">Anthropic</text><text x="805" y="80">Azure model resource</text><text x="805" y="238">Allowed HTTPS endpoint</text><text x="805" y="395">api.anthropic.com</text></g>
<g fill="#a9a4c4" font-size="15"><text x="56" y="250">Bounded, redacted context</text><text x="56" y="277">Typed result, then policy</text><text x="385" y="108">Entra token only</text><text x="385" y="136">Shared OpenAI wire parsers</text><text x="385" y="266">Optional key, exact host binding</text><text x="385" y="294">Shared OpenAI wire parsers</text><text x="385" y="423">Separate key from mounted file</text><text x="385" y="451">Fixed host, separate protocol</text><text x="805" y="108">Install-time suffix allow-list</text><text x="805" y="136">No static key</text><text x="805" y="266">Public or named cluster Service</text><text x="805" y="294">No redirect, proxy or Entra token</text><text x="805" y="423">No redirect or Entra token</text><text x="805" y="451">No Secret API reads</text></g>
</svg>
