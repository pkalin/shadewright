name: E2E Tests

# Called by ci.yml (the only trigger), which decides from the changed files whether it runs.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the job runs; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true

permissions: {}

jobs:
  test-e2e:
    if: ${{ inputs.run != false }}
    permissions:
      contents: read
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
