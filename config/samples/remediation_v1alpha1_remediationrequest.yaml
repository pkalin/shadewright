# Normally written by the analyzer. The spec is immutable: a different plan is a new request.
# It says what to change, not where: the controller finds the repository, branch and file from the Flux
# objects that deliver the target and records them in status.source.
apiVersion: remediation.shadewright.io/v1alpha1
kind: RemediationRequest
metadata:
  name: orders-worker-capacity-001
  namespace: shadewright-system
spec:
  incidentRef:
    name: orders-worker-backlog
    uid: 11111111-1111-4111-8111-111111111111
  targetRef:
    apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    namespace: orders
    name: orders-worker
    uid: 22222222-2222-4222-8222-222222222222
  policyRef: keda-capacity
  action:
    type: AdjustKedaMaxReplicas
    adjustKedaMaxReplicas:
      previousValue: 10
      desiredValue: 15
  verification:
    checks: [DeliveryRevisionApplied, KedaReady, QueueBacklogDecreasing]
