<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="t">Shadewright ScaledObject context</title>
  <desc id="d">Overview of ADR-0036. When the Incident's subject is a KEDA ScaledObject, the context builder gets that one object once, before the model call, with the analyzer's existing get on scaledobjects; a refused or failed read leaves no snapshot and is a failed source. The snapshot feeds three things. Code decides readiness with kedaready.Readiness, the policy check's own rule, and takes the previous maxReplicaCount of a proposal from it. The model sees an allow-listed status block (name, replica bounds, scale target, trigger types, metric names, the conditions Ready, Active, Fallback and Paused), each string redacted and then left out whole when over 1 KiB; never the server address, authentication references, query text, annotations or labels. The metrics block runs the HPA owner check from the cache, then reads hpa_metric_current and hpa_metric_target, with no list and no scale target read. When the ScaledObject is not ready the catalog shown leaves out AdjustKedaMaxReplicas and one fixed sentence says so. After the reply, a not-ready analysis that ends without a proposal or proposes that action anyway ends ScalerNotReady; a ready one has its previous value replaced from the snapshot, with DirectionReversed, NoChange and PreviousValueUnknown checks. The executor's policy gate and baseline check are unchanged.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c24fc" stop-opacity=".35"/><stop offset="1" stop-color="#7c24fc" stop-opacity=".08"/></linearGradient>
    <style>
      .box{fill:#1d1b2b;stroke:#3a3556;stroke-width:1.2}
      .key{fill:url(#glow);stroke:#7c24fc;stroke-width:1.6}
      .ext{fill:#16222a;stroke:#2f5d63;stroke-width:1.2}
      .no{fill:#241a22;stroke:#6b3a4a;stroke-width:1.2}
      .h{fill:#f1edff;font-size:15px;font-weight:650}
      .s{fill:#a9a4c4;font-size:12.5px}
      .f{stroke:#a879ff;stroke-width:1.8;fill:none}
      .l{fill:#c6a8ff;font-size:12.5px;font-weight:600}
      .n{fill:#7d7999;font-size:12.5px}
    </style>
  </defs>

  <rect width="1190" height="440" rx="18" fill="#0e0e16"/>

  <rect class="ext" x="30" y="110" width="200" height="100" rx="12"/>
  <text class="h" x="130.0" y="146.0" text-anchor="middle">API server</text>
  <text class="s" x="130.0" y="167.0" text-anchor="middle">get ScaledObject</text>
  <text class="s" x="130.0" y="186.0" text-anchor="middle">one read, no new RBAC</text>
  <rect class="no" x="30" y="270" width="200" height="80" rx="12"/>
  <text class="h" x="130.0" y="305.5" text-anchor="middle">Read refused or failed</text>
  <text class="s" x="130.0" y="326.5" text-anchor="middle">no snapshot, a failed source</text>
  <rect class="key" x="290" y="110" width="200" height="100" rx="12"/>
  <text class="h" x="390.0" y="146.0" text-anchor="middle">Snapshot</text>
  <text class="s" x="390.0" y="167.0" text-anchor="middle">read once, before</text>
  <text class="s" x="390.0" y="186.0" text-anchor="middle">the model call</text>
  <rect class="box" x="550" y="50" width="230" height="90" rx="12"/>
  <text class="h" x="665.0" y="81.0" text-anchor="middle">Readiness</text>
  <text class="s" x="665.0" y="102.0" text-anchor="middle">code decides</text>
  <text class="s" x="665.0" y="121.0" text-anchor="middle">NotReady withholds action</text>
  <rect class="box" x="550" y="170" width="230" height="90" rx="12"/>
  <text class="h" x="665.0" y="201.0" text-anchor="middle">Baseline</text>
  <text class="s" x="665.0" y="222.0" text-anchor="middle">maxReplicaCount of the</text>
  <text class="s" x="665.0" y="241.0" text-anchor="middle">snapshot, not the model</text>
  <rect class="box" x="550" y="290" width="230" height="90" rx="12"/>
  <text class="h" x="665.0" y="321.0" text-anchor="middle">Status block</text>
  <text class="s" x="665.0" y="342.0" text-anchor="middle">what the model sees</text>
  <text class="s" x="665.0" y="361.0" text-anchor="middle">allow-listed, redacted</text>
  <rect class="box" x="850" y="110" width="200" height="110" rx="12"/>
  <text class="h" x="950.0" y="141.5" text-anchor="middle">After the reply</text>
  <text class="s" x="950.0" y="162.5" text-anchor="middle">ScalerNotReady,</text>
  <text class="s" x="950.0" y="181.5" text-anchor="middle">DirectionReversed,</text>
  <text class="s" x="950.0" y="200.5" text-anchor="middle">NoChange</text>
  <path class="f" d="M230 160H290" marker-end="url(#a)"/>
  <path class="f" d="M130 210V270" marker-end="url(#a)"/>
  <path class="f" d="M490 140H520V95H550" marker-end="url(#a)"/>
  <path class="f" d="M490 170H520V215H550" marker-end="url(#a)"/>
  <path class="f" d="M490 190H520V335H550" marker-end="url(#a)"/>
  <path class="f" d="M780 95H815V150H850" marker-end="url(#a)"/>
  <path class="f" d="M780 215H815V185H850" marker-end="url(#a)"/>
  <text class="n" x="850" y="250">Executor unchanged: policy gate, baseline check.</text>
  <text class="n" x="30" y="415">ADR-0036, Proposed. Never shown to the model: server address, query text, auth references.</text>
</svg>
