# Coverage is reported, never a gate: CI does not fail on it (see the coverage job in .github/workflows/test.yml).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

ignore:
  - "**/zz_generated.*.go"
  - "test/**"
  - "hack/**"
