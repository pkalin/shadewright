# How the diagnosis of statefulset-oom is scored: each fact of expected.yaml, verbatim, with the terms the
# result's summary, hypotheses or evidence quotes must contain (case ignored), or why it is not scored.
facts:
  - fact: OOMKilled from the container status (last state), not from an event reason
    all: ["OOMKilled"]
  - fact: the restart count of the cache container in cache-1, and that cache-0 is healthy and on the old template
    # The status block shows both pods, their restarts and the StatefulSet's revisions; the pod names are scored.
    all: ["cache-1", "cache-0"]
  - fact: the memory working set of cache-1 from Prometheus (container_memory_working_set_bytes) near the 48Mi limit
    # metrics.yaml records the working set and the limit of both pods; the metrics block shows them, and the
    # pod template line shows the limit too. The value matters, not where it was read (see oom).
    any: ["container_memory_working_set_bytes", "working set"]
    anyOf:
      - ["48Mi"]
      - ["50331648"]
      - ["5.03316e+07"]
      - ["container_memory_limit_bytes"]
