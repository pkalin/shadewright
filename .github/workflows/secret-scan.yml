name: Secret scan

# Scans Git history with gitleaks (default rules plus the allowlist in .gitleaks.toml) and fails on any finding.
# A pull request run scans only the commits the pull request brings (base..head from the event payload), so a fake
# credential on an unrelated pushed branch cannot fail it. A push to main or a manual run scans the full history of
# the checked-out ref, never the other branches that the full clone holds. Findings are printed redacted, so the log never holds a secret value. The scan always runs, whatever
# files changed: a secret can sit in any file, and the history scan takes about 15 seconds.
# Run the full-history check locally with: gitleaks git . --redact --no-banner --log-opts="--full-history HEAD"
# gitleaks is installed from the official release with a pinned sha256 (hack/install-gitleaks.sh), not through
# gitleaks/gitleaks-action, which asks organisations for a licence key.
# Called by ci.yml (the only trigger); always runs.
on:
  workflow_call:

permissions: {}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: hack/install-gitleaks.sh "${RUNNER_TEMP}/gitleaks-bin"

      - name: Scan the history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          log_opts="--full-history HEAD"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          fi
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" git . --redact --no-banner --log-opts="${log_opts}"
