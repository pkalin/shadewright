[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
# overrides/: the announcement bar, the 404 page and the Open Graph tags (templates only, no Markdown change).
custom_dir = "overrides"
# false: no Google Fonts request (the default theme loads Inter and JetBrains Mono from fonts.googleapis.com).
# Text uses the system font stacks and headings the self-hosted Chakra Petch, both set in brand.css.
font = false
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Dark only: one palette, so the theme renders no toggle and ignores the reader's colour preference.
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

# The Zensical defaults, set explicitly, plus snippets for the abbreviation glossary (includes/glossary.md).
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["includes"]
pymdownx.snippets.auto_append = ["glossary.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
