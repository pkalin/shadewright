name: Docs check

# Called by ci.yml (the only trigger), which decides from the changed files whether it runs. Builds the docs site
# with the hash-locked requirements and checks its internal links, heading anchors and published URLs
# (hack/docs-check.py, list in hack/docs-published-paths.txt). Publishing stays in docs.yml.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the job runs; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true

permissions: {}

jobs:
  docs-check:
    if: ${{ inputs.run != false }}
    name: docs check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install the docs requirements
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-docs.txt

      - name: Build the site and check it
        run: make docs-check
