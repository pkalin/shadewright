name: E2E Tests

# Called by ci.yml (the only trigger), which decides from the changed files whether it runs.
on:
  workflow_call:
    inputs:
      run:
        description: Whether the job runs; ci.yml passes false when no file of this group changed.
        type: boolean
        default: true

permissions: {}

env:
  GOFLAGS: -mod=readonly
  GOWORK: off

jobs:
  test-e2e:
    if: ${{ inputs.run != false }}
    permissions:
      contents: read
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Running Test e2e
        run: |
          # -diff detects go.mod/go.sum drift without mutating them.
          go mod tidy -diff
          make test-e2e
