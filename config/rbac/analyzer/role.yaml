---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: analyzer-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - list
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationsettings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationsettings/status
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analyzer-role
  namespace: system
rules:
- apiGroups:
  - ""
  resourceNames:
  - shadewright-analysis-budget
  resources:
  - configmaps
  verbs:
  - get
  - update
- apiGroups:
  - remediation.shadewright.io
  resources:
  - incidents
  - remediationrequests
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - remediation.shadewright.io
  resources:
  - incidents/status
  verbs:
  - update
