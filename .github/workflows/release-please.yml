name: Release

# Keeps one release pull request up to date from the Conventional Commits on main (AGENTS.md, "Commits").
# Merging it tags vX.Y.Z, updates CHANGELOG.md and creates the GitHub release. Images, signatures and the
# chart are built from that tag by later workflows (epic #22).
#
# The token comes from the shadewright-release GitHub App, not GITHUB_TOKEN, because pull requests opened
# with GITHUB_TOKEN do not trigger workflows and the required checks would never run on the release PR.
# The App's key lives in the `release` environment, which only deployments from main can use.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Mint a short-lived App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: shadewright
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
