{{- $_ := include "shadewright.validate" (dict "component" "executor" "context" $) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "executor" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadewright.labels" (dict "component" "executor" "context" $) | nindent 4 }}
  {{- if or .Values.executor.identity.azure.clientId .Values.executor.serviceAccount.annotations }}
  annotations:
    {{- with .Values.executor.identity.azure.clientId }}
    azure.workload.identity/client-id: {{ . | quote }}
    {{- end }}
    {{- with .Values.executor.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
