name: CodeQL

# CodeQL code scanning (advanced setup) for Go and for the workflows themselves (language `actions`). It runs on
# pushes to main and weekly, and deliberately NOT on pull requests: a pull request already gets golangci-lint with
# gosec for Go code and zizmor for workflow changes (workflow-lint.yml), and CodeQL's database build and analysis
# are the slowest scan of the graph. Results of main and of the weekly run appear in the Security tab.
#
# BEFORE THIS WORKFLOW'S FIRST RUN ON MAIN the repository's code scanning default setup must be switched off
# (Settings, Code security, Code scanning, CodeQL analysis, switch to advanced): GitHub refuses uploads from an
# advanced configuration while default setup is on, and the run fails. Switching it off is a repository setting
# and is done by the maintainer, not by this workflow.
#
# Go uses `build-mode: autobuild`, after setup-go with the release of go.mod's toolchain line (the same one the
# Dockerfile builds with): the repository is a plain Go module without cgo, so autobuild finds the module and
# builds it. `actions` needs no build (build-mode none).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the results
      contents: read
      actions: read # CodeQL reads the workflow run metadata of private repositories; harmless here
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # results are uploaded with a token that can write security events: no cache to poison

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the Go module
        if: ${{ matrix.build-mode == 'autobuild' }}
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
