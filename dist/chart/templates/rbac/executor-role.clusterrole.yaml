apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "executor-role" "context" $) }}
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects
  verbs:
  - get
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - get
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationpolicies
  - remediationsettings
  verbs:
  - get
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  verbs:
  - get
