{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
  name: remediationrequests.remediation.shadewright.io
spec:
  group: remediation.shadewright.io
  names:
    categories:
    - shadewright
    kind: RemediationRequest
    listKind: RemediationRequestList
    plural: remediationrequests
    shortNames:
    - rr
    singular: remediationrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - description: 'Reason of the PolicyAllowed condition: the policy decision'
      jsonPath: .status.conditions[?(@.type=="PolicyAllowed")].reason
      name: Policy
      type: string
    - jsonPath: .spec.action.type
      name: Action
      type: string
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.pullRequest.number
      name: PR
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RemediationRequest is one proposed fix: a typed action on one object, carried out as a GitOps pull request
          after deterministic policy allows it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the plan.
            properties:
              action:
                description: action is the typed change.
                properties:
                  adjustKedaMaxReplicas:
                    description: adjustKedaMaxReplicas holds the parameters for AdjustKedaMaxReplicas.
                    properties:
                      desiredValue:
                        description: desiredValue is the new maxReplicaCount.
                        format: int32
                        maximum: 1000
                        minimum: 1
                        type: integer
                      previousValue:
                        description: previousValue is the value the plan was made
                          against.
                        format: int32
                        maximum: 1000
                        minimum: 1
                        type: integer
                    required:
                    - desiredValue
                    - previousValue
                    type: object
                    x-kubernetes-validations:
                    - message: desiredValue must differ from previousValue
                      rule: self.desiredValue != self.previousValue
                  setContainerMemoryLimit:
                    description: setContainerMemoryLimit holds the parameters for
                      SetContainerMemoryLimit.
                    properties:
                      container:
                        description: container is the container name in the pod template.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      desired:
                        anyOf:
                        - type: integer
                        - type: string
                        description: desired is the new limit.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      previous:
                        anyOf:
                        - type: integer
                        - type: string
                        description: previous is the limit the plan was made against.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - container
                    - desired
                    - previous
                    type: object
                    x-kubernetes-validations:
                    - message: desired must differ from previous
                      rule: '!(quantity(string(self.previous)).asApproximateFloat()
                        >= -2e12 && quantity(string(self.previous)).asApproximateFloat()
                        <= 2e12 && quantity(string(self.desired)).asApproximateFloat()
                        >= -2e12 && quantity(string(self.desired)).asApproximateFloat()
                        <= 2e12) || quantity(string(self.desired)).compareTo(quantity(string(self.previous)))
                        != 0'
                    - message: previous and desired must be whole bytes
                      rule: '!(quantity(string(self.previous)).asApproximateFloat()
                        >= -2e12 && quantity(string(self.previous)).asApproximateFloat()
                        <= 2e12 && quantity(string(self.desired)).asApproximateFloat()
                        >= -2e12 && quantity(string(self.desired)).asApproximateFloat()
                        <= 2e12) || (quantity(string(self.previous)).isInteger() &&
                        quantity(string(self.desired)).isInteger())'
                    - message: previous must be between 1Mi and 1Ti
                      rule: quantity(string(self.previous)).asApproximateFloat() >=
                        -2e12 && quantity(string(self.previous)).asApproximateFloat()
                        <= 2e12 && quantity(string(self.previous)).compareTo(quantity('1Mi'))
                        >= 0 && quantity(string(self.previous)).compareTo(quantity('1Ti'))
                        <= 0
                    - message: desired must be between 1Mi and 1Ti
                      rule: quantity(string(self.desired)).asApproximateFloat() >=
                        -2e12 && quantity(string(self.desired)).asApproximateFloat()
                        <= 2e12 && quantity(string(self.desired)).compareTo(quantity('1Mi'))
                        >= 0 && quantity(string(self.desired)).compareTo(quantity('1Ti'))
                        <= 0
                  type:
                    description: type selects the action.
                    enum:
                    - AdjustKedaMaxReplicas
                    - SetContainerMemoryLimit
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: adjustKedaMaxReplicas must be set if and only if type is
                    AdjustKedaMaxReplicas
                  rule: 'self.type == ''AdjustKedaMaxReplicas'' ? has(self.adjustKedaMaxReplicas)
                    : !has(self.adjustKedaMaxReplicas)'
                - message: setContainerMemoryLimit must be set if and only if type
                    is SetContainerMemoryLimit
                  rule: 'self.type == ''SetContainerMemoryLimit'' ? has(self.setContainerMemoryLimit)
                    : !has(self.setContainerMemoryLimit)'
              approvalRequired:
                default: true
                description: |-
                  approvalRequired asks for human review. false is a request for automation that policy may refuse;
                  it never lowers policy or repository rules.
                type: boolean
              chainRoot:
                description: |-
                  chainRoot is the UID of the first request of the supersede chain: the replaced request's chainRoot, or
                  its own UID when it has none. Set together with replaces. The branch of the pull request derives from it
                  (shadewright/<chainRoot>), so every request of a chain works on the same branch and pull request.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              incidentRef:
                description: incidentRef is the incident this plan answers.
                properties:
                  name:
                    description: name of the Incident.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: uid of the Incident.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - name
                - uid
                type: object
              mode:
                default: GitOps
                description: mode is how the plan is carried out.
                enum:
                - GitOps
                type: string
              policyRef:
                description: policyRef names the RemediationPolicy that must allow
                  this plan.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              replaces:
                description: |-
                  replaces names the request this one replaces and the reviewer hint of that request it answers
                  (ADR-0028 section 4). Set only by the analyzer on a replacement, together with chainRoot. It is part of
                  the plan, so it is part of the request's name: the same plan answering another hint is another request.
                  The executor checks the link once, at the policy check, and then takes the pull request over (the handoff).
                properties:
                  hint:
                    description: hint is the pinned hint of the replaced request that
                      this plan answers.
                    properties:
                      commentID:
                        description: commentID is the comment's ID in the source.
                        format: int64
                        minimum: 1
                        type: integer
                      digest:
                        description: digest is the SHA-256 of the stored, redacted
                          hint text.
                        pattern: ^sha256:[0-9a-f]{64}$
                        type: string
                      source:
                        description: source is the system the comment is in.
                        enum:
                        - GitHub
                        type: string
                    required:
                    - commentID
                    - digest
                    - source
                    type: object
                  name:
                    description: name of the replaced request, in the same namespace.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid of the replaced request, so a request recreated
                      under the same name is never taken for it.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - hint
                - name
                - uid
                type: object
              reverts:
                description: |-
                  reverts names the request whose change this one undoes, by name and UID (ADR-0030 section 8). Set only on a
                  revert, which the analyzer's deterministic revert proposer creates for a request that ended Failed with
                  Verified False; a model proposal has no such field. A revert requires approvalRequired: true, never
                  replaces another request, and is never changed after create (the spec is immutable). The executor checks
                  the link before the policy check: the named request exists with this UID, ended Failed with Verified
                  False, is not a revert itself, has the same Incident, target and action type (and container), and this
                  request's previous and desired values are its desired and previous values; this request's name is
                  RevertName of that UID, so a failed request has at most one revert. Otherwise the request ends Denied
                  with reason InvalidRevert before any Git write. A revert is never checked for clearing: the verifier
                  writes no report for it, and once rolled out, configured and available for stableFor it ends
                  Inconclusive with reason RevertApplied, never Succeeded.
                properties:
                  name:
                    description: name of the request.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  uid:
                    description: uid of the request, so a request recreated under
                      the same name is never taken for it.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - name
                - uid
                type: object
              targetRef:
                description: targetRef is the live object the change is about.
                properties:
                  apiVersion:
                    description: apiVersion of the object, for example apps/v1 or
                      keda.sh/v1alpha1.
                    maxLength: 253
                    minLength: 1
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?v[0-9]+((alpha|beta)[0-9]+)?$
                    type: string
                  kind:
                    description: kind of the object.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Z][A-Za-z0-9]*$
                    type: string
                  name:
                    description: name of the object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: namespace of the object; empty for cluster-scoped
                      objects.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid of the object.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: targetRef.uid is required
                  rule: has(self.uid) && size(self.uid) > 0
                - message: targetRef.namespace is required
                  rule: has(self.namespace) && size(self.namespace) > 0
              verification:
                default: {}
                description: verification says when the change counts as a success.
                properties:
                  checks:
                    description: checks to run in addition to the ones the action
                      type always needs.
                    items:
                      description: |-
                        VerificationCheck is a named, deterministic check run after delivery. DeliveryRevisionApplied: the GitOps
                        controller has applied the revision that contains the merged change. WorkloadHealthy: the target workload
                        is available and its rollout is complete. KedaReady: the KEDA ScaledObject reports Ready=True, is not
                        paused (Paused=True, which a scale-in or scale-out pause also sets), is not on fallback (Fallback=True) and
                        its HPA can read its metrics (HPAActive is not False). QueueBacklogDecreasing: the backlog that drives the
                        ScaledObject is going down. NoNewOOMKills: no container of the target is OOMKilled after the change.
                      enum:
                      - DeliveryRevisionApplied
                      - WorkloadHealthy
                      - KedaReady
                      - QueueBacklogDecreasing
                      - NoNewOOMKills
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                  stableFor:
                    default: 3m
                    description: stableFor is how long all checks must hold.
                    type: string
                  timeout:
                    default: 10m
                    description: timeout is how long to wait for delivery and stability
                      before giving up.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: stableFor must be at least 1m
                  rule: '!has(self.stableFor) || duration(self.stableFor) >= duration(''1m'')'
                - message: timeout must be at most 24h
                  rule: '!has(self.timeout) || duration(self.timeout) <= duration(''24h'')'
                - message: timeout must be longer than stableFor
                  rule: '!has(self.timeout) || !has(self.stableFor) || duration(self.timeout)
                    > duration(self.stableFor)'
            required:
            - action
            - incidentRef
            - policyRef
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; a changed plan is a new RemediationRequest
              rule: self == oldSelf
            - message: AdjustKedaMaxReplicas can only target a keda.sh ScaledObject
              rule: self.action.type != 'AdjustKedaMaxReplicas' || (self.targetRef.apiVersion.startsWith('keda.sh/')
                && self.targetRef.kind == 'ScaledObject')
            - message: SetContainerMemoryLimit can only target an apps/v1 Deployment
                or StatefulSet
              rule: self.action.type != 'SetContainerMemoryLimit' || (self.targetRef.apiVersion
                == 'apps/v1' && self.targetRef.kind in ['Deployment', 'StatefulSet'])
            - message: replaces and chainRoot are set together or not at all
              rule: has(self.replaces) == has(self.chainRoot)
            - message: 'a revert (spec.reverts) requires approvalRequired: true'
              rule: '!has(self.reverts) || (has(self.approvalRequired) && self.approvalRequired)'
            - message: a revert (spec.reverts) never replaces another request
              rule: '!has(self.reverts) || !has(self.replaces)'
          status:
            description: status is the progress, written by the controller.
            properties:
              breakerClearedBy:
                description: |-
                  breakerClearedBy is the name of the request in Succeeded whose success made the executor set breakerCounts
                  to false on this one, written in the same status write. When that request is deleted, its finalizer sets
                  breakerCounts back to true on every request that names it, before the finalizer is removed. It is a
                  selectable field (field selector status.breakerClearedBy).
                maxLength: 253
                type: string
              breakerCounts:
                description: |-
                  breakerCounts says whether the executor's limits still read the request for the circuit breaker. It is
                  set in the status write that ends the request: true for a success (Merged or a later phase), a failure
                  (Failed, NeedsIntervention) or a probe (breakerProbe) that ended in any other way, false for any other
                  end. The executor sets it to false only when a newer request in Succeeded is recorded (breakerClearedBy
                  names it), and back to true when that request is deleted, or when a request whose deletion may still close
                  a pull request (NeedsIntervention, Expired) is being deleted. It is unset while the request has not ended
                  and on one that ended before the field existed; an unset request is read (fail closed), and the executor
                  sets the field once on an ended one from its status. It is a selectable field (field selector
                  status.breakerCounts), so the breaker reads only the outcomes that still count.
                type: boolean
              breakerProbe:
                description: |-
                  breakerProbe is true on a request the policy check let through while the circuit breaker was tripped
                  (half-open): it is the breaker's probe. It is written with the allowed decision and never cleared. The
                  breaker finds a running probe, or one that ended without a success, by this field only; a request
                  without it is not a probe. It is a selectable field (field selector status.breakerProbe).
                type: boolean
              commentCursor:
                description: |-
                  commentCursor is where the executor's next look at the comments of the pull request starts (ADR-0028
                  section 3). Only the executor writes it.
                properties:
                  afterID:
                    description: 'afterID: the comments of the current sweep with
                      an ID up to this one were returned already.'
                    format: int64
                    minimum: 0
                    type: integer
                  etag:
                    description: |-
                      etag is the entity tag of the last answer to the first page of a sweep that held no comment, sent as
                      If-None-Match, so an unchanged answer is "not modified" and costs no read.
                    maxLength: 256
                    pattern: ^(W/)?"[!#-~]*"$
                    type: string
                  evictedAt:
                    description: |-
                      evictedAt is the newest update time of the commands pushed out of seen by its bound; with evictedID it is
                      the watermark of those commands. A command with an ID up to evictedID and an update time up to evictedAt
                      counts as judged, so an evicted one returned again unchanged is not judged again, while one edited after
                      its judgement has a later update time and is. The watermark only grows, and is dropped once since passes
                      evictedAt. A command edited during a sweep and passed by it may count as judged too when more than
                      MaxSeenComments newer ones were judged first: it is then not judged, never accepted twice. Those newer
                      ones include commands from authors without write access, so anyone who can comment can cause this on
                      purpose; it fails closed (the edited command is missed, its author posts a new comment).
                    format: date-time
                    type: string
                  evictedID:
                    description: evictedID is the highest ID of the commands pushed
                      out of seen; set together with evictedAt.
                    format: int64
                    minimum: 0
                    type: integer
                  page:
                    description: page is the page the next look starts on; 0 starts
                      a new sweep.
                    format: int32
                    maximum: 100000
                    minimum: 0
                    type: integer
                  seen:
                    description: |-
                      seen are the commands the executor judged whose update time is at or after since, so a look that returns
                      them again unchanged (the overlap of two sweeps) does not judge them again: at most MaxSeenComments, the
                      newest. A comment returned with another update time was edited and is judged again.
                    items:
                      description: SeenComment is a comment the executor judged, with
                        the update time it had then.
                      properties:
                        commentID:
                          description: commentID is the comment's ID in the code host.
                          format: int64
                          minimum: 1
                          type: integer
                        updatedAt:
                          description: updatedAt is the comment's update time when
                            it was judged.
                          format: date-time
                          type: string
                      required:
                      - commentID
                      - updatedAt
                      type: object
                    maxItems: 50
                    type: array
                    x-kubernetes-list-map-keys:
                    - commentID
                    x-kubernetes-list-type: map
                  since:
                    description: |-
                      since is the oldest update time the current sweep of the comments asks for. Every comment created at or
                      before it was returned by an earlier look, so a command in one counts as an edit (EditedAfterSeen). That
                      is an assumption about the code host: the GitHub adapter sets since a minute before the host's time when
                      the previous sweep began, assuming a new comment shows up in the list within a minute. One that shows up
                      later is refused as EditedAfterSeen and has to be posted again: it fails closed.
                    format: date-time
                    type: string
                  sweepStart:
                    description: sweepStart is the code host's time when the current
                      sweep began.
                    format: date-time
                    type: string
                type: object
                x-kubernetes-validations:
                - message: etag is kept only on the first page of a new sweep
                  rule: '!has(self.etag) || ((!has(self.page) || self.page == 0) &&
                    (!has(self.afterID) || self.afterID == 0))'
                - message: evictedAt and evictedID are set together
                  rule: has(self.evictedAt) == (has(self.evictedID) && self.evictedID
                    > 0)
              conditions:
                description: |-
                  conditions explain the phase. Types: PolicyAllowed, PullRequestOpened, Approved, Delivered,
                  Verified, Configured, Cleared, PlanFresh, WritesPaused, Queued and RolledOut (after the merge: whether the target's
                  pods run the applied template; True with reason RolloutComplete, or RolloutPartitioned when a partitioned
                  StatefulSet keeps pods on the old revision on purpose; False with reason RolloutStuck or
                  DeliveryNotObserved, Unknown while in progress and with reason KindNotChecked, RolloutSuperseded or
                  RolloutNotDetermined when the check ends without a verdict).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deadline:
                description: |-
                  deadline is when the current step gives up, on the executor's clock. In WaitingForDelivery it is the end
                  of the delivery window: one hour after mergeReceipt.mergedAt, extended by the time writes were paused. In
                  Verifying it is the timeout, written on entering the phase: status.pullRequest.appliedObservedAt plus the
                  larger of spec.verification.timeout and the rollout deadline plus the effective stableFor plus the
                  executor's --node-grace. Past the merge a deadline never ends a request Expired: the evidence decides
                  between Failed and Inconclusive (ADR-0030 sections 2, 4 and 6).
                format: date-time
                type: string
              effectiveApprovalRequired:
                description: effectiveApprovalRequired is what policy decided, which
                  may be stricter than spec.approvalRequired.
                type: boolean
              handoff:
                description: |-
                  handoff records the supersede handoff (ADR-0028 section 4): on a replacement, the request it takes over
                  (from); on a predecessor, its replacement (to); a request in the middle of a chain has both. Each side is
                  never removed; Handoff says what may change. Only the executor writes it.
                properties:
                  from:
                    description: from is the incoming side, set on a replacement.
                    properties:
                      hint:
                        description: hint is the predecessor's hint the replacement
                          answers.
                        properties:
                          commentID:
                            description: commentID is the comment's ID in the source.
                            format: int64
                            minimum: 1
                            type: integer
                          digest:
                            description: digest is the SHA-256 of the stored, redacted
                              hint text.
                            pattern: ^sha256:[0-9a-f]{64}$
                            type: string
                          source:
                            description: source is the system the comment is in.
                            enum:
                            - GitHub
                            type: string
                        required:
                        - commentID
                        - digest
                        - source
                        type: object
                      name:
                        description: name of the predecessor.
