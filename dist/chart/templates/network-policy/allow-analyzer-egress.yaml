{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 4 }}
  name: {{ include "shadewright.resourceName" (dict "suffix" "allow-analyzer-egress" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  egress:
  {{- include "shadewright.dnsEgressRule" $ | nindent 2 }}
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
  {{- with .Values.networkPolicy.analyzer.prometheus }}
  {{- if .enabled }}
  {{- if not .namespace }}
  {{- fail "networkPolicy.analyzer.prometheus.namespace is empty: name the namespace of the Prometheus the analyzer queries, or leave networkPolicy.analyzer.prometheus.enabled=false" }}
  {{- end }}
  - ports:
    - port: {{ .port }}
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .namespace | quote }}
      podSelector:
        matchLabels:
          {{- toYaml .podLabels | nindent 10 }}
  {{- end }}
  {{- end }}
  {{- with .Values.networkPolicy.analyzer.traceCollector }}
  {{- if .enabled }}
  {{- if not .namespace }}
  {{- fail "networkPolicy.analyzer.traceCollector.namespace is empty: name the namespace of the OpenTelemetry collector, or leave networkPolicy.analyzer.traceCollector.enabled=false" }}
  {{- end }}
  - ports:
    - port: {{ .port }}
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .namespace | quote }}
      podSelector:
        matchLabels:
          {{- toYaml .podLabels | nindent 10 }}
  {{- end }}
  {{- end }}
  podSelector:
    matchLabels:
      app.kubernetes.io/component: analyzer
      app.kubernetes.io/name: {{ include "shadewright.name" . }}
  policyTypes:
  - Egress
{{- end }}
