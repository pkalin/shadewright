name: Release

# Keeps one release pull request up to date from the Conventional Commits on main (AGENTS.md, "Commits").
# Merging it tags vX.Y.Z, updates CHANGELOG.md and creates the GitHub release. Images, signatures and the
# chart are built from that tag by later workflows (epic #22), and the last of them (chart.yml) appends the
# image and chart digests and the verify commands to the body of this release, once the images and the chart
# are published. That append happens minutes after the regrouping below, which only runs right after the
# release is created, so the two do not race; never run the regrouping on a body that already has the section.
# release-please finds its last release by the version in .release-please-manifest.json, so a hand-made
# pre-release tag such as v0.2.0-rc.1 does not affect the next release.
#
# The token comes from the shadewright-release GitHub App, not GITHUB_TOKEN, because pull requests opened
# with GITHUB_TOKEN do not trigger workflows and the required checks would never run on the release PR.
# After the release is created, the next step regroups its GitHub release notes by Conventional Commit scope
# (hack/release-notes-by-scope.sh: API, Analyzer, Policy, ..., Other; features first inside each scope).
# CHANGELOG.md stays as release-please writes it. To regroup a release that already exists, by hand:
#   gh release view vX.Y.Z --json body -q .body | hack/release-notes-by-scope.sh > notes.md
#   gh release edit vX.Y.Z --notes-file notes.md
# The script only reads the release-please format, so run it on the original body, never on a regrouped one.
#
# The App's key lives in the `release` environment, which only deployments from main can use.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Mint a short-lived App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: shadewright
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Release please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Clone the code
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Group the release notes by scope
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          gh release view "${TAG}" --json body --jq .body | hack/release-notes-by-scope.sh > "${notes}"
          gh release edit "${TAG}" --notes-file "${notes}"
