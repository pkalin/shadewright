version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - logcheck
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Tests of the code that redacts or guards credentials hold synthetic secrets on purpose, to check
      # they never leak. Only these packages; a real key pasted into any other test is still reported.
      - linters:
          - gosec
        path: ^internal/(redact|providers/(github|github/auth|metrics/prometheus|registry|signer/azurekv))/[^/]+_test\.go$
        text: "^G101:"
      # Tests read fixtures from testdata and run helm, kubectl, kind and go: paths and commands are the
      # test's own, never cluster data.
      - linters:
          - gosec
        path: _test\.go$
        text: "^G(204|304):"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
