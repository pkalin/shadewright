{{- /*
One RoleBinding per watched namespace binds the read-only watch ClusterRole to the analyzer. Without it the
API server refuses the analyzer's reads there. The list is the same one --watch-namespaces gets.
*/ -}}
{{- range $ns := (required "analyzer.watchNamespaces needs at least one namespace" .Values.analyzer.watchNamespaces) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer-watch" "context" $) }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer-watch-role" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "shadewright.resourceName" (dict "suffix" "analyzer" "context" $) }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
