# Weekly dependency updates. Titles follow Conventional Commits (chore(deps), ci(deps)) so they pass the
# PR title check and stay out of the changelog. A human reviews and merges every update.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [minor, patch]
      go-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
