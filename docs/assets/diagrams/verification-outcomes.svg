<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 710" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
<title id="t">Shadewright verification outcomes</title>
<desc id="d">Overview of ADR-0030: the path of a RemediationRequest after the merge. Built: Merged, the rollout report, step 1 (the merge receipt and the end Inconclusive with reason NoMergeReceipt) and the VerificationReport type with its window checks, which nothing calls yet; everything else shown is planned. 1. The merge receipt, status.mergeReceipt, is written once in the status write that sets Merged and records repository.url and repository.installationID, targetBranch, pullRequest, headSHA, mergeCommitSHA and mergedAt; without a merge commit from the host the request ends Inconclusive with reason NoMergeReceipt. 2. Delivery is checked against the receipt: Merged moves to WaitingForDelivery with status.deadline one hour after mergedAt, the check asks about mergeCommitSHA on targetBranch, and when Flux applied the merge commit or a descendant the condition Delivered is True and the phase is Verifying; Flux failing on the merge commit itself ends Failed with reason DeliveryFailed. 3. Three outcomes are kept apart, each with its own condition: rolled out (Delivered and RolledOut, read with get on the Kustomization and the target and the host's ancestry answer), configured (Configured, the live field equals the desired value, read with get on the target) and cleared (Cleared, container status of the pods: no OOM kill, restarts flat against durable baselines, every desired replica on the applied revision). Cleared is read from a VerificationReport that a separate identity, shadewright-verifier, writes after listing the pods and verifying their owners; it has no model access and no Git App, and the executor checks the report's binding, age and coverage. The executor writes the three conditions and Verified sums them up. 4. The stable window runs while the request is Verifying: the verifier samples every 30 seconds and the executor rechecks the template and the report on every reconcile; a bad sample or a stale report moves windowStart forward and records lastReset; success needs good samples until windowStart plus stableFor plus nodeGrace. 5. Terminal phases: Succeeded (Cleared True, Verified True), Inconclusive (Verified Unknown with a reason) and Failed (Verified False with a reason). From Failed the analyzer creates a revert request with spec.reverts and approvalRequired true, which goes through policy (#96) and ends Inconclusive with reason RevertApplied, never Succeeded; Inconclusive never leads to a revert.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a879ff"/></marker>
