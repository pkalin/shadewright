{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "shadewright.labels" (dict "component" "analyzer" "context" $) | nindent 4 }}
  name: {{ include "shadewright.resourceName" (dict "suffix" "allow-analyzer-egress" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
  podSelector:
    matchLabels:
      app.kubernetes.io/component: analyzer
      app.kubernetes.io/name: {{ include "shadewright.name" . }}
  policyTypes:
  - Egress
{{- end }}
