apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shadewright.resourceName" (dict "suffix" "verifier-role" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shadewright.labels" (dict "component" "" "context" $) | nindent 4 }}
rules:
- apiGroups:
  - remediation.shadewright.io
  resources:
  - remediationrequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - remediation.shadewright.io
  resources:
  - verificationreports
  verbs:
  - create
  - get
- apiGroups:
  - remediation.shadewright.io
  resources:
  - verificationreports/status
  verbs:
  - update
