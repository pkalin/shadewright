# How the diagnosis of oom is scored: each fact of expected.yaml, verbatim, with the terms the result's
# summary, hypotheses or evidence quotes must contain (case ignored), or why it is not scored.
facts:
  - fact: OOMKilled from the container status (last state), not from an event reason
    all: ["OOMKilled"]
  - fact: the restart count of the web container
    # The context builder's status block shows the restart count, so it is scored already.
    all: ["restart"]
  - fact: the memory working set from Prometheus (container_memory_working_set_bytes) near the 48Mi limit
    # metrics.yaml records the working set and the limit; the context builder's metrics block shows both.
    # Scored on the metric names, which only the metrics block carries: the summary and hypotheses may
    # say "limit" and "working set" without any metric in the context.
    all: ["container_memory_working_set_bytes", "container_memory_limit_bytes"]
