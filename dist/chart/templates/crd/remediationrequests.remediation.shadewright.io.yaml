                      description: reason says why no hint was stored.
                      enum:
                      - CapReached
                      - TooLong
                      - NotRedactable
                      - Empty
                      - EditedAfterSeen
                      type: string
                    refusedAt:
                      description: refusedAt is when the executor refused it.
                      format: date-time
                      type: string
                    reply:
                      description: |-
                        reply records the executor's reply to the refused command in the pull request (ADR-0028 section 7).
                        Once set it never changes.
                      enum:
                      - Posted
                      - NotRedactable
                      - TooManyComments
                      - Refused
                      - GaveUp
                      type: string
                    source:
                      description: source is the system the comment is in.
                      enum:
                      - GitHub
                      type: string
                  required:
                  - author
                  - commentID
                  - reason
                  - refusedAt
                  - source
                  type: object
                  x-kubernetes-validations:
                  - message: the reply to a refused hint never changes once set
                    rule: '!has(oldSelf.reply) || (has(self.reply) && self.reply ==
                      oldSelf.reply)'
                maxItems: 10
                type: array
                x-kubernetes-list-map-keys:
                - source
                - commentID
                x-kubernetes-list-type: map
              rollout:
                description: rollout is what the check after the merge keeps between
                  reconciles (the RolledOut condition).
                properties:
                  appliedRevision:
                    description: |-
                      appliedRevision is the commit the GitOps controller reported applied when the executor first saw the merge
                      commit delivered: the merge commit, or a later commit of the target branch that holds it.
                    maxLength: 40
                    minLength: 40
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  ended:
                    description: ended is true once the check gave its final verdict
                      in RolledOut; nothing is read for it after that.
                    type: boolean
                  pausedSeconds:
                    description: |-
                      pausedSeconds is how long, in seconds, writes were paused while the executor waited for the delivery; the
                      delivery window is extended by it (and by the pause still running), so a pause never uses up the window.
                      It never decreases.
                    format: int64
                    minimum: 0
                    type: integer
                  pausedSince:
                    description: |-
                      pausedSince is when the executor first saw writes paused (RemediationSettings spec.paused) while it waited
                      for the delivery; cleared when it sees them resumed, the paused time then added to pausedSeconds. It is
                      never moved while set.
                    format: date-time
                    type: string
                  targetGeneration:
                    description: |-
                      targetGeneration is the target's metadata.generation read right after appliedRevision was seen applied:
                      the generation the applied commit produced.
                    format: int64
                    minimum: 0
                    type: integer
                  templateHash:
                    description: |-
                      templateHash is the SHA-256 of the target's pod template at targetGeneration. When the target's controller
                      first reports a generation past targetGeneration, the revision it names is recorded only if the template
                      is still this one; otherwise the check ends with RolledOut Unknown, reason RolloutSuperseded.
                    maxLength: 64
                    minLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  templateRevision:
                    description: |-
                      templateRevision is the template revision the check judges: a StatefulSet's status.updateRevision or a
                      Deployment's deployment.kubernetes.io/revision annotation, read once the controller observed
                      targetGeneration and the target's current generation (a revision annotation can name a later generation
                      before the status does), and, past targetGeneration, only while the template still matches templateHash. A newer revision
                      ends the check with RolledOut Unknown, reason RolloutSuperseded.
                    maxLength: 253
                    type: string
                  waitStartedAt:
                    description: |-
                      waitStartedAt is when the executor started waiting for the delivery of a merged request that has no
                      lastPhaseTransitionTime; the delivery window is then measured from it instead of from the merge.
                    format: date-time
                    type: string
                type: object
              source:
                description: source is where the change is made, resolved by the controller
                  before the policy check.
                properties:
                  baseCommit:
                    description: |-
                      baseCommit is the full SHA of the target branch the change was made against. It is fixed when the branch
                      is created; later merges to the target branch do not change it.
                    pattern: ^[0-9a-f]{40}$
                    type: string
                  buildPath:
                    description: |-
                      buildPath is the directory the Flux Kustomization builds (its spec.path, "." for the repository root).
                      Before every commit the pull request step renders it with and without the change and refuses anything
                      but the planned difference (design 8.2, steps 4 and 5). The policy check always sets it, and the plan
                      digest covers it; a request without it is never committed.
                    maxLength: 512
                    minLength: 1
                    pattern: ^(\.|[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*)$
                    type: string
                  path:
                    description: path is the file that declares the target.
                    maxLength: 512
                    minLength: 1
                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*\.ya?ml$
                    type: string
                  repositoryRef:
                    description: repositoryRef is the RemediationSettings entry whose
                      URL matches the Flux source.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  targetBranch:
                    description: |-
                      targetBranch is the branch the pull request targets: the branch Flux tracks, which must equal the
                      repository's targetBranch in RemediationSettings.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_.-]*(/[A-Za-z0-9_][A-Za-z0-9_.-]*)*$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a plain branch name, not HEAD, refs/..., shadewright/...
                        or one containing '..' or '.lock'
                      rule: '!self.contains(''..'') && !self.endsWith(''.lock'') &&
                        !self.contains(''.lock/'') && self != ''HEAD'' && !self.startsWith(''refs/'')
                        && !self.startsWith(''shadewright/'')'
                required:
                - baseCommit
                - path
                - repositoryRef
                - targetBranch
                type: object
              verification:
                description: |-
                  verification is the executor's own stable window while the request is Verifying (ADR-0030 section 4). Only
                  the executor writes it; once set it is kept, windowStart and the time of lastReset only move forward and
                  resets never decreases (validation rules on the object).
                properties:
                  lastReset:
                    description: lastReset is the last reset of the window. Kept once
                      set; its time never moves back.
                    properties:
                      reason:
                        description: |-
                          reason says why the window was reset: NotAvailable (the target reports other available replicas than
                          desired, fewer or more, or a ScaledObject is not ready by the KedaReady rule), StaleReport (the verifier's report is
                          missing, was never sampled, or its sample counter stopped rising), ReportMismatch (the report names another
                          request, merge commit, target, template revision or container) or PartialRollout (the report does not cover
                          every desired replica). Every one is a reset of the no-evidence class.
                        enum:
                        - NotAvailable
                        - StaleReport
                        - ReportMismatch
                        - PartialRollout
                        type: string
                      time:
                        description: |-
                          time is when the reset was recorded, on the executor's clock. It is never earlier than windowStart at that
                          moment or the previous reset, so the window is open only while windowStart is later than it.
                        format: date-time
                        type: string
                    required:
                    - reason
                    - time
                    type: object
                  resets:
                    description: |-
                      resets counts the resets of the window: a bad check that closes an open window or names another reason
                      than lastReset. The same reason again on a closed window is not counted and writes nothing. It never
                      decreases, and it is at least 1 while lastReset is set.
                    format: int64
                    minimum: 0
                    type: integer
                  windowStart:
                    description: |-
                      windowStart is when the current window opened: the first good check after the last reset. It only moves
                      forward.
                    format: date-time
                    type: string
                type: object
                x-kubernetes-validations:
                - message: lastReset requires resets of at least 1
                  rule: '!has(self.lastReset) || (has(self.resets) && self.resets
                    >= 1)'
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: status.pullRequest.mergeCommitSHA is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.pullRequest) || !has(oldSelf.status.pullRequest.mergeCommitSHA)
            || (has(self.status) && has(self.status.pullRequest) && has(self.status.pullRequest.mergeCommitSHA)
            && self.status.pullRequest.mergeCommitSHA == oldSelf.status.pullRequest.mergeCommitSHA)'
        - message: status.pullRequest.appliedObservedAt is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.pullRequest) || !has(oldSelf.status.pullRequest.appliedObservedAt)
            || (has(self.status) && has(self.status.pullRequest) && has(self.status.pullRequest.appliedObservedAt)
            && self.status.pullRequest.appliedObservedAt == oldSelf.status.pullRequest.appliedObservedAt)'
        - message: status.mergeReceipt is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.mergeReceipt) || (has(self.status)
            && has(self.status.mergeReceipt) && self.status.mergeReceipt == oldSelf.status.mergeReceipt)'
        - message: status.mergeReceipt.mergeCommitSHA must equal status.pullRequest.mergeCommitSHA
          rule: '!has(self.status) || !has(self.status.mergeReceipt) || (has(self.status.pullRequest)
            && has(self.status.pullRequest.mergeCommitSHA) && self.status.mergeReceipt.mergeCommitSHA
            == self.status.pullRequest.mergeCommitSHA)'
        - message: status.mergeReceipt.pullRequest, headSHA and mergedAt must equal
            status.pullRequest.number, headSHA and mergedAt
          rule: '!has(self.status) || !has(self.status.mergeReceipt) || (has(self.status.pullRequest)
            && self.status.mergeReceipt.pullRequest == self.status.pullRequest.number
            && self.status.mergeReceipt.headSHA == self.status.pullRequest.headSHA
            && has(self.status.pullRequest.mergedAt) && self.status.mergeReceipt.mergedAt
            == self.status.pullRequest.mergedAt)'
        - message: status.mergeCommitAwaitedSince is set once and never changed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.mergeCommitAwaitedSince)
            || (has(self.status) && has(self.status.mergeCommitAwaitedSince) && self.status.mergeCommitAwaitedSince
            == oldSelf.status.mergeCommitAwaitedSince)'
        - message: status.mergeReceipt is set only in Merged or a phase after it
          rule: '!has(self.status) || !has(self.status.mergeReceipt) || (has(self.status.phase)
            && !(self.status.phase in [''Pending'', ''PolicyChecked'', ''PRCreated'',
            ''AwaitingApproval'', ''AutoMergeQueued'']))'
        - message: status.phase WaitingForDelivery and Verifying require status.mergeReceipt
          rule: '!has(self.status) || !has(self.status.phase) || !(self.status.phase
            in [''WaitingForDelivery'', ''Verifying'']) || has(self.status.mergeReceipt)'
        - message: status.phase Verifying requires status.pullRequest.appliedObservedAt
          rule: '!has(self.status) || !has(self.status.phase) || self.status.phase
            != ''Verifying'' || (has(self.status.pullRequest) && has(self.status.pullRequest.appliedObservedAt))'
        - message: 'status.hints: a stored hint is never removed'
          rule: '!has(oldSelf.status) || !has(oldSelf.status.hints) || (has(self.status)
            && has(self.status.hints) && oldSelf.status.hints.all(o, self.status.hints.exists(h,
            h.source == o.source && h.commentID == o.commentID)))'
        - message: status.handoff.from is never removed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.handoff) || !has(oldSelf.status.handoff.from)
            || (has(self.status) && has(self.status.handoff) && has(self.status.handoff.from))'
        - message: status.handoff.to is never removed
          rule: '!has(oldSelf.status) || !has(oldSelf.status.handoff) || !has(oldSelf.status.handoff.to)
            || (has(self.status) && has(self.status.handoff) && has(self.status.handoff.to))'
        - message: status.handoff.from starts in Reserved
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.from)
            || self.status.handoff.from.phase == ''Reserved'' || (has(oldSelf.status)
            && has(oldSelf.status.handoff) && has(oldSelf.status.handoff.from))'
        - message: status.handoff.to starts in Intent
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.to)
            || self.status.handoff.to.phase == ''Intent'' || (has(oldSelf.status)
            && has(oldSelf.status.handoff) && has(oldSelf.status.handoff.to))'
        - message: status.handoff.from must match spec.replaces
          rule: '!has(self.status) || !has(self.status.handoff) || !has(self.status.handoff.from)
            || (has(self.spec.replaces) && self.status.handoff.from.name == self.spec.replaces.name
            && self.status.handoff.from.uid == self.spec.replaces.uid && self.status.handoff.from.hint.source
            == self.spec.replaces.hint.source && self.status.handoff.from.hint.commentID
            == self.spec.replaces.hint.commentID && self.status.handoff.from.hint.digest
