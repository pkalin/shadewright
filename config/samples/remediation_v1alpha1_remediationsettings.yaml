# The one cluster-wide settings object. Set paused: true to stop every write at once (the kill switch).
apiVersion: remediation.shadewright.io/v1alpha1
kind: RemediationSettings
metadata:
  name: default
spec:
  paused: false
  maxConcurrentRemediations: 1
  maxAnalysesPerDay: 100
  repositories:
    - name: fleet
      url: https://github.com/example/fleet
      targetBranch: main
      provider: GitHub
      github:
        appClientID: Iv23exampleclientid
        installationID: 12345678
        signer:
          azureKeyVault:
            keyID: https://kv-example.vault.azure.net/keys/github-app
  # Modules contribute only when enabled here and detected in the cluster. Once the analyzer writes status
  # (planned, #61), status.platform shows the detected platform and the one in use (generic when the detected
  # one is not enabled here) and status.integrations each integration. Status is a report, never an input.
  # The generic platform is always on and is not listed.
  modules:
    platforms: [aks]
    integrations: [keda, flux]
