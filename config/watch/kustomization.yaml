# The namespaces the analyzer watches (#155): one RoleBinding per namespace in the analyzer's
# --watch-namespaces (config/manager/analyzer.yaml), each binding the read-only analyzer-watch-role there.
# Built on its own, not from config/default: that one sets every namespace to shadewright-system, and these
# bindings must stay in the watched namespaces. Names are final (prefix applied), so keep them in step with
# config/default. The namespaces must exist before this is applied. test/rbac checks the list against the flag.
# The KEDA module's reads (analyzer-watch-keda, in config/default) are on by default, as the chart's
# analyzer.modules.keda.enabled is, and bound here the same way; the other modules' reads are off by default and
# live only in config/modules.
# The verifier's reads (ADR-0030 section 7) are bound the same way: one RoleBinding of verifier-watch-role per
# namespace in the verifier's --watch-namespaces (config/manager/verifier.yaml), checked against that flag by
# test/rbac. Never a ClusterRoleBinding.
resources:
- role_binding_demo.yaml
- role_binding_keda_demo.yaml
- role_binding_verifier_demo.yaml
